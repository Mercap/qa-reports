    const { conBaseline: histConBaseline, runs: histRuns } = buildHistoricoRawAndBaseline();
    const patronMode = state.patronMode || "top10";
    const histNormales = histRuns.filter((r) => !r.escenario).length;
    const histDisponible = histNormales >= HIST_MIN_CORRIDAS;
    const historicoBase = buildHistoricoViewModel(histConBaseline, histRuns, patronMode);

    // ============================================================================
    // Escenarios: catalogo + detalle + comparar-contra-otro (2026-09-18, réplica más completa de
    // pepper-API-testing a pedido de Carlos - ver comentario junto a buildEscenariosCatalogo).
    // ============================================================================
    const escenariosCatalogoRaw = buildEscenariosCatalogo(histConBaseline);
    const hayEscenarios = escenariosCatalogoRaw.length > 0;
    // Sin corridas de escenario se arma un contexto vacío para no romper el armado de abajo; la
    // sección muestra su estado vacío (historico.escenarios.vacio).
    if (!hayEscenarios) escenariosCatalogoRaw.push({ nombre: "", corridas: [], corridasCount: 0, primeraFecha: null, ultimaFecha: null, ultimaVersion: null, endpointsLast: new Map(), vacio: true });
    const escenarioSelNombre = (state.escenarioSeleccionado && escenariosCatalogoRaw.some((c) => c.nombre === state.escenarioSeleccionado))
      ? state.escenarioSeleccionado
      : escenariosCatalogoRaw[0].nombre;
    const ctxSel = escenariosCatalogoRaw.find((c) => c.nombre === escenarioSelNombre);
    const findingsSel = escenarioFindings(ctxSel);
    const narrativaSel = escenarioNarrativa(ctxSel, findingsSel);

    const escenarioCatalogoRows = escenariosCatalogoRaw.map((ctx) => {
      const f = escenarioFindings(ctx);
      return {
        nombre: ctx.nombre,
        corridasLabel: ctx.corridasCount + (ctx.corridasCount === 1 ? ' corrida' : ' corridas'),
        rangoFechas: ctx.primeraFecha === ctx.ultimaFecha ? ctx.ultimaFecha : (ctx.primeraFecha + ' → ' + ctx.ultimaFecha),
        ultimaVersion: ctx.ultimaVersion,
        resumenChip: f.degraded.length ? (f.degraded.length + ' degradado' + (f.degraded.length === 1 ? '' : 's')) : (f.improved.length ? (f.improved.length + ' mejorado' + (f.improved.length === 1 ? '' : 's')) : 'sin cambios notables'),
        resumenColorVar: f.degraded.length ? colorVar('fail') : (f.improved.length ? colorVar('ok') : 'var(--text-faint)'),
        extraClass: ctx.nombre === escenarioSelNombre ? 'selected' : '',
        select: () => this.setState({ escenarioSeleccionado: ctx.nombre, escenarioComparar: null, escenarioTablaMode: 'top10', escenarioDegExpand: false, escenarioMejExpand: false }),
      };
    });

    const ESCN_LIST_TOP_N = 4;
    const degExpand = !!state.escenarioDegExpand;
    const mejExpand = !!state.escenarioMejExpand;
    const toScnListItem = (e) => ({ name: shortNameHist(e.endpoint), deltaLabel: deltaLabel(e.f.deltaGlobalPct) });
    const degradosVisible = (degExpand ? findingsSel.degraded : findingsSel.degraded.slice(0, ESCN_LIST_TOP_N)).map(toScnListItem);
    const mejoradosVisible = (mejExpand ? findingsSel.improved : findingsSel.improved.slice(0, ESCN_LIST_TOP_N)).map(toScnListItem);

    // Tercer tile: peor caso si hay degradados, si no el mejor caso (misma logica que pepper - la
    // noticia relevante de la corrida, no "peor caso" vacio solo porque no hubo nada negativo).
    const scnThird = findingsSel.degraded[0]
      ? { label: 'Peor caso', item: findingsSel.degraded[0], colorVar: colorVar('fail') }
      : (findingsSel.improved[0] ? { label: 'Mejor caso', item: findingsSel.improved[0], colorVar: colorVar('ok') } : null);

    const escenarioTablaMode = state.escenarioTablaMode || 'top10';
    const tablaCompletaAll = [];
    ctxSel.endpointsLast.forEach((f, endpoint) => tablaCompletaAll.push({ endpoint, f }));
    tablaCompletaAll.sort((a, b) => Math.abs(b.f.deltaGlobalPct || 0) - Math.abs(a.f.deltaGlobalPct || 0));
    const ESCN_TABLA_TOP_N = 10;
    const tablaCompletaRows = (escenarioTablaMode === 'all' ? tablaCompletaAll : tablaCompletaAll.slice(0, ESCN_TABLA_TOP_N)).map(({ endpoint, f }) => ({
      name: shortNameHist(endpoint),
      p95EscenarioLabel: msLabel(f.p95),
      p95FrecuenteLabel: f.baselineGlobal ? msLabel(f.baselineGlobal) : '-',
      deltaFrecuenteLabel: deltaLabel(f.deltaGlobalPct),
      deltaFrecuenteColorVar: colorVarFromPctSimple(f.deltaGlobalPct),
      deltaPropioLabel: (ctxSel.corridasCount > 1 && f.baselineOwn != null) ? deltaLabel(f.deltaOwnPct) : '—',
      deltaPropioColorVar: (ctxSel.corridasCount > 1 && f.baselineOwn != null) ? colorVarFromPctSimple(f.deltaOwnPct) : 'var(--text-faint)',
    }));

    const escenarioOtros = escenariosCatalogoRaw.filter((c) => c.nombre !== escenarioSelNombre);
    const escenarioCompararNombre = (state.escenarioComparar && escenarioOtros.some((c) => c.nombre === state.escenarioComparar)) ? state.escenarioComparar : null;
    const escenarioCompararChips = escenarioOtros.map((c) => ({
      nombre: c.nombre,
      extraClass: c.nombre === escenarioCompararNombre ? 'selected' : '',
      toggle: () => this.setState({ escenarioComparar: c.nombre === escenarioCompararNombre ? null : c.nombre }),
    }));
    let escenarioCompararRows = [];
    let ctxCmp = null;
    if (escenarioCompararNombre) {
      ctxCmp = escenarioOtros.find((c) => c.nombre === escenarioCompararNombre);
      escenarioCompararRows = escenarioCompararFilas(ctxSel, ctxCmp).map((r) => ({
        name: shortNameHist(r.endpoint),
        pALabel: msLabel(r.fa.p95),
        pBLabel: msLabel(r.fb.p95),
        deltaLabel: r.delta == null ? '—' : deltaLabel(r.delta),
        deltaColorVar: r.delta == null ? 'var(--text-faint)' : colorVarFromPctSimple(r.delta),
      }));
    }

    const escenarios = {
      disponible: hayEscenarios,
      vacio: !hayEscenarios,
      vacioTexto: "No hay corridas de escenario (cambios sin deploy) en metrics/gs32/ con la clave de esta corrida.",
      catalogo: hayEscenarios ? escenarioCatalogoRows : [],
      seleccionado: {
        nombre: ctxSel.nombre,
        corridasLabel: ctxSel.corridasCount + (ctxSel.corridasCount === 1 ? ' corrida' : ' corridas'),
        rangoFechas: ctxSel.primeraFecha === ctxSel.ultimaFecha ? ctxSel.ultimaFecha : (ctxSel.primeraFecha + ' → ' + ctxSel.ultimaFecha),
        ultimaVersion: ctxSel.ultimaVersion,
        esUnaSolaCorrida: ctxSel.corridasCount <= 1,
        degradedCount: findingsSel.degraded.length,
        improvedCount: findingsSel.improved.length,
        measuredCount: findingsSel.measured,
        hasThird: !!scnThird,
        thirdLabel: scnThird ? scnThird.label : '',
        thirdValueLabel: scnThird ? deltaLabel(scnThird.item.f.deltaGlobalPct) : '—',
        thirdSubLabel: scnThird ? shortNameHist(scnThird.item.endpoint) : 'sin cambios notables',
        thirdColorVar: scnThird ? scnThird.colorVar : 'var(--text-faint)',
        narrativa: narrativaSel,
        hasHallazgos: findingsSel.degraded.length > 0 || findingsSel.improved.length > 0,
        sinHallazgos: findingsSel.degraded.length === 0 && findingsSel.improved.length === 0,
        degradados: degradosVisible,
        hasDegradados: findingsSel.degraded.length > 0,
        degradadosHasMore: findingsSel.degraded.length > ESCN_LIST_TOP_N,
        degradadosToggleLabel: degExpand ? 'Ver menos' : 'Ver ' + (findingsSel.degraded.length - ESCN_LIST_TOP_N) + ' más',
        mejorados: mejoradosVisible,
        hasMejorados: findingsSel.improved.length > 0,
        mejoradosHasMore: findingsSel.improved.length > ESCN_LIST_TOP_N,
        mejoradosToggleLabel: mejExpand ? 'Ver menos' : 'Ver ' + (findingsSel.improved.length - ESCN_LIST_TOP_N) + ' más',
        tablaRows: tablaCompletaRows,
        tablaTotalCount: tablaCompletaAll.length,
        tablaShownCount: tablaCompletaRows.length,
        tablaMode: escenarioTablaMode,
        tablaViewTopExtra: escenarioTablaMode === 'top10' ? 'active' : '',
        tablaViewAllExtra: escenarioTablaMode === 'all' ? 'active' : '',
        setTablaTop10: () => this.setState({ escenarioTablaMode: 'top10' }),
        setTablaAll: () => this.setState({ escenarioTablaMode: 'all' }),
        toggleDegExpand: () => this.setState({ escenarioDegExpand: !degExpand }),
        toggleMejExpand: () => this.setState({ escenarioMejExpand: !mejExpand }),
      },
      comparar: {
        chips: escenarioCompararChips,
        hasOtros: escenarioOtros.length > 0,
        sinOtros: escenarioOtros.length === 0,
        activo: escenarioCompararNombre,
        hasActivo: !!escenarioCompararNombre,
        sinActivo: !escenarioCompararNombre,
        otroNombre: ctxCmp ? ctxCmp.nombre : '',
        rows: escenarioCompararRows,
        hasRows: escenarioCompararRows.length > 0,
      },
    };

    // ---- Resource Impact Ranking, HISTORICO (a pedido de Carlos, reemplaza la version de una
    // sola corrida): MISMA formula que el panel real de pepper-API-testing
    // (generate-metrics.js: impact_score = baseline_global x total_ejecuciones ACUMULADAS a
    // traves de TODAS las corridas, no solo la ultima). El arbol de escenario NO suma acá, mismo
    // criterio que en todo el resto del historico: no contamina la historia "normal".
    const totalIteracionesPorEndpoint = new Map();
    histConBaseline.forEach((f) => {
      if (f.escenario) return;
      totalIteracionesPorEndpoint.set(f.endpoint, (totalIteracionesPorEndpoint.get(f.endpoint) || 0) + f.iterations);
    });
    const impactTop = RAW_NAMES.map((ep) => {
      const filasEp = histConBaseline.filter((f) => f.endpoint === ep && !f.escenario);
      const ultima = filasEp[filasEp.length - 1];
      const totalIter = totalIteracionesPorEndpoint.get(ep) || 0;
      // baseline_global de la ULTIMA corrida (el mas representativo del comportamiento "normal"
      // reciente del endpoint) - si todavia no tiene baseline (primera corrida), cae a su propio
      // p95 mas reciente, mismo fallback que usa pepper ("baselineGlobal || p95").
      const p95Ref = ultima ? (ultima.baselineGlobal || ultima.p95) : 0;
      const score = Math.round(p95Ref * totalIter);
      return {
        name: shortNameHist(ep),
        resource: resourceOf(ep),
        p95Label: msLabel(p95Ref),
        totalIterLabel: totalIter.toLocaleString("es-AR"),
        scoreLabel: score.toLocaleString("es-AR"),
        scoreRaw: score,
      };
    })
      .sort((a, b) => b.scoreRaw - a.scoreRaw)
      .slice(0, 10);

    // ---- Panel grande: tendencia historica de UN endpoint elegido, a traves de las versiones ----
    // Endpoint inicial del inspector: el de peor p95 de esta corrida (antes, uno fijo del mockup).
    const inspectorDefault = poolTodos[0] ? poolTodos[0].name : RAW_NAMES[0];
    const inspectorEndpointName = (state.inspectorEndpoint && RAW_NAMES.indexOf(state.inspectorEndpoint) !== -1)
      ? state.inspectorEndpoint
      : inspectorDefault;
    const inspectorResource = state.inspectorResource || resourceOf(inspectorEndpointName);

    const inspectorResourceChips = RESOURCES.map((res) => ({
      label: res,
      extraClass: res === inspectorResource ? "selected" : "",
      pick: () => {
        // Cambiar de API resetea el endpoint elegido al primero de esa API - mismo criterio que
        // el filtro de "Por endpoint": una seleccion fina de otra API no tiene sentido despues.
        const primero = RAW_NAMES.find((n) => resourceOf(n) === res);
        this.setState({ inspectorResource: res, inspectorEndpoint: primero });
      },
    }));
    const inspectorEndpointChips = RAW_NAMES.filter((n) => resourceOf(n) === inspectorResource).map((n) => ({
      name: methodOf(n),
      extraClass: n === inspectorEndpointName ? "selected" : "",
      pick: () => this.setState({ inspectorEndpoint: n }),
    }));
    const inspRuns = histRuns;
    const N_INSP = inspRuns.length;
    const inspRows = inspRuns.map((run) => histConBaseline.find((f) => f.endpoint === inspectorEndpointName && f.timestamp === run.runId) || { p95: 0, throughput: 0, errorRatePct: 0, timestamp: run.runId, escenario: run.escenario });
    const inspP95Vals = inspRows.map((r) => r.p95);
    const inspTpsVals = inspRows.map((r) => r.throughput);
    const inspErrVals = inspRows.map((r) => r.errorRatePct);

    const gInspP95 = chartGeom(inspP95Vals, 480, 200, 10, 24);
    const gInspTps = chartGeom(inspTpsVals, 480, 200, 10, 24);
    const gInspErr = chartGeom(inspErrVals, 480, 200, 10, 24);

    const hoverInsp = hover.chart === "histoTrend";
    const idxInsp = hoverInsp ? hover.index : N_INSP - 1;

    // Limites de version: donde la version CAMBIA respecto de la corrida anterior, para dibujar
    // una linea vertical - la corrida de escenario no dispara un limite nuevo porque comparte
    // version con sus vecinas (ver buildHistoricoRuns).
    const versionBoundaries = [];
    let prevVersionInsp = null;
    inspRuns.forEach((run, i) => {
      if (run.version !== prevVersionInsp) {
        versionBoundaries.push({ x: xAt(i, N_INSP, 480).toFixed(1), colorVar: versionColorFor(run.version) });
        prevVersionInsp = run.version;
      }
    });
    const versionLegendParts = HISTORICO_VERSIONS.map((v) => {
      const primerRun = inspRuns.find((r) => r.version === v && !r.escenario);
      return v + " desde " + (primerRun ? primerRun.fecha : "?");
    }).join(" · ");

    // Con varias corridas de escenario (antes 1), este circulo hueco necesita marcar TODAS, no solo la
    // primera - por eso es una lista, no un indice unico como en la v26.
    const escenarioPointsInsp = [];
    inspRuns.forEach((r, i) => {
      if (!r.escenario) return;
      escenarioPointsInsp.push({ x: xAt(i, N_INSP, 480).toFixed(1), y: gInspP95.pts[i][1].toFixed(1) });
    });

    // ---- Deteccion de anomalias para ESTE endpoint (pedido de Carlos: "es posible?") ----------
    // Sobre las filas SIN escenario, en orden cronologico (mismo orden que inspRuns, filtrando el
    // indice que corresponde a la corrida de escenario).
    const inspRowsNormales = inspRows.filter((r) => !r.escenario);
    const { picos: inspPicos, cambios: inspCambios } = detectarAnomaliasHistoricas(inspRowsNormales);
    const anomaliaMarkers = [];
    inspRowsNormales.forEach((row) => {
      const dir = directionDeEstado(row.estado);
      if (!dir) return;
      const iReal = inspRuns.findIndex((r) => r.runId === row.timestamp);
      if (iReal === -1) return;
      anomaliaMarkers.push({
        x: xAt(iReal, N_INSP, 480).toFixed(1),
        y: gInspP95.pts[iReal][1].toFixed(1),
        colorVar: dir === "degradacion" ? colorVar("fail") : colorVar("ok"),
      });
    });
    const anomaliasResumenParts = [];
    inspPicos.forEach((p) => anomaliasResumenParts.push(
      (p.tipo === "degradacion" ? "pico" : "caída") + " aislado en " + p.fecha + " " + p.hora + " (" + p.version + ", " + p.deltaLabel + ")"
    ));
    inspCambios.forEach((c) => anomaliasResumenParts.push(
      (c.tipo === "degradacion" ? "degradación" : "mejora") + " sostenida desde " + c.fecha + " " + c.hora + " (" + c.version + ", " + c.deltaLabel + ", " + c.largo + " corridas seguidas)"
    ));

    const inspector = {
      resourceChips: inspectorResourceChips,
      endpointChips: inspectorEndpointChips,
      hasEndpointChips: inspectorEndpointChips.length > 0,
      anomaliaMarkers,
      hasAnomalias: anomaliasResumenParts.length > 0,
      anomaliasResumen: anomaliasResumenParts.length > 0 ? anomaliasResumenParts.join(" · ") : "sin picos aislados ni cambios sostenidos detectados contra el baseline_global de este endpoint.",
      selectedName: methodOf(inspectorEndpointName),
      selectedFull: inspectorEndpointName,
      p95Points: gInspP95.points,
      tpsPoints: gInspTps.points,
      errPoints: gInspErr.points,
      boundaries: versionBoundaries,
      escenarioPoints: escenarioPointsInsp,
      bands: buildBands(N_INSP, 480, 200, "histoTrend", enterHover),
      hoverActive: hoverInsp,
      hoverX: hoverInsp ? xAt(idxInsp, N_INSP, 480).toFixed(1) : null,
      hoverYP95: hoverInsp ? gInspP95.pts[idxInsp][1].toFixed(1) : null,
      hoverYTps: hoverInsp ? gInspTps.pts[idxInsp][1].toFixed(1) : null,
      hoverYErr: hoverInsp ? gInspErr.pts[idxInsp][1].toFixed(1) : null,
      legendTimeLabel: (inspRuns[idxInsp].escenario ? "escenario · " : "") + inspRuns[idxInsp].fecha + " " + inspRuns[idxInsp].hora + " · " + inspRuns[idxInsp].version,
      p95Value: msLabel(inspP95Vals[idxInsp]),
      tpsValue: itsLabel(inspTpsVals[idxInsp]),
      errValue: pctLabel(inspErrVals[idxInsp]),
      versionLegend: versionLegendParts,
      durationColor,
    };

    // ---- Tendencia (barras): hover interactivo con fecha+hora+version+p95 (pedido de Carlos -
    // antes era un title="" nativo del navegador, que "quedaba un poco roto" con 21+ barras) ----
    const trendRunAverages = historicoBase.trend.runAverages;
    const maxRunAvg = Math.max.apply(null, trendRunAverages.map((r) => r.avg));
    const PLOT_MAX_PCT = 92;
    const hoverTrendBars = hover.chart === "trendBars";
    const idxTrendBars = hoverTrendBars ? hover.index : trendRunAverages.length - 1;
    const trendBars = trendRunAverages.map(({ run, avg }, i) => ({
      heightPct: (avg / maxRunAvg) * PLOT_MAX_PCT,
      colorVar: run.escenario ? "var(--confound)" : versionColorFor(run.version),
      escenarioClass: run.escenario ? "escenario" : "",
      activeClass: hoverTrendBars && i === idxTrendBars ? "active" : "",
      dateLabel: run.escenario ? "ESC" : run.fecha,
      onEnter: enterHover("trendBars", i),
    }));
    const trendBarHoy = trendRunAverages[idxTrendBars];
    const baselineTopPct = 100 - (historicoBase.trend.baselinePromedio / maxRunAvg) * PLOT_MAX_PCT;
    const historicoTrend = {
      bars: trendBars,
      baselineTopPct: baselineTopPct.toFixed(1),
      legendNote: "Barra rayada = corrida de escenario (fuera de la historia normal). Color = versión (más clara = más nueva). Línea = baseline_global promedio de hoy.",
      count: trendRunAverages.length,
      totalRunsCount: historicoBase.trend.totalRunsCount,
      legendFechaHora: trendBarHoy.run.fecha + " " + trendBarHoy.run.hora,
      legendVersion: trendBarHoy.run.version + (trendBarHoy.run.escenario ? " · escenario: " + trendBarHoy.run.escenario : ""),
      legendP95: msLabel(trendBarHoy.avg),
    };

    const historico = { ...historicoBase, disponible: histDisponible, vacio: !histDisponible,
      vacioTexto: "Hay " + histNormales + " corrida" + (histNormales === 1 ? "" : "s") + " con la clave de esta corrida (" + HIST.claveLabel + "). La tendencia y la comparativa aparecen desde " + HIST_MIN_CORRIDAS + " corridas con la misma clave.",
      trend: historicoTrend, inspector, impactTop, escenarios, patronViewTopExtra: patronMode === "top10" ? "active" : "", patronViewAllExtra: patronMode === "all" ? "active" : "" };

    // ============================================================================
    // Resumen ejecutivo en lenguaje llano + Conclusiones/Accionables + Recomendaciones
    // Prioritarias (2026-09-18, pedido de Carlos, inspirado en el informe de mpc-cypress).
    // TODO generado de numeros YA calculados arriba (bottlenecks, historico.scorecard,
    // historico.patron) - ninguna cifra nueva, solo prosa y priorizacion sobre lo que ya existe.
    // ============================================================================
    const peorRegresion = histDisponible ? historico.scorecard.newList[0] || null : null;
    const mejorMejora = histDisponible ? historico.scorecard.resolvedList[0] || null : null;
    const topBottleneck = bottlenecks[0] || null;
    const topPatron = historico.patron.rows[0] || null;
    const topSemaforo = historico.semaforo.rows[0] || null;

    const parrafoPartes = [];
    if (!histDisponible || !HISTORICO_VERSION_ANTERIOR) {
      parrafoPartes.push(
        "Corrida " + GS32.meta.tipo + " de " + decorated.length + " endpoints en " + GS32.meta.ambienteLabel + " (" + GS32.meta.versionLabel + "): " +
        passCount + " PASS, " + warnCount + " WARN y " + failCount + " FAIL. " +
        (histDisponible ? "Toda la historia con esta clave es de una sola versión: no hay comparación entre versiones." : "Es la primera corrida con esta clave: no hay baseline contra el cual comparar.")
      );
    } else parrafoPartes.push(
      "La comparación entre " + historico.scorecard.versionAnterior + " y " + historico.scorecard.versionActual +
      " de GS32 muestra un estado " + historico.scorecard.verdictLabel.toUpperCase() +
      " (variación global de " + historico.scorecard.globalDeltaLabel + " en el p95 promedio)."
    );
    if (peorRegresion) {
      parrafoPartes.push(
        "El problema más urgente es " + peorRegresion.name + ", que empeoró " + peorRegresion.delta +
        " respecto de la versión anterior y hoy es el principal cuello de botella detectado."
      );
    }
    if (mejorMejora) {
      parrafoPartes.push(
        "Por otro lado, " + mejorMejora.name + " mejoró " + mejorMejora.delta + " respecto de la versión anterior."
      );
    }
    // Todos los FAIL, no solo el primero: con 2 endpoints fallando, nombrar uno solo esconde el otro.
    // Salen de TODOS los endpoints (no de bottlenecks, que se corta en 8: con más FAIL el texto
    // nombraba 8 sin avisar que faltaban). Para que escale a 50+ endpoints (2026-10-08), los textos
    // nombran hasta MAX_NOMBRES y dicen cuántos más hay; el detalle completo está en el mapa / tabla.
    const MAX_NOMBRES = 3;
    const fallados = decorated
      .filter((e) => e.status === "fail")
      .sort((a, b) => b.errorRateRaw - a.errorRateRaw || b.p95Raw - a.p95Raw)
      .map((e) => ({ name: e.shortName, resource: e.resource, motivo: motivoCuelloDeBotella(e) }));
    const resto = (xs) => (xs.length > MAX_NOMBRES ? " y " + (xs.length - MAX_NOMBRES) + " más" : "");
    const listaNombres = (xs) => {
      const ys = xs.slice(0, MAX_NOMBRES);
      if (xs.length > MAX_NOMBRES) return ys.map((x) => x.name).join(", ") + resto(xs);
      return ys.length === 1 ? ys[0].name : ys.slice(0, -1).map((x) => x.name).join(", ") + " y " + ys[ys.length - 1].name;
    };
    if (fallados.length) {
      parrafoPartes.push(
        "En esta corrida " + (fallados.length === 1 ? "falló " : "fallaron " + fallados.length + " endpoints" + (fallados.length > MAX_NOMBRES ? "; los de más error: " : ": ")) +
        fallados.slice(0, MAX_NOMBRES).map((b) => b.name + ": " + b.motivo.toLowerCase()).join("; ") + resto(fallados) + "."
      );
    } else if (topBottleneck && (!peorRegresion || topBottleneck.name !== peorRegresion.name)) {
      parrafoPartes.push(
        "En la corrida más reciente, " + topBottleneck.name + " también se destaca: " + topBottleneck.motivo.toLowerCase() + "."
      );
    }
    parrafoPartes.push(
      "Se recomienda priorizar la revisión de " + (peorRegresion ? peorRegresion.name : (fallados.length ? listaNombres(fallados) : (topBottleneck ? topBottleneck.name : "los endpoints marcados en alerta"))) +
      " antes de la próxima versión."
    );

    const cardEscalar = peorRegresion
      ? {
          titulo: "Regresión en " + peorRegresion.name,
          texto: peorRegresion.name + " empeoró " + peorRegresion.delta + " entre " + historico.scorecard.versionAnterior + " y " + historico.scorecard.versionActual + " — el cambio de peor impacto detectado en esta comparación.",
        }
      : (HISTORICO_VERSION_ANTERIOR ? { titulo: "Sin regresiones críticas", texto: "Ningún endpoint empeoró más de 50% respecto de la versión anterior estando además en alerta." }
        : { titulo: "Sin versión anterior", texto: "No hay corridas de otra versión con esta clave: no se puede hablar de regresión todavía." });

    const cardInvestigar = (histDisponible && topPatron && topPatron.patronLabel !== "CONSISTENTE")
      ? {
          titulo: "Variabilidad en " + topPatron.name,
          texto: topPatron.name + " muestra un patrón " + topPatron.patronLabel + " (CV " + topPatron.cvLabel + ") a lo largo de la historia — antes de optimizar conviene entender si son picos reales o ruido de caché/ambiente.",
        }
      : { titulo: "Sin variabilidad destacada", texto: "Los endpoints con más variabilidad histórica no superan el umbral que amerite una investigación puntual." };

    const cardOptimizar = fallados.length > 1
      ? { titulo: "Resolver " + listaNombres(fallados), texto: fallados.slice(0, MAX_NOMBRES).map((b) => b.name + ": " + b.motivo).join(". ") + "." + (fallados.length > MAX_NOMBRES ? " Los otros " + (fallados.length - MAX_NOMBRES) + ", en el mapa con el filtro Con problemas." : "") }
      : topBottleneck
      ? { titulo: "Optimizar " + topBottleneck.name, texto: topBottleneck.name + ": " + topBottleneck.motivo + "." }
      : { titulo: "Sin blancos claros de optimización", texto: "Ningún endpoint de esta corrida muestra una razón estructural clara para optimizar primero." };

    const recomendaciones = [];
    if (peorRegresion) {
      recomendaciones.push({
        prioridad: "P1", prioridadColorVar: "var(--fail)",
        accion: "Investigar y revertir u optimizar la regresión de " + peorRegresion.name + " antes de la próxima release.",
        seccion: peorRegresion.resource,
        evidencia: "Empeoró " + peorRegresion.delta + " de " + historico.scorecard.versionAnterior + " a " + historico.scorecard.versionActual + ".",
      });
    }
    const MAX_RECOM_FAIL = 5;
    fallados.slice(0, MAX_RECOM_FAIL).forEach((b) => {
      recomendaciones.push({
        prioridad: "P1", prioridadColorVar: "var(--fail)",
        accion: "Resolver la causa del error rate en " + b.name + ".",
        seccion: b.resource,
        evidencia: b.motivo + " (corrida más reciente).",
      });
    });
    if (fallados.length > MAX_RECOM_FAIL) {
      const otros = fallados.slice(MAX_RECOM_FAIL);
      recomendaciones.push({
        prioridad: "P1", prioridadColorVar: "var(--fail)",
        accion: "Resolver los errores de los otros " + otros.length + " endpoints con FAIL.",
        seccion: Array.from(new Set(otros.map((b) => b.resource))).slice(0, 4).join(", ") + (new Set(otros.map((b) => b.resource)).size > 4 ? "…" : ""),
        evidencia: "Detalle en el mapa o la tabla de endpoints, filtro Con problemas.",
      });
    }
    if (histDisponible && topPatron && topPatron.patronLabel !== "CONSISTENTE") {
      recomendaciones.push({
        prioridad: "P2", prioridadColorVar: "var(--warn)",
        accion: "Investigar la variabilidad histórica de " + topPatron.name + " (¿picos reales o caché/ambiente?).",
        seccion: topPatron.resource,
        evidencia: "Patrón " + topPatron.patronLabel + ", CV " + topPatron.cvLabel + " sobre " + topPatron.corridas + " corridas.",
      });
    }
    if (histDisponible && topSemaforo) {
      recomendaciones.push({
        prioridad: "P2", prioridadColorVar: "var(--warn)",
        accion: "Revisar la degradación sostenida de " + topSemaforo.name + " contra su baseline histórico.",
        seccion: topSemaforo.resource,
        evidencia: "Δ Global " + topSemaforo.deltaGlobalLabel + " vs baseline " + topSemaforo.baselineLabel + ".",
      });
    }
    if (mejorMejora) {
      recomendaciones.push({
        prioridad: "P3", prioridadColorVar: "var(--accent2)",
        accion: "Confirmar en la próxima corrida que la mejora de " + mejorMejora.name + " se sostiene.",
        seccion: mejorMejora.resource,
        evidencia: "Mejoró " + mejorMejora.delta + " en " + historico.scorecard.versionActual + ".",
      });
    }

    const resumenEjecutivo = {
      parrafo: parrafoPartes.join(" "),
      bottlenecks,
      hasBottlenecks: bottlenecks.length > 0,
      cardEscalar,
      cardInvestigar,
      cardOptimizar,
      recomendaciones,
      hasRecomendaciones: recomendaciones.length > 0,
    };

    // ============================================================================
    // Vista técnica + vista ejecutiva (Carlos, 2026-10-08). Todo sale de números YA calculados
    // arriba (decorated, bottlenecks, historico, insightsAll): ninguna cifra nueva, solo
    // jerarquía y lenguaje llano.
    // ============================================================================
    const vistaActual = state.vista === "ejecutiva" ? "ejecutiva" : "tecnica";
    // "endpoint" ya no existe (2026-10-08: la reemplazan el mapa/tabla y la ficha).
    const tabActual = ["ahora", "errores", "capacidad", "historia", "payload", "escenarios"].indexOf(state.tab) !== -1 ? state.tab : "ahora";
    const ponerVista = (v, extra) => () => {
      if (typeof history !== "undefined" && history.replaceState) {
        history.replaceState(null, "", v === "ejecutiva" ? "#ejecutiva" : location.pathname + location.search);
      }
      this.setState(Object.assign({ vista: v }, extra || {}));
      if (typeof window !== "undefined") window.scrollTo(0, 0);
    };
    const nEp = decorated.length;
    const plural = (n, uno, varios) => n + " " + (n === 1 ? uno : varios);
    const conErrores = decorated.filter((e) => e.status === "fail");
    const conDescartes = decorated.filter((e) => e.status === "warn");
    const estado = failCount > 0
      ? { clase: "fail", titular: "Rojo: " + failCount + " de " + nEp + " endpoints " + (failCount === 1 ? "devolvió errores" : "devolvieron errores") }
      : warnCount > 0
        ? { clase: "warn", titular: "Amarillo: " + warnCount + " de " + nEp + " endpoints " + (warnCount === 1 ? "descartó iteraciones" : "descartaron iteraciones") }
        : { clase: "pass", titular: "Verde: " + (nEp === 1 ? "el endpoint corrió" : "los " + nEp + " endpoints corrieron") + " sin errores" };

    const usoDe = (e) => (e.limite ? e.p95Raw / e.limite : null);
    const pctTxt = (x) => (x * 100 < 1 ? (x * 100).toFixed(1).replace(".", ",") : String(Math.round(x * 100))) + "%";
    const statusLabelDe = (e) => (e.status === "fail" ? "FAIL" : e.status === "warn" ? "WARN" : "PASS");
    const severidad = (e) => (e.status === "fail" ? 3 : e.status === "warn" ? 2 : 1);
    const mapaOrden = state.mapaOrden === "api" ? "api" : "peor";
    const mapaFiltro = state.mapaFiltro === "problemas" ? "problemas" : "todos";
    // Pop-ups (2026-10-08): el contenido va como JSON en data-tip; lo dibuja el motor de pop-ups.
    const tipJson = (o) => JSON.stringify(o);
    const colorEstado = (st) => (st === "fail" ? "var(--fail)" : st === "warn" ? "var(--warn)" : "var(--ok)");
    const tipEndpoint = (e) => {
      const uso = usoDe(e);
      return tipJson({
        s: resourceOf(e.name), t: methodOf(e.name),
        filas: [
          ["p95", msLabel(e.p95Raw), "var(--accent2)"],
          ["límite", e.limite ? msLabel(e.limite) + " (" + pctTxt(uso) + ")" : "sin límite", "var(--fail)"],
          ["errores", pctLabel(e.errorRateRaw).replace(".", ","), e.errorRateRaw > 0 ? "var(--fail)" : "var(--ok)"],
        ],
        chip: [statusLabelDe(e) + " · clic: ver su ficha", colorEstado(e.status)],
      });
    };
    const tileDe = (e) => {
      const uso = usoDe(e);
      const mix = uso == null ? 6 : Math.round(8 + Math.min(uso / 0.6, 1) * 46);
      const base = e.status === "fail" ? "var(--fail)" : e.status === "warn" ? "var(--warn)" : "var(--accent2)";
      const sel = e.name === inspectedName;
      return {
        resource: resourceOf(e.name),
        method: methodOf(e.name),
        p95Label: msLabel(e.p95Raw),
        usoLabel: uso == null ? "sin límite" : pctTxt(uso) + (nEp > 16 ? "" : " del límite"),
        statusLabel: statusLabelDe(e),
        statusClass: e.status,
        selClass: sel ? "sel" : "",
        pressed: sel ? "true" : "false",
        title: e.name + ": p95 " + msLabel(e.p95Raw) + (e.limite ? " de un límite de " + msLabel(e.limite) : "") + " · " + statusLabelDe(e),
        tileStyle: "background: color-mix(in oklch, " + base + " " + (e.status === "pass" ? mix : 16) + "%, var(--bg-panel));",
        tip: tipEndpoint(e),
        onClick: () => this.setState({ inspectedEndpoint: e.name }),
      };
    };
    const enMapa = decorated.filter((e) => (mapaFiltro === "todos" || e.status !== "pass") && coincide(e.name));
    const porPeor = (a, b) => severidad(b) - severidad(a) || (usoDe(b) || 0) - (usoDe(a) || 0) || b.p95Raw - a.p95Raw;
    let grupos;
    if (mapaOrden === "api") {
      const porApi = new Map();
      enMapa.slice().sort(porPeor).forEach((e) => {
        const r = resourceOf(e.name);
        if (!porApi.has(r)) porApi.set(r, []);
        porApi.get(r).push(e);
      });
      grupos = Array.from(porApi.keys()).sort().map((r) => ({ tieneTitulo: true, titulo: r + " · " + porApi.get(r).length, tiles: porApi.get(r).map(tileDe) }));
    } else {
      grupos = [{ tieneTitulo: false, titulo: "", tiles: enMapa.slice().sort(porPeor).map(tileDe) }];
    }
    // Vista tabla (2026-10-08): una fila por endpoint, ordenable por columna; mismo buscador y filtro
    // que el mapa, y el clic en una fila abre la ficha. Reemplaza las tarjetas de "Por endpoint".
    const mapaVista = state.mapaVista === "tabla" ? "tabla" : "mapa";
    const rawPorNombre = new Map(raw.map((e) => [e.name, e]));
    // En la tabla la unidad va en el encabezado ("p95 ms"), no en cada celda: así entran las 12 columnas.
    const nMs = (v) => (v == null ? "s/d" : Math.round(v).toLocaleString("es-AR"));
    const logradoDe = (r) => (r.tps ? Math.min(100, Math.round((r.throughput / r.tps) * 100)) : null);
    const COLS = [
      ["endpoint", "Endpoint", "", (e) => e.name],
      ["estado", "Estado", "", (e) => severidad(e)],
      ["p50", "p50 ms", "num", (e, r) => r.p50],
      ["p95", "p95 ms", "num", (e, r) => r.p95],
      ["p99", "p99 ms", "num", (e, r) => r.p99],
      ["max", "max ms", "num", (e, r) => r.max],
      ["limite", "Límite ms", "num", (e, r) => r.limite],
      ["uso", "% límite", "num", (e) => usoDe(e)],
      ["tps", "TPS %", "num", (e, r) => logradoDe(r)],
      ["err", "Errores", "num", (e, r) => r.errorRate],
      ["apdex", "Apdex", "num", (e, r) => r.apdex],
      ["frio", "Frío ms", "num", (e, r) => (r.frio && r.frio.p95 != null ? r.frio.p95 : null)],
    ];
    const tablaCol = COLS.some((c) => c[0] === state.tablaCol) ? state.tablaCol : "peor";
    const tablaDir = state.tablaDir === "asc" ? "asc" : "desc";
    const valorDe = (e, key) => { const c = COLS.find((x) => x[0] === key); return c ? c[3](e, rawPorNombre.get(e.name) || {}) : null; };
    const filasOrden = enMapa.slice().sort((a, b) => {
      if (tablaCol === "peor") return porPeor(a, b);
      const va = valorDe(a, tablaCol), vb = valorDe(b, tablaCol);
      if (va == null && vb == null) return porPeor(a, b);
      if (va == null) return 1;
      if (vb == null) return -1;
      const d = typeof va === "string" ? va.localeCompare(vb) : va - vb;
      return (tablaDir === "asc" ? d : -d) || porPeor(a, b);
    });
    const tabla = {
      columnas: COLS.map(([key, label, clase]) => ({
        label, clase,
        flecha: tablaCol === key ? (tablaDir === "asc" ? " ▲" : " ▼") : "",
        ariaSort: tablaCol === key ? (tablaDir === "asc" ? "ascending" : "descending") : "none",
        onClick: () => this.setState({ tablaCol: key, tablaDir: tablaCol === key && tablaDir === "desc" ? "asc" : (key === "endpoint" && tablaCol !== key ? "asc" : "desc") }),
      })),
      filas: filasOrden.map((e) => {
        const r = rawPorNombre.get(e.name) || {};
        const uso = usoDe(e);
        const lg = logradoDe(r);
        const frio = r.frio && r.frio.p95 != null ? r.frio.p95 : null;
        return {
          resource: resourceOf(e.name), method: methodOf(e.name),
          statusClass: e.status, statusLabel: statusLabelDe(e),
          p50: nMs(r.p50), p95: nMs(r.p95), p99: nMs(r.p99), max: nMs(r.max),
          limite: r.limite ? nMs(r.limite) : "—",
          uso: uso == null ? "—" : pctTxt(uso), usoColor: uso != null && uso >= 0.8 ? "var(--warn)" : "var(--text)",
          tps: lg == null ? "s/d" : lg + "%", tpsColor: lg != null && lg < 95 ? "var(--warn)" : "var(--text)",
          err: pctLabel(r.errorRate).replace(".", ","), errColor: r.errorRate > 0 ? "var(--fail)" : "var(--text-faint)",
          apdex: e.apdexLabel.replace(".", ","), apdexColor: e.apdexColorVar,
          frio: nMs(frio), frioColor: r.frioMuyLento ? "var(--warn)" : "var(--text)",
          selClass: e.name === inspectedName ? "sel" : "",
          tip: tipEndpoint(e),
          onClick: () => this.setState({ inspectedEndpoint: e.name }),
        };
      }),
    };
    const mapa = {
      esMapa: mapaVista === "mapa", esTabla: mapaVista === "tabla", layoutClase: mapaVista === "tabla" ? "con-tabla" : "",
      vistaMapaExtra: mapaVista === "mapa" ? "active" : "", vistaTablaExtra: mapaVista === "tabla" ? "active" : "",
      verMapa: () => this.setState({ mapaVista: "mapa" }), verTabla: () => this.setState({ mapaVista: "tabla" }),
      grupos,
      vacio: enMapa.length === 0,
      vacioTexto: busqueda ? "Ningún endpoint coincide con \u201c" + (state.busqueda || "").trim() + "\u201d." : "Ningún endpoint con problemas en esta corrida.",
      busquedaNota: busqueda ? enMapa.length + " de " + nEp : "",
      densidad: nEp > 16 ? "compacto" : "",
      problemasCount: decorated.filter((e) => e.status !== "pass").length,
      ordenPeorExtra: mapaOrden === "peor" ? "active" : "", ordenApiExtra: mapaOrden === "api" ? "active" : "",
      filtroTodosExtra: mapaFiltro === "todos" ? "active" : "", filtroProblemasExtra: mapaFiltro === "problemas" ? "active" : "",
      ordenPeor: () => this.setState({ mapaOrden: "peor" }), ordenApi: () => this.setState({ mapaOrden: "api" }),
      filtroTodos: () => this.setState({ mapaFiltro: "todos" }), filtroProblemas: () => this.setState({ mapaFiltro: "problemas" }),
    };

    // Ficha del endpoint elegido: datos crudos de la corrida (raw), sin cálculos nuevos.
    const fRaw = raw.find((e) => e.name === inspectedName) || raw[0];
    const fDec = decorated.find((e) => e.name === fRaw.name) || decorated[0];
    const logrado = fRaw.tps ? Math.min(100, Math.round((fRaw.throughput / fRaw.tps) * 100)) : null;
    const aroColor = logrado == null ? "var(--text-faint)" : logrado >= 95 ? "var(--ok)" : logrado >= 80 ? "var(--warn)" : "var(--fail)";
    const escala = Math.max(fRaw.max || 0, fRaw.limite || 0, fRaw.p95 || 0) || 1;
    const posPct = (v) => (Math.min(v / escala, 1) * 100).toFixed(1) + "%";
    const num = (v, d) => (v == null ? "s/d" : v.toFixed(d).replace(".", ","));
    const frioP95 = fRaw.frio && fRaw.frio.p95 != null ? fRaw.frio.p95 : null;
    const hayFasesF = fRaw.networkMs != null && fRaw.waitingMs != null && fRaw.receivingMs != null;
    const ficha = {
      nombre: fRaw.name,
      statusClass: fDec.status,
      statusLabel: statusLabelDe(fDec),
      aroPct: logrado == null ? "s/d" : logrado + "%",
      aroOffset: logrado == null ? 289 : (289 * (1 - logrado / 100)).toFixed(1),
      aroColor,
      aroAria: "TPS logrado: " + (logrado == null ? "sin dato" : logrado + "% del objetivo"),
      tpsLabel: GS32.endpoints.find((x) => x.slug === fRaw.name)?.tasaConocida === false
        ? "TPS promedio " + num(fRaw.throughput, 2) + " it/s (la tasa cambia en la corrida)"
        : "objetivo " + num(fRaw.tps, 3) + " · logrado " + num(fRaw.throughput, 2) + " it/s",
      p50Style: "width: " + posPct(fRaw.p50 || 0) + ";",
      p95Style: "left: " + posPct(fRaw.p50 || 0) + "; width: calc(" + posPct(fRaw.p95 || 0) + " - " + posPct(fRaw.p50 || 0) + ");",
      p99Style: fRaw.p99 == null ? "display: none;" : "left: " + posPct(fRaw.p99) + ";",
      maxStyle: "left: calc(" + posPct(fRaw.max || 0) + " - 2px);",
      tieneLimite: !!fRaw.limite,
      limStyle: fRaw.limite ? "left: calc(" + posPct(fRaw.limite) + " - 2px);" : "",
      latLeyenda: "p50 " + msLabel(fRaw.p50) + " · p95 " + msLabel(fRaw.p95) + " · p99 " + (fRaw.p99 == null ? "s/d" : msLabel(fRaw.p99)) + " · max " + msLabel(fRaw.max) + (fRaw.limite ? " · límite " + msLabel(fRaw.limite) : ""),
      datos: [
        { titulo: "Errores", valor: pctLabel(fRaw.errorRate).replace(".", ","), sub: fRaw.errorType ? fRaw.errorType : (fRaw.errorRate > 0 ? "tipo s/d" : "sin errores"), color: fRaw.errorRate > 0 ? "var(--fail)" : "var(--text)" },
        { titulo: "Primera pegada (frío)", valor: frioP95 == null ? "s/d" : msLabel(frioP95), sub: frioP95 == null ? "sin pegada en frío" : num(frioP95 / (fRaw.p95 || 1), 1) + "× el p95 en caliente" + (fRaw.frioMuyLento ? " · posible caché fría (más de 5×)" : " · normal") + (fRaw.frio.n === 1 ? " · 1 muestra" : ""), color: fRaw.frioMuyLento ? "var(--warn)" : "var(--text)" },
        { titulo: "Patrón de picos", valor: fDec.patternLabel, sub: "el máximo fue " + num((fRaw.max || 0) / (fRaw.p95 || 1), 1) + "× el p95", color: fDec.spikeColorVar },
        { titulo: "Fases (promedio por iteración)", valor: hayFasesF ? "red " + msLabel(fRaw.networkMs) + " · backend " + msLabel(fRaw.waitingMs) + " · descarga " + msLabel(fRaw.receivingMs) : "s/d", sub: hayFasesF ? "backend = esperando la respuesta del servidor" : "sin samples.csv.gz", color: "var(--text)" },
        { titulo: "Apdex", valor: fDec.apdexLabel.replace(".", ","), sub: "satisfecha ≤ " + GS32.apdex.tMs + " ms, tolerable ≤ " + GS32.apdex.fMs + " ms (contexto, no criterio)", color: fDec.apdexColorVar },
        { titulo: "Iteraciones descartadas", valor: fRaw.dropped + " de " + fRaw.iterations, sub: fRaw.dropped > 0 ? "no llegó a la tasa pedida" : "llegó a la tasa pedida", color: fRaw.dropped > 0 ? "var(--warn)" : "var(--text)" },
      ],
    };
    // ============================================================================
    // Pestaña ERRORES (2026-10-08): cada falla con su segundo, tipo y pedido (GS32.errores, de
    // samples.csv.gz). El "patrón" es una hipótesis armada con reglas simples, no un diagnóstico.
    // ============================================================================
    const E = GS32.errores || { disponible: false };
    const mmss = (seg) => Math.floor(seg / 60) + ":" + String(Math.round(seg % 60)).padStart(2, "0");
    const relojDe = (seg) => {
      const tot = (Number(GS32.meta.inicioHH) || 0) * 60 + (Number(GS32.meta.inicioMM) || 0) + Math.floor(seg / 60);
      return String(Math.floor(tot / 60) % 24).padStart(2, "0") + ":" + String(tot % 60).padStart(2, "0");
    };
    const CATS = {
      conexion: { label: "Conexión cortada", color: "var(--fail)", significa: "El servidor o algo en el medio cerró la conexión sin responder." },
      timeout: { label: "Timeout", color: "var(--accent2)", significa: "No respondió dentro del tiempo de espera." },
      http4: { label: "HTTP 4xx", color: "var(--accent)", significa: "El servidor rechazó el pedido: dato inválido, no existe o no autorizado." },
      http5: { label: "HTTP 5xx", color: "var(--warn)", significa: "Error del servidor al procesar el pedido." },
      otro: { label: "Otro", color: "var(--text-faint)", significa: "Falla sin clasificar." },
    };
    const catDe = (f) => (f.status >= 500 ? "http5" : f.status >= 400 ? "http4" : f.status === 0 ? (/timeout/i.test(f.tipo) ? "timeout" : "conexion") : "otro");
    const errFiltro = state.errFiltro || null;
    let errores = { disponible: false, sinDatos: true, sinDatosTexto: "El detalle de errores sale de samples.csv.gz, y esta corrida no lo tiene (es anterior al 2026-10-01). El error rate por endpoint está en la ficha y en la tabla de endpoints." };
    let totalFallas = 0;
    if (E.disponible) {
      const F = E.fallas.slice().sort((a, b) => a.seg - b.seg);
      const porEp = E.porEndpoint || {};
      totalFallas = Object.keys(porEp).reduce((n, k) => n + porEp[k].fallas, 0);
      const totalReqs = Object.keys(porEp).reduce((n, k) => n + porEp[k].reqs, 0) || GS32.totales.reqs;
      const conErr = Object.keys(porEp).filter((k) => porEp[k].fallas > 0);
      const rateDe = (k) => (porEp[k].reqs ? (porEp[k].fallas / porEp[k].reqs) * 100 : 0);
      const peorEp = conErr.slice().sort((a, b) => rateDe(b) - rateDe(a))[0] || null;
      const tiposDistintos = Array.from(new Set(F.map((f) => f.tipo)));
      const pct2 = (v) => v.toFixed(v < 0.1 ? 3 : 2).replace(".", ",") + "%";
      const kpisErr = [
        { l: "Pedidos con error", v: totalFallas.toLocaleString("es-AR"), s: "de " + totalReqs.toLocaleString("es-AR") + " pedidos (" + pct2(totalReqs ? (totalFallas / totalReqs) * 100 : 0) + ")", color: totalFallas ? "var(--fail)" : "var(--text)" },
        { l: "Endpoints afectados", v: conErr.length + " de " + nEp, s: conErr.length ? conErr.slice(0, 2).map(methodOf).join(", ") + (conErr.length > 2 ? " y " + (conErr.length - 2) + " más" : "") : "ninguno", color: "var(--text)" },
        { l: "Tipos distintos", v: String(tiposDistintos.length), s: tiposDistintos.length ? CATS[catDe(F.find((f) => f.tipo === tiposDistintos[0]))].label : "—", color: "var(--text)" },
        { l: "Cuándo", v: F.length ? mmss(F[0].seg) + (F.length > 1 ? "–" + mmss(F[F.length - 1].seg) : "") : "—", s: F.length ? "de la corrida (" + relojDe(F[0].seg) + " a " + relojDe(F[F.length - 1].seg) + ")" : "sin errores", color: "var(--text)" },
        { l: "Error rate máximo", v: peorEp ? pct2(rateDe(peorEp)) : "0%", s: peorEp ? methodOf(peorEp) : "ningún endpoint", color: peorEp ? "var(--fail)" : "var(--text)" },
      ];
      // Patrón (hipótesis): ráfaga (varios endpoints en <= 30 s), concentrado (un solo endpoint) o
      // sostenido (repartido en más de la mitad de la corrida).
      let patron = null;
      if (F.length >= 2) {
        const span = F[F.length - 1].seg - F[0].seg;
        const eps = Array.from(new Set(F.map((f) => f.ep)));
        const pedidos = Array.from(new Set(F.map((f) => f.pedido)));
        const catsF = Array.from(new Set(F.map(catDe)));
        const tipoTxt = catsF.length === 1 ? "todos " + CATS[catsF[0]].label.toLowerCase() : catsF.length + " tipos distintos";
        if (eps.length >= 2 && span <= 30) {
          patron = { titulo: "Ráfaga: los " + F.length + " errores pasaron en " + Math.max(1, Math.round(span)) + " segundos, en " + eps.length + " endpoints distintos",
            texto: "Son " + tipoTxt + ", en " + (pedidos.length <= 3 ? "los pedidos " + pedidos.join(", ") : pedidos.length + " pedidos distintos") + ", entre el " + mmss(F[0].seg) + " y el " + mmss(F[F.length - 1].seg) + " de la corrida (" + relojDe(F[0].seg) + "). Cuando varios endpoints fallan juntos y con el mismo tipo, apunta más al ambiente (red, balanceador, Cloudflare) que a un endpoint. Para confirmarlo: cruzar ese minuto con los logs de backend y la infraestructura." };
        } else if (eps.length === 1) {
          patron = { titulo: "Concentrado: los " + F.length + " errores son de " + methodOf(eps[0]),
            texto: "Son " + tipoTxt + ", repartidos entre el " + mmss(F[0].seg) + " y el " + mmss(F[F.length - 1].seg) + ". Que falle uno solo apunta a ese endpoint (o a lo que consulta), no al ambiente." };
        } else if (span > RUN_WINDOW_SECONDS / 2) {
          patron = { titulo: "Sostenido: errores a lo largo de la corrida en " + eps.length + " endpoints",
            texto: "Van del " + mmss(F[0].seg) + " al " + mmss(F[F.length - 1].seg) + ": no es un corte puntual. Son " + tipoTxt + "." };
        }
      }
      const N_TRAMOS = 60;
      const ancho = Math.max(1, RUN_WINDOW_SECONDS / N_TRAMOS);
      const cuentas = Array.from({ length: N_TRAMOS }, () => ({}));
      const detTramo = Array.from({ length: N_TRAMOS }, () => new Map());
      F.forEach((f) => {
        const i = Math.min(N_TRAMOS - 1, Math.floor(f.seg / ancho)); const c = catDe(f); cuentas[i][c] = (cuentas[i][c] || 0) + 1;
        const k = methodOf(f.ep) + " · " + f.pedido; detTramo[i].set(k, (detTramo[i].get(k) || 0) + 1);
      });
      const enRafaga = (i) => patron && /^Ráfaga/.test(patron.titulo) && (i + 1) * ancho >= F[0].seg && i * ancho <= F[F.length - 1].seg;
      const maxTramo = Math.max(1, ...cuentas.map((c) => Object.values(c).reduce((a, b) => a + b, 0)));
      const tramosErr = cuentas.map((c, i) => {
        const tot = Object.values(c).reduce((a, b) => a + b, 0);
        const det = Array.from(detTramo[i].entries()).sort((a, b) => b[1] - a[1]);
        return {
          tabindex: tot ? "0" : "-1",
          tip: tot ? tipJson({
            s: mmss(i * ancho) + " a " + mmss((i + 1) * ancho) + " de la corrida · " + relojDe(i * ancho),
            t: tot + " error" + (tot === 1 ? "" : "es"),
            g: [String(tot), "error" + (tot === 1 ? "" : "es") + " en este tramo · de " + totalFallas + " en la corrida", "var(--fail)"],
            filas: Object.keys(c).map((k) => [CATS[k].label, String(c[k]), CATS[k].color]).concat(det.slice(0, 3).map((d) => [d[0], "×" + d[1]])).concat(det.length > 3 ? [["y " + (det.length - 3) + " pedidos más", ""]] : []),
            porque: enRafaga(i) ? "Parte de la ráfaga detectada: ver “Patrón detectado” arriba." : null,
          }) : "",
          segs: Object.keys(c).map((k) => ({ style: "height: " + Math.max(4, Math.round((c[k] / maxTramo) * 104)) + "px; background: " + CATS[k].color + ";" })),
        };
      });
      const porTipoMap = new Map();
      F.forEach((f) => {
        const t = porTipoMap.get(f.tipo) || { tipo: f.tipo, cat: catDe(f), n: 0, eps: new Set(), primera: f.seg, ultima: f.seg };
        t.n++; t.eps.add(f.ep); t.primera = Math.min(t.primera, f.seg); t.ultima = Math.max(t.ultima, f.seg);
        porTipoMap.set(f.tipo, t);
      });
      const porTipo = Array.from(porTipoMap.values()).sort((a, b) => b.n - a.n).map((t) => ({
        tipo: t.tipo, color: CATS[t.cat].color, significa: CATS[t.cat].significa, n: t.n, endpoints: t.eps.size,
        primeraUltima: mmss(t.primera) + " / " + mmss(t.ultima),
        selClass: errFiltro === t.tipo ? "sel" : "",
        onClick: () => this.setState({ errFiltro: errFiltro === t.tipo ? null : t.tipo }),
      }));
      const F2 = errFiltro ? F.filter((f) => f.tipo === errFiltro) : F;
      const epsFiltro = Array.from(new Set(F2.map((f) => f.ep)));
      const listaEps = (errFiltro ? epsFiltro : conErr).slice().sort((a, b) => rateDe(b) - rateDe(a));
      const histDe = (slug) => {
        const prev = histConBaseline.filter((f) => f.endpoint === slug && !f.escenario && f.timestamp < GS32.meta.runId);
        if (!prev.length) return "primera corrida con esta clave";
        if (prev[0].errorRatePct === undefined) return "s/d";
        const conE = prev.filter((f) => f.errorRatePct > 0).length;
        return conE ? "recurrente: " + conE + " de " + prev.length + " corridas" : "nuevo: 0 de " + prev.length + " corridas";
      };
      const porEndpointErr = listaEps.map((k) => {
        const mios = F2.filter((f) => f.ep === k);
        return {
          resource: resourceOf(k), method: methodOf(k),
          rate: pct2(rateDe(k)),
          n: (errFiltro ? mios.length : porEp[k].fallas) + " de " + porEp[k].reqs.toLocaleString("es-AR"),
          pedidos: Array.from(new Set(mios.map((f) => f.pedido))).slice(0, 3).join(", ") || "—",
          historia: histDe(k),
        };
      });
      const catsPresentes = Object.keys(CATS).filter((c) => F.some((f) => catDe(f) === c));
      const maxCelda = Math.max(1, ...listaEps.map((k) => Math.max(...catsPresentes.map((c) => F2.filter((f) => f.ep === k && catDe(f) === c).length))));
      const matriz = {
        columnas: catsPresentes.map((c) => CATS[c].label),
        filas: listaEps.map((k) => ({
          nombre: k,
          celdas: catsPresentes.map((c) => {
            const n = F2.filter((f) => f.ep === k && catDe(f) === c).length;
            return { v: n || "", style: n ? "background: color-mix(in oklch, " + CATS[c].color + " " + Math.round(18 + (n / maxCelda) * 50) + "%, var(--bg-panel)); font-weight: 600;" : "" };
          }),
        })),
      };
      const truncado = conErr.some((k) => porEp[k].fallas > F.filter((f) => f.ep === k).length);
      errores = {
        disponible: true, sinDatos: false,
        hayErrores: totalFallas > 0, sinErrores: totalFallas === 0,
        kpis: kpisErr, patron,
        tramos: tramosErr, tramoLabel: Math.round(ancho) + " s",
        ejeMedio: mmss(RUN_WINDOW_SECONDS / 2), ejeFin: mmss(RUN_WINDOW_SECONDS),
        categorias: catsPresentes.map((c) => ({ label: CATS[c].label, color: CATS[c].color })),
        porTipo, porEndpoint: porEndpointErr, matriz,
        filtroActivo: !!errFiltro, limpiarFiltro: () => this.setState({ errFiltro: null }),
        truncado, truncadoTexto: "El detalle guarda hasta " + E.topePorEndpoint + " fallas por endpoint: los totales son exactos, la línea de tiempo y los tipos de los que pasaron ese tope muestran solo las primeras.",
      };
    }

    // ============================================================================
    // Pestaña CAPACIDAD (2026-10-08): colchón = máximo SANO medido (escalera, estrés o carga
    // máxima, con el endpoint solo) ÷ BASE. Lo arma el generador (GS32.capacidad); acá, la vista.
    // ============================================================================
    const CAP = GS32.capacidad || { endpoints: [], techoAmbiente: 30 };
    const num2 = (v) => (v == null ? "s/d" : (v < 0.1 ? v.toFixed(3) : v < 10 ? v.toFixed(2) : v.toFixed(1)).replace(".", ","));
    const xTxt = (v) => (v >= 100 ? Math.round(v).toLocaleString("es-AR") : v.toFixed(1).replace(".", ",")) + "×";
    const fechaTxt = (f) => (f ? f.slice(6, 8) + "/" + f.slice(4, 6) : "");
    const tipoTxt = { escalera: "escalera", estres: "estrés", "carga-maxima": "carga máxima" };
    const capFilas = CAP.endpoints.map((c) => {
      const max = c.maxSano ? c.maxSano.tps : null;
      const q = c.quiebre ? c.quiebre.tps : null;
      const colchon = max && c.base ? max / c.base : null;
      const cat = colchon == null ? (q ? "sinSano" : "sinDato") : colchon < 2 ? "riesgo" : colchon < 10 ? "ajustado" : "holgado";
      return { c, max, q, colchon, cat };
    });
    const ordenCat = { riesgo: 0, ajustado: 1, holgado: 2, sinSano: 3, sinDato: 4 };
    capFilas.sort((a, b) => ordenCat[a.cat] - ordenCat[b.cat] || (a.colchon || 0) - (b.colchon || 0) || ((a.q || 0) / (a.c.base || 1)) - ((b.q || 0) / (b.c.base || 1)));
    const valoresEje = capFilas.flatMap((f) => [f.c.base, f.c.tpsCorrida, f.max, f.q]).filter((v) => v > 0).concat([CAP.techoAmbiente]);
    const loExp = Math.floor(Math.log10(Math.min(...valoresEje)));
    const hiExp = Math.ceil(Math.log10(Math.max(...valoresEje) * 1.05));
    const posLog = (v) => Math.max(0, Math.min(100, ((Math.log10(v) - loExp) / Math.max(1, hiExp - loExp)) * 100));
    const colorCat = { riesgo: "var(--fail)", ajustado: "var(--warn)", holgado: "var(--ok)", sinSano: "var(--text-faint)", sinDato: "var(--text-faint)" };
    const filasCap = capFilas.map(({ c, max, q, colchon, cat }) => {
      const fuente = (o) => (o ? tipoTxt[o.tipo] + " " + fechaTxt(o.fecha) : "");
      const nota = c.contradiccion
        ? "ojo: el " + fechaTxt(c.contradiccion.fecha) + " un " + tipoTxt[c.contradiccion.tipo] + " se rompió a " + num2(c.contradiccion.tps) + " TPS"
        : max ? "máximo: " + fuente(c.maxSano) + (q ? " · quiebre " + num2(q) + " (" + fuente(c.quiebre) + ")" : "")
        : q ? "sin punto sano: se rompió a " + num2(q) + " TPS (" + fuente(c.quiebre) + ")"
        : "sin mediciones: falta estrés, escalera o carga máxima";
      const colchonTxt = colchon != null ? (q ? xTxt(colchon) + "–" + xTxt(q / c.base) : "≥ " + xTxt(colchon)) : q && c.base ? "< " + xTxt(q / c.base) : "sin dato";
      const tip = tipJson({
        s: resourceOf(c.slug), t: methodOf(c.slug),
        chip: ["colchón " + colchonTxt, colorCat[cat]],
        g: [colchonTxt, "colchón: veces su tráfico real", colorCat[cat]],
        filas: [
          ["BASE", num2(c.base) + " TPS", "var(--text)"],
          ["esta corrida", num2(c.tpsCorrida) + " TPS", "var(--accent)"],
          ["máximo sano", max ? num2(max) + " TPS · " + fuente(c.maxSano) : "sin dato", "var(--ok)"],
          ["quiebre", q ? num2(q) + " TPS · " + fuente(c.quiebre) : "no se rompió", "var(--warn)"],
        ],
        porque: nota + (c.baseFuente ? ". BASE de " + c.baseFuente + "." : ""),
        pie: c.mediciones + " mediciones aisladas" + (c.medicionesCombinadas ? " · " + c.medicionesCombinadas + " combinadas (no cuentan para el máximo)" : "") + " · Esc para cerrar",
      });
      return {
        tip,
        resource: resourceOf(c.slug), method: methodOf(c.slug),
        nota, notaColor: c.contradiccion ? "var(--warn)" : "var(--text-faint)",
        fuentes: "BASE " + num2(c.base) + " TPS (" + (c.baseFuente || "sin dato") + ") · esta corrida " + num2(c.tpsCorrida) + " TPS" + (max ? " · máximo sano " + num2(max) + " TPS (" + fuente(c.maxSano) + ")" : "") + (q ? " · quiebre " + num2(q) + " TPS (" + c.quiebre.motivo + ")" : "") + " · " + c.mediciones + " mediciones aisladas",
        color: colorCat[cat],
        colchon: colchon != null ? (q ? xTxt(colchon) + "–" + xTxt(q / c.base) : "≥ " + xTxt(colchon)) : q && c.base ? "< " + xTxt(q / c.base) : "sin dato",
        base: c.base ? "position:absolute;top:15px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--text);border:2px solid var(--bg-panel);left:" + posLog(c.base).toFixed(1) + "%" : "display:none",
        run: c.tpsCorrida ? "position:absolute;top:16px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);background:var(--accent);border:1px solid var(--bg-panel);left:" + posLog(c.tpsCorrida).toFixed(1) + "%" : "display:none",
        barra: max && c.base ? "position:absolute;top:17px;height:9px;border-radius:5px;background:var(--ok);opacity:.55;left:" + posLog(c.base).toFixed(1) + "%;width:" + Math.max(0.5, posLog(max) - posLog(c.base)).toFixed(1) + "%" : "display:none",
        flecha: max && !q ? "position:absolute;top:15px;left:calc(" + posLog(max).toFixed(1) + "% + 1px);width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:9px solid var(--ok)" : "display:none",
        quiebre: q ? "position:absolute;top:8px;bottom:8px;width:3px;margin-left:-1.5px;background:var(--warn);left:" + posLog(q).toFixed(1) + "%" : "display:none",
      };
    });
    const ejesCap = [];
    for (let k = loExp; k <= hiExp; k++) ejesCap.push({ l: String(Math.pow(10, k) >= 1 ? Math.pow(10, k) : Number(Math.pow(10, k).toFixed(-k))).replace(".", ","), style: "left:" + posLog(Math.pow(10, k)) + "%" });
    const cuenta = (cat) => capFilas.filter((f) => f.cat === cat).length;
    // Curva: endpoints con una escalera de 3 niveles o más.

              chip: [p.sano ? "Sano" : "No sano" + (lim && p.p95 > lim ? " · " + (p.p95 / lim).toFixed(1).replace(".", ",") + "× el límite" : ""), color],
              g: [msLabel(p.p95), "p95", color],

            }),
          };
        }),
        ticksX: [0, 0.25, 0.5, 0.75, 1].map((f) => ({ x: X(f * xMax / 1.1).toFixed(1), l: f === 0 ? "0" : num2(f * xMax / 1.1) })),
        ticksY,
        limiteY: curvaSel.limite ? Y(curvaSel.limite).toFixed(1) : null,
        limiteTextoY: curvaSel.limite ? (Y(curvaSel.limite) - 6).toFixed(1) : null,
        limiteLabel: curvaSel.limite ? msLabel(curvaSel.limite) : "",
        aria: "p95 de " + curvaSel.slug + " según el TPS logrado en la escalera",
        nota: "Escalera del " + fechaTxt(curvaSel.curvaRun) + (curvaSel.curvaCombinada ? ", con todos sus endpoints a la vez: es carga COMBINADA (el ambiente compartido), no el máximo aislado de este endpoint." : ", con el endpoint solo.") + " Punto azul = sano, ámbar = no sano; clic en un punto para ver el detalle. El nivel 1 puede arrancar en frío y salir más lento que los siguientes.",
      };
    }
    const medidas = capFilas.filter((f) => f.colchon != null);
    const menor = medidas[0] || null;
    const lecturas = [];
    if (menor) lecturas.push({ tag: "MENOS MARGEN", color: colorCat[menor.cat], t: methodOf(menor.c.slug) + ": " + (menor.q ? "entre " + xTxt(menor.colchon) + " y " + xTxt(menor.q / menor.c.base) : "al menos " + xTxt(menor.colchon)) + " su tráfico real (BASE " + num2(menor.c.base) + " TPS, " + (menor.c.baseFuente || "") + ")." });
    const contra = capFilas.filter((f) => f.c.contradiccion);
    if (contra.length) lecturas.push({ tag: "CONTRADICCIÓN", color: "var(--warn)", t: contra.slice(0, 3).map((f) => methodOf(f.c.slug) + " llegó sano a " + num2(f.max) + " TPS pero el " + fechaTxt(f.c.contradiccion.fecha) + " se rompió a " + num2(f.c.contradiccion.tps)).join("; ") + (contra.length > 3 ? "; y " + (contra.length - 3) + " más" : "") + ". Repetir la medición antes de confiar en ese máximo." });
    const sinMedir = capFilas.filter((f) => f.cat === "sinDato" || f.cat === "sinSano");

    if (capFilas.some((f) => f.c.baseFuente === "profile")) lecturas.push({ tag: "BASE", color: "var(--text-faint)", t: capFilas.filter((f) => f.c.baseFuente === "profile").length + " endpoints toman el BASE del profile (el export de producción no los tiene): es el tráfico real redondeado para arriba, así que su colchón queda un poco por debajo del real." });
    lecturas.push({ tag: "OJO", color: "var(--fail)", t: "Los máximos son AISLADOS (el endpoint solo, en staging). Con todos a la vez el ambiente compartido aguanta menos: eso lo muestra la escalera combinada, no este colchón." });
    const capacidad = {
      techo: CAP.techoAmbiente,

    const TABS = [["ahora", "General"], ["errores", "Errores"], ["capacidad", "Capacidad"], ["historia", "Historia y versiones"], ["payload", "Payload"], ["escenarios", "Escenarios"]];
    const tabs = TABS.map(([id, label]) => ({

    // Delta contra su historia, por endpoint de ESTA corrida (mismo baseline que el semáforo).

    const deltaPorEp = new Map(filasActual.map((f) => [f.endpoint, f.deltaGlobalPct]));
    const deltasConocidos = decorated.map((e) => deltaPorEp.get(e.name)).filter((d) => d != null);
    const deltaTextoDe = (d) => (d == null ? "sin historia" : Math.abs(Math.round(d)) + "% " + (d <= 0 ? "más rápido" : "más lento"));

    const conLimite = decorated.filter((e) => e.limite);

    const dMin = deltasConocidos.length ? Math.min.apply(null, deltasConocidos) : null;
    const dMax = deltasConocidos.length ? Math.max.apply(null, deltasConocidos) : null;

    const sc = Object.assign({}, historico.scorecard || {});
    if (sc.globalDeltaLabel) sc.globalDeltaLabel = String(sc.globalDeltaLabel).replace(".", ",");
    const hayVersionAnterior = histDisponible && sc.versionAnterior && sc.versionAnterior !== "sin versión anterior";
    const versionMala = hayVersionAnterior && (sc.verdictLabel === "Mixta" || sc.verdictLabel === "Problemática");
    const preguntas = [
      failCount === 0
        ? { pregunta: "¿Funciona?", respuesta: "Sí", colorVar: "var(--ok)", detalle: (nEp === 1 ? "El endpoint respondió" : "Los " + nEp + " endpoints respondieron") + " sin errores." + (warnCount ? " " + plural(warnCount, "descartó", "descartaron") + " iteraciones (no llegó a la tasa pedida)." : "") }
        : { pregunta: "¿Funciona?", respuesta: failCount * 4 <= nEp ? "Casi todo" : "No", colorVar: "var(--fail)", detalle: (nEp - failCount) + " de " + nEp + " sin errores. " + conErrores.slice(0, 3).map(errTxt).join("; ") + (conErrores.length > 3 ? "; y " + (conErrores.length - 3) + " más" : "") + "." },
      !conLimite.length
        ? { pregunta: "¿Es rápida?", respuesta: "Sin límite", colorVar: "var(--text-dim)", detalle: "Ningún endpoint de esta corrida tiene un tiempo límite definido." }
        : pasados.length === 0

          : { pregunta: "¿Es rápida?", respuesta: "No en todos", colorVar: "var(--warn)", detalle: plural(pasados.length, "endpoint superó", "endpoints superaron") + " su tiempo límite: " + pasados.slice(0, 3).map((e) => methodOf(e.name) + " (" + msLabel(e.p95Raw) + " de " + msLabel(e.limite) + ")").join(", ") + (pasados.length > 3 ? " y " + (pasados.length - 3) + " más" : "") + "." },
      !histDisponible || !deltasConocidos.length
        ? { pregunta: "¿Empeoró?", respuesta: "Sin historia", colorVar: "var(--text-dim)", detalle: "Todavía no hay suficientes corridas comparables para decirlo." }
        : historico.semaforo.hasRows
          ? { pregunta: "¿Empeoró?", respuesta: "Sí, en " + historico.semaforo.rows.length, colorVar: "var(--warn)", detalle: historico.semaforo.rows.slice(0, 3).map((r) => r.name + " (" + String(r.deltaGlobalLabel).replace(".", ",") + ")").join(", ") + " contra su historia." }
          : versionMala
            ? { pregunta: "¿Empeoró?", respuesta: "Contra la versión anterior, sí", colorVar: "var(--warn)", detalle: "Veredicto " + sc.verdictLabel + " (" + sc.globalDeltaLabel + " en promedio contra " + sc.versionAnterior + "), aunque ninguno pasó el umbral de alerta. " + rangoDeltas }
            : dMax > 0
              ? { pregunta: "¿Empeoró?", respuesta: "Sin alertas", colorVar: "var(--ok)", detalle: "Ninguno pasó el umbral de alerta. " + rangoDeltas }
              : { pregunta: "¿Empeoró?", respuesta: "No", colorVar: "var(--ok)", detalle: (deltasConocidos.length === nEp ? "Todos igual o más rápidos. " : deltasConocidos.length === 1 ? "El único de " + nEp + " con historia, igual o más rápido. " : "Los " + deltasConocidos.length + " de " + nEp + " que tienen historia, igual o más rápidos. ") + rangoDeltas },
    ];
    // Cuarta pregunta (2026-10-08), de la pestaña Capacidad.

      : { pregunta: "¿Aguanta más carga?", respuesta: menor.cat === "riesgo" ? "No en todos" : "Sí", colorVar: menor.cat === "riesgo" ? "var(--fail)" : menor.cat === "ajustado" ? "var(--warn)" : "var(--ok)",

    const exec = {
      kicker: GS32.meta.tituloTipo + " de API · GS32 · " + GS32.meta.ambienteLabel + " · " + GS32.meta.versionLabel + " · " + GS32.meta.fechaLabel + ", " + windowRangeLabel(GS32.meta.inicioHH, GS32.meta.inicioMM, RUN_WINDOW_SECONDS),

          : "No hay una versión anterior medida con la misma configuración: la comparación es contra las corridas anteriores de esta versión. ") + (hayVersionAnterior ? rangoDeltas : preguntas[2].detalle),

      meta: GS32.meta,

      viewAllExtra: viewMode === "all" && !hasSelection ? "active" : "",
      viewWarnExtra: viewMode === "warn" && !hasSelection ? "active" : "",
      viewFailExtra: viewMode === "fail" && !hasSelection ? "active" : "",
      filterBtnExtra: state.showFilterPanel ? "active" : "",

      riesgoToggleLabel: riesgoExpand ? "Ver menos" : "Ver " + (insightsAll.riesgo.length - DEFAULT_VISIBLE) + " más",
      confoundToggleLabel: confoundExpand ? "Ver menos" : "Ver " + (insightsAll.confound.length - DEFAULT_VISIBLE) + " más",
      handlers: {

        showWarn: () => this.setState({ viewMode: "warn", selectedNames: [], selectedResources: [] }),
        showFail: () => this.setState({ viewMode: "fail", selectedNames: [], selectedResources: [] }),
        clearChips: () => this.setState({ selectedNames: [], selectedResources: [] }),
        toggleFilterPanel: () => this.setState({ showFilterPanel: !this.state.showFilterPanel }),
        toggleHallazgo: () => this.setState({ expandHallazgo: !this.state.expandHallazgo }),
        toggleRiesgo: () => this.setState({ expandRiesgo: !this.state.expandRiesgo }),
        toggleConfound: () => this.setState({ expandConfound: !this.state.expandConfound }),
        showPatronTop10: () => this.setState({ patronMode: "top10" }),
        showPatronAll: () => this.setState({ patronMode: "all" }),
        hoverOut: clearHover,
        verTecnica: ponerVista("tecnica"),
        verEjecutiva: ponerVista("ejecutiva"),
        verTecnicaEndpoints: () => {
          ponerVista("tecnica", { tab: "ahora", mapaVista: "tabla" })();
          const el = typeof document !== "undefined" ? document.getElementById("sec-mapa") : null;
          if (el && el.scrollIntoView) el.scrollIntoView();
        },
      },
    };
  }
}

window.dcMontar(Component, document.getElementById('dc-tpl'), document.getElementById('dc-root'),
  { darkMode: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches });
</script>
</body>
</html>
