<script>// Runtime mínimo para el template del informe de GS32 (templates/gs32/informe.dc.html), que es el
// mockup aprobado hecho en el canvas de diseño de claude.ai. Ese canvas trae su propio runtime y no
// funciona fuera de claude.ai; esto implementa SOLO lo que el template usa, para que el informe sea un
// HTML autocontenido (se abre local, se sube como artifact de Actions o a GH Pages):
//
//   {{a.b.c}}                    en textos y atributos (solo rutas, el template no usa expresiones)
//   <template data-for="lista" data-as="x">   (era <sc-for list="{{lista}}" as="x">)
//   <template data-if="cond">                 (era <sc-if value="{{cond}}">)
//   onClick / onMouseEnter / onMouseLeave = "{{handler}}"
//   class Component extends DCLogic { state, setState(), renderVals() }
//
// scripts/gs32/informe-html.mjs convierte sc-for/sc-if a <template> al generar: el parser de HTML
// saca de lugar cualquier elemento desconocido que esté dentro de una <tbody>, y <template> no.
// Se carga inline en el HTML. Sin dependencias.
(function () {
  'use strict';

  const PATH = /\{\{\s*([A-Za-z_$][\w$]*(?:\.[\w$]+)*)\s*\}\}/g;
  const SOLO = /^\{\{\s*([A-Za-z_$][\w$]*(?:\.[\w$]+)*)\s*\}\}$/;

  function resolver(scope, ruta) {
    const partes = ruta.split('.');
    let v = scope[partes[0]];
    for (let i = 1; i < partes.length && v !== undefined && v !== null; i++) v = v[partes[i]];
    return v;
  }
  function interpolar(texto, scope) {
    return texto.replace(PATH, (_, ruta) => {
      const v = resolver(scope, ruta);
      return v === undefined || v === null ? '' : String(v);
    });
  }
  const hijosDe = (n) => (n.content ? n.content.childNodes : n.childNodes);

  function render(nodo, scope, padre) {
    if (nodo.nodeType === 3) {
      padre.appendChild(document.createTextNode(interpolar(nodo.nodeValue, scope)));
      return;
    }
    if (nodo.nodeType !== 1) return;
    const tag = nodo.localName;
    if (tag === 'template' && nodo.hasAttribute('data-for')) {
      const lista = resolver(scope, nodo.getAttribute('data-for')) || [];
      const as = nodo.getAttribute('data-as') || 'item';
      for (let i = 0; i < lista.length; i++) {
        const s = Object.create(scope);
        s[as] = lista[i];
        hijosDe(nodo).forEach((h) => render(h, s, padre));
      }
      return;
    }
    if (tag === 'template' && nodo.hasAttribute('data-if')) {
      if (resolver(scope, nodo.getAttribute('data-if'))) hijosDe(nodo).forEach((h) => render(h, scope, padre));
      return;
    }
    const el = nodo.namespaceURI && nodo.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(nodo.namespaceURI, nodo.tagName)
      : document.createElement(tag);
    for (const a of Array.from(nodo.attributes)) {
      const nombre = a.name;
      if (/^on[a-z]+$/i.test(nombre)) {
        const m = a.value.match(SOLO);
        const fn = m ? resolver(scope, m[1]) : null;
        if (typeof fn === 'function') el.addEventListener(nombre.slice(2).toLowerCase(), fn);
        continue;
      }
      el.setAttribute(nombre, interpolar(a.value, scope));
    }
    hijosDe(nodo).forEach((h) => render(h, scope, el));
    padre.appendChild(el);
  }

  class DCLogic {
    constructor(props) {
      this.props = props || {};
      this.state = {};
    }
    setState(parcial) {
      // Sin cambio real no se re-renderiza: al reemplazar el DOM, el navegador vuelve a disparar
      // mouseenter sobre el elemento nuevo que queda bajo el puntero, y sin esta guarda el hover
      // entraría en un bucle.
      const antes = JSON.stringify(Object.keys(parcial).map((k) => this.state[k]));
      const despues = JSON.stringify(Object.keys(parcial).map((k) => parcial[k]));
      Object.assign(this.state, parcial);
      if (antes !== despues && this.__pintar) this.__pintar();
    }
  }
  window.DCLogic = DCLogic;

  window.dcMontar = function (Componente, tpl, raiz, props) {
    const c = new Componente(props);
    c.__pintar = () => {
      const scrollY = window.scrollY;
      const frag = document.createDocumentFragment();
      const vals = c.renderVals();
      hijosDe(tpl).forEach((h) => render(h, vals, frag));
      raiz.replaceChildren(frag);
      window.scrollTo(0, scrollY);
    };
    c.__pintar();
    return c;
  };
})();
</script>
<script>

// Datos de la corrida: los inyecta scripts/gs32/informe-html.mjs en window.__GS32__. Este template
// no inventa ningún número (el mockup aprobado usaba una semilla pseudoaleatoria, que ya no existe): lo que no está en
// los datos se muestra como "s/d" o con un estado vacío.
const GS32 = window.__GS32__;
const RAW_NAMES = GS32.endpoints.map((e) => e.slug);
const RUN_WINDOW_SECONDS = GS32.ventanaSeg;

function colorVar(level) {
  return level === "ok" ? "var(--ok)" : level === "warn" ? "var(--warn)" : "var(--fail)";
}

// ---- Cuello de botella (Resumen Ejecutivo, 2026-09-18): motivo por endpoint -------------------
// Pedido de Carlos: listar endpoints + POR QUE son un cuello de botella. El motivo sale de
// señales que YA se calculan para la tarjeta de cada endpoint (error/patron/fase/apdex) - no es
// un texto nuevo escrito a mano por endpoint, es una explicacion generada de datos reales, con
// prioridad de que señal es mas diagnostica primero (un error rate real pesa mas que un apdex bajo).
// ---- Latencia por KB (2026-09-18): mismo calculo y MISMOS umbrales que el panel real "Latency
// Per KB" del dashboard de Grafana de pepper-API-testing (tooltip transcripto tal cual, no
// inventado): ratio = latencia promedio (ms) / payload promedio (KB). Un ratio ALTO ("Cuentagotas")
// es ineficiente - el servidor tarda mucho para entregar POCOS bytes (computo puro, no volumen de
// datos). Un ratio BAJO ("Manguera") es eficiente - entrega mucho volumen rapido. Usa p50 (no p95)
// como "latencia promedio", que es la lectura mas fiel a lo que el panel real llama "promedio".
// Nombres de banda CAMBIADOS a proposito de los que usa pepper ("Eficiencia alta"/"Critico") a
// algo mas acotado ("Proporcional"/"Desproporcionado"): Carlos encontro un problema real - un
// endpoint puede salir en VERDE acá (porque su latencia es chica en relacion a su payload) y
// seguir siendo un cuello de botella por OTRO motivo (computo puro, ej. appraise-market-value,
// que esta en la lista de Cuellos de Botella y en el Semaforo pese a dar "verde" en esta metrica
// puntual). El verde de esta tabla NO es un veredicto de salud general del endpoint, es una
// respuesta acotada a UNA pregunta especifica ("¿la latencia se explica por el volumen de datos
// o no?") - el nombre de la banda tiene que dejar eso claro, no sugerir "todo bien".
function latencyPerKBBand(ratio) {
  if (ratio <= 5000) return { label: "Proporcional", colorVar: colorVar("ok") };
  if (ratio <= 50000) return { label: "A revisar", colorVar: colorVar("warn") };
  if (ratio <= 150000) return { label: "Desproporcionado", colorVar: "var(--accent)" };
  return { label: "Muy desproporcionado", colorVar: colorVar("fail") };
}

function motivoCuelloDeBotella(ep) {
  if (ep.errorTypeLabel) return "Error rate elevado (" + ep.errorLabel + ep.errorTypeLabel + ")";
  if (ep.isFail) return "Error rate elevado (" + ep.errorLabel + ")";
  if (ep.patternLabel === "EPISÓDICO" && ep.cacheFriaHint) return "Picos de latencia aislados (máx " + ep.maxLabel + " vs p95 " + ep.p95Label + "), y la primera pegada en frío también fue lenta";
  if (ep.patternLabel === "EPISÓDICO") return "Picos de latencia aislados (máx " + ep.maxLabel + " vs p95 " + ep.p95Label + ")";
  if (ep.isWarn) return "Pérdida de iteraciones bajo carga (" + ep.droppedLabel + ")";
  if (ep.apdexScore != null && ep.apdexScore < 0.85) return "Satisfacción baja (Apdex " + ep.apdexLabel + ")";
  return ep.usoLimiteLabel ? "p95 " + ep.p95Label + ", " + ep.usoLimiteLabel : "p95 " + ep.p95Label;
}

// El nombre real es "recurso/metodo" (ej. "bonds/get-bond-by-uuid"). Mostrar solo el metodo
// evita repetir el recurso en cada tarjeta/chip - el recurso ya se elige aparte, con los
// chips "Por API".
function resourceOf(name) {
  const i = name.indexOf("/");
  return i === -1 ? name : name.slice(0, i);
}
function methodOf(name) {
  const i = name.indexOf("/");
  return i === -1 ? name : name.slice(i + 1);
}
const RESOURCES = Array.from(new Set(RAW_NAMES.map(resourceOf))).sort();

// Tier por NOMBRE real, no por posicion en la lista: asi appraiser/bond-payment-forecasts/
// bond-screener (los unicos endpoints de calculo JSON-RPC del catalogo real) siempre caen en
// "calc", y yield-curves/get-yield-curve-metrics-by-uuid (el unico con variabilidad ya
// documentada, H-016/H-017) siempre cae en "lowtps" - sin esto, el resumen ejecutivo puede
// terminar describiendo un endpoint que el propio dataset no generó así.
function tierFor(name) {
  if (name.indexOf("appraiser/") === 0 || name.indexOf("bond-payment-forecasts/") === 0 || name.indexOf("bond-screener/") === 0) {
    return "calc";
  }
  if (name === "yield-curves/get-yield-curve-metrics-by-uuid") return "lowtps";
  if (name.indexOf("/get-all-") !== -1) return "catalog";
  return "detail";
}

// Una fila por endpoint con lo medido. Los campos que salen de samples.csv.gz (fases, payload,
// Apdex, tipo de error) quedan en null en una corrida sin CSV.
function buildRawDataset() {
  return GS32.endpoints.map((e) => ({ ...e, name: e.slug, tier: tierFor(e.slug), tps: e.tasa, throughput: e.tps, errorRate: e.errorPct }));
}

// ---- Geometria de graficos (SVG en linea, sin libreria) ----------------------------------

function xAt(i, n, w) { return n === 1 ? 0 : (i / (n - 1)) * w; }

function chartGeom(values, w, h, padT, padB) {
  const n = values.length;
  const lo = Math.min.apply(null, values);
  const hi = Math.max.apply(null, values);
  const range = (hi - lo) || 1;
  const innerH = h - padT - padB;
  const pts = values.map((v, i) => [xAt(i, n, w), padT + innerH * (1 - (v - lo) / range)]);
  const points = pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const areaPoints = points + " " + pts[pts.length - 1][0].toFixed(1) + "," + (h - padB).toFixed(1) + " 0.0," + (h - padB).toFixed(1);
  return { points: points, areaPoints: areaPoints, lo: lo, hi: hi, last: values[values.length - 1], pts: pts, values: values, n: n };
}

// Misma escala para varias series del mismo grafico (ej. p95 y p50, o hasta 10 endpoints
// comparados), para que las lineas sean comparables entre si.
function chartGeomShared(seriesList, w, h, padT, padB) {
  const all = [].concat.apply([], seriesList);
  const lo = Math.min.apply(null, all);
  const hi = Math.max.apply(null, all);
  const range = (hi - lo) || 1;
  const innerH = h - padT - padB;
  return seriesList.map((values) => {
    const n = values.length;
    const pts = values.map((v, i) => [xAt(i, n, w), padT + innerH * (1 - (v - lo) / range)]);
    const points = pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    return { points: points, last: values[values.length - 1], pts: pts, values: values, n: n };
  });
}

// Escala estándar del Apdex (la que pasó Carlos, 2026-10-02). El puntaje lo calcula
// scripts/gs32/informe-html.mjs de las muestras crudas, con T = 500 ms y F = 1500 ms universales.
function apdexBand(score) {
  if (score >= 0.94) return { label: "Excelente", varName: "var(--ok)" };
  if (score >= 0.85) return { label: "Bueno", varName: "var(--ok)" };
  if (score >= 0.70) return { label: "Regular", varName: "var(--warn)" };
  if (score >= 0.50) return { label: "Pobre", varName: "var(--fail)" };
  return { label: "Inaceptable", varName: "var(--fail)" };
}

// Igual que chartGeom, pero el dominio (lo/hi) se calcula incluyendo un techo estático (ej. el
// maxVUs del profile) aunque ningún punto de la serie lo alcance todavía - así la línea de techo
// siempre entra en el viewBox en vez de quedar recortada o, peor, fuera de la vista visible.
function chartGeomWithCeiling(values, ceiling, w, h, padT, padB) {
  const domainValues = ceiling != null ? values.concat([ceiling]) : values;
  const lo = Math.min.apply(null, domainValues);
  const hi = Math.max.apply(null, domainValues);
  const range = (hi - lo) || 1;
  const innerH = h - padT - padB;
  const n = values.length;
  const pts = values.map((v, i) => [xAt(i, n, w), padT + innerH * (1 - (v - lo) / range)]);
  const points = pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const areaPoints = points + " " + pts[pts.length - 1][0].toFixed(1) + "," + (h - padB).toFixed(1) + " 0.0," + (h - padB).toFixed(1);
  const yFor = (v) => (padT + innerH * (1 - (v - lo) / range)).toFixed(1);
  return { points: points, areaPoints: areaPoints, lo: lo, hi: hi, last: values[values.length - 1], pts: pts, values: values, n: n, yFor: yFor };
}

// Bandas invisibles de hover: una por punto de la serie, a lo ancho de todo el grafico. Al
// pasar el mouse por cualquier tramo de la linea, dispara el punto mas cercano en el tiempo.
function buildBands(n, w, h, chartKey, enterFn) {
  const bw = w / n;
  const bands = [];
  for (let i = 0; i < n; i++) {
    bands.push({ x: (i * bw).toFixed(1), w: bw.toFixed(1), onEnter: enterFn(chartKey, i) });
  }
  return bands;
}

function timeLabel(i, n, totalSeconds) {
  const s = Math.round((i / (n - 1)) * totalSeconds);
  const m = Math.floor(s / 60);
  const ss = s % 60;
  return m + ":" + String(ss).padStart(2, "0");
}

// Ventana de la corrida actual, derivada de RUN_WINDOW_SECONDS - una sola fuente para el tag del
// encabezado, el KPI y el subtítulo de "Panel general" (antes "5 min" tipeado en los 3 lugares).
function windowDurationLabel(seconds) {
  if (seconds % 3600 === 0) return (seconds / 3600) + " h";
  return Math.round(seconds / 60) + " min";
}
function windowRangeLabel(startHH, startMM, seconds) {
  const endTotalMin = startHH * 60 + startMM + Math.round(seconds / 60);
  const endHH = Math.floor(endTotalMin / 60) % 24;
  const endMM = endTotalMin % 60;
  return String(startHH).padStart(2, "0") + ":" + String(startMM).padStart(2, "0") + "–" +
    String(endHH).padStart(2, "0") + ":" + String(endMM).padStart(2, "0");
}
function msLabel(v) { return v == null ? "s/d" : Math.round(v).toLocaleString("es-AR") + " ms"; }
function pctLabel(v) { return v == null ? "s/d" : v.toFixed(2) + "%"; }
function itsLabel(v) { return v == null ? "s/d" : v.toFixed(2) + " it/s"; }
function vusLabel(v) { return Math.round(v) + " VUs"; }
function kbLabel(v) { return Math.round(v) + " KB/s"; }

// ---- Serie de la corrida completa (panel general) ----------------------------------------
const OVERVIEW_POINTS = GS32.serie.length;
const OVERVIEW_SECONDS = RUN_WINDOW_SECONDS;
// Techo de VUs = vus_max de k6 (los VUs asignados a todos los scenarios): cuánto margen queda
// antes de que k6 no pueda sostener la tasa.
const OVERVIEW_VUS_CEILING = GS32.vusMax;

// Serie real del dashboard nativo de k6 (un punto por tramo de GS32.bucketSeg segundos). Es
// AGREGADA: mezcla todos los endpoints y mide cada request HTTP, no la iteración.
function buildOverviewSeries() {

// ---- Serie de UN endpoint durante la corrida (usada por el panel "Por endpoint") ---------
// Reusa la entrada ya calibrada (p95/p50/tps/errorRate/max) y le agrega una trayectoria en el
// tiempo: arranque frio, un pico si ese endpoint ya tiene spikeLevel alto, y un bache de error
// solo si errorRate > 0 - nunca inventa un endpoint fallando que el dataset agregado no tiene.
const ENDPOINT_SECONDS = RUN_WINDOW_SECONDS;

// Serie de UN endpoint en el tiempo, de samples.csv.gz (tramos de GS32.bucketSeg segundos). null
// si la corrida no tiene CSV: k6 solo exporta en el tiempo las métricas sin tags.
function buildEndpointTimeline(entry) {
  return GS32.porEndpointSerie ? GS32.porEndpointSerie[entry.name] || null : null;
}

// ============================================================================
// Comparativa entre corridas y versiones: filas REALES de metrics/gs32/ con la misma clave de
// baseline que esta corrida (endpoint::ambiente::tipo::nivel[::pool]). baseline_global/version y
// sus deltas los calcula scripts/gs32/api-baseline-core.mjs (el motor real) en el generador;
// regressionPct y baselineOwn/deltaOwnPct los agrega el generador sobre esas mismas filas.
// ============================================================================
const HIST = GS32.historico;
const HISTORICO_VERSIONS = Array.from(new Set(HIST.runs.filter((r) => !r.escenario).map((r) => r.version)));
const HISTORICO_VERSION_ACTUAL = HISTORICO_VERSIONS[HISTORICO_VERSIONS.length - 1] || null;
const HISTORICO_VERSION_ANTERIOR = HISTORICO_VERSIONS.length > 1 ? HISTORICO_VERSIONS[HISTORICO_VERSIONS.length - 2] : null;
function versionIdx(v) { return HISTORICO_VERSIONS.indexOf(v); }
const ESCENARIOS_DEF = Array.from(new Set(HIST.runs.filter((r) => r.escenario).map((r) => r.escenario))).map((nombre) => ({ nombre }));
// Corridas mínimas con la misma clave para mostrar tendencia/comparativa: con 1 no hay contra qué.
const HIST_MIN_CORRIDAS = 2;

// ---- Motor de baseline: espejo de scripts/lib/api-baseline-core.mjs --------------------
const HIST_WARNING_DELTA_PCT = 50;
const HIST_CRITICAL_DELTA_PCT = 100;
const HIST_OUTLIER_MULTIPLIER = 3;

function mediaHist(valores) {
  return valores.length ? valores.reduce((a, b) => a + b, 0) / valores.length : null;
}

function estadoDesdeDeltaHist(deltaPct) {
  if (deltaPct === null || deltaPct === undefined) return null;
  if (deltaPct > HIST_CRITICAL_DELTA_PCT) return 'CRITICAL';
  if (deltaPct > HIST_WARNING_DELTA_PCT) return 'warning';
  if (deltaPct < -HIST_WARNING_DELTA_PCT) return 'mejora';
  return 'ok';
}

function deltaLabel(pct) {
  if (pct === null || pct === undefined) return '-';
  return (pct > 0 ? '+' : '') + pct.toFixed(1) + '%';
}

function colorVarFromEstado(estado) {
  if (estado === 'CRITICAL') return colorVar('fail');
  if (estado === 'warning') return colorVar('warn');
  if (estado === 'mejora') return colorVar('ok');
  return 'var(--text-dim)';
}

// Umbral de COLOR (no de "hallazgo notable"): mismo criterio que xPctHtml en
// cross-suite.browser.js de pepper-API-testing (±15%) - deliberadamente mas laxo que
// SCN_DEGRADED_PCT/SCN_IMPROVED_PCT (50%/-30%, ver escenarioFindings), que clasifican que ENTRA
// a "hallazgos". Para la tabla comparativa completa de Escenarios, pepper pinta cualquier delta
// moderado (15%+), no solo los que llegan a "notable" - por eso NO se reusa
// colorVarFromEstado(estadoDesdeDeltaHist(...)) acá, que usa el umbral del Semáforo (50/100%).
function colorVarFromPctSimple(pct) {
  if (pct == null) return 'var(--text-dim)';
  if (pct <= -15) return colorVar('ok');
  if (pct >= 15) return colorVar('fail');
  return 'var(--text-dim)';
}

function shortNameHist(endpoint) {
  return methodOf(endpoint);
}

// ---- Deteccion de anomalias por endpoint: pedido explicito de Carlos ("es posible?") ----------
// SI es posible, y sin inventar un metodo estadistico nuevo: reusa el `estado` que
// calcularBaselinesHistoricos ya calcula para CADA corrida (warning/CRITICAL/mejora/ok, contra el
// baseline_global de ese mismo endpoint) y solo lo RESUME, agrupando corridas consecutivas con la
// misma direccion:
//   - PICO AISLADO: una corrida en warning/CRITICAL/mejora con las corridas vecinas en 'ok' - un
//     valor puntual que no se repite.
//   - CAMBIO SOSTENIDO: 2 o mas corridas SEGUIDAS en la misma direccion - mismo concepto de
//     "persistencia" que ya usa scripts/lib/baseline-core.mjs para escalar de warning a critical
//     (un pico solo nunca alcanza, hace falta que se repita), aplicado acá para distinguir ruido
//     de un cambio real que arranca en una corrida/version puntual.
// Como baseline_global se ADAPTA al nivel de cada endpoint (ver la limitacion ya documentada en
// buildScorecard), un cambio sostenido largo (ej. bond-groups, cronico desde hace 3 versiones)
// va a aparecer con una duracion CORTA acá (1-3 corridas): el detector marca el ARRANQUE del
// cambio, no todo el tiempo que dura - es la señal correcta para contestar "¿desde cuando viene
// pasando esto?", no un conteo de cuanto tiempo lleva.
function directionDeEstado(estado) {
  if (estado === 'warning' || estado === 'CRITICAL') return 'degradacion';
  if (estado === 'mejora') return 'mejora';
  return null;
}

function detectarAnomaliasHistoricas(rows) {
  // rows: filas de UN endpoint, en orden cronologico, SIN la corrida de escenario (que tiene su
  // propio arbol de comparacion y no participa de "cuando empezo a cambiar la tendencia normal").
  const picos = [];
  const cambios = [];
  let i = 0;
  while (i < rows.length) {
    const dir = directionDeEstado(rows[i].estado);
    if (!dir) { i++; continue; }
    let j = i;
    while (j + 1 < rows.length && directionDeEstado(rows[j + 1].estado) === dir) j++;
    const largo = j - i + 1;
    const item = {
      fecha: rows[i].fecha,
      hora: rows[i].hora,
      version: rows[i].version,
      tipo: dir,
      deltaLabel: deltaLabel(rows[i].deltaGlobalPct),
      largo,
    };
    if (largo === 1) picos.push(item);
    else cambios.push(item);
    i = j + 1;
  }
  return { picos, cambios };
}

// ---- Scorecard de version: MISMA formula que extract-for-ai.js de pepper-API-testing ----
function buildScorecard(filasConBaseline) {
  const filasActual = filasConBaseline.filter((f) => f.version === HISTORICO_VERSION_ACTUAL && !f.escenario);
  const filasAnterior = filasConBaseline.filter((f) => f.version === HISTORICO_VERSION_ANTERIOR && !f.escenario);
  const avgActual = mediaHist(filasActual.map((f) => f.p95));
  const avgAnterior = mediaHist(filasAnterior.map((f) => f.p95));
  // Con una sola versión en la historia no hay veredicto de versión: se dice, no se inventa un 0%.
  if (avgAnterior == null) {
    return { avgActual, avgAnterior, globalDeltaPct: null, resolved: [], news: [], verdict: { label: 'Sin versión anterior', emoji: '➖', colorVar: 'var(--text-dim)' } };
  }
  const globalDeltaPct = ((avgActual - avgAnterior) / avgAnterior) * 100;

  const resolved = [];
  const news = [];
  RAW_NAMES.forEach((ep) => {
    const rowsActual = filasActual.filter((f) => f.endpoint === ep);
    const rowsAnterior = filasAnterior.filter((f) => f.endpoint === ep);
    const pActual = mediaHist(rowsActual.map((f) => f.p95));
    const pAnterior = mediaHist(rowsAnterior.map((f) => f.p95));
    if (pActual == null || pAnterior == null) return;
    const deltaPct = ((pActual - pAnterior) / pAnterior) * 100;
    // "Resuelto" en pepper exige ADEMAS ser cronico (outlierRecurrenceMap >= 5 corridas como
    // outlier historico) - sin eso, cualquier mejora grande contaria como "problema resuelto".
    // Ese contador NO es portable acá con solo ~10 corridas sinteticas: nuestro baseline_global
    // se ADAPTA al nivel de cada endpoint (igual que el real), asi que un endpoint sostenido en
    // un nivel malo desde siempre NUNCA dispara warning contra SU PROPIO baseline - el gate de
    // "cronico" nunca se cumpliria aunque el endpoint sea justo el caso que se quiere destacar.
    // Simplificado a proposito a "mejora >=50%", documentado como limitacion explicita (no
    // fingiendo un contador de recurrencia que no se puede calcular bien con esta escala de datos).
    const estaAhoraEnAlerta = rowsActual.some((f) => f.estado === 'warning' || f.estado === 'CRITICAL');
    if (deltaPct <= -50) resolved.push({ name: shortNameHist(ep), resource: resourceOf(ep), delta: deltaLabel(deltaPct), deltaRaw: deltaPct });
    if (deltaPct >= 50 && estaAhoraEnAlerta) news.push({ name: shortNameHist(ep), resource: resourceOf(ep), delta: deltaLabel(deltaPct), deltaRaw: deltaPct });
  });
  // Ordenados por magnitud (la mejora mas grande primero, la regresion mas grande primero): asi
  // el resumen ejecutivo en lenguaje llano puede citar "el peor"/"el mejor" sin tener que buscarlo
  // aparte - son las mismas listas que ya mostraba el Scorecard, solo ordenadas.
  resolved.sort((a, b) => a.deltaRaw - b.deltaRaw);
  news.sort((a, b) => b.deltaRaw - a.deltaRaw);

  let verdict;
  if (globalDeltaPct < -20 && news.length === 0) verdict = { label: 'Excelente', emoji: '🎉', colorVar: 'var(--ok)' };
  else if (globalDeltaPct < -10 && news.length <= 1) verdict = { label: 'Positiva', emoji: '👍', colorVar: 'var(--ok)' };
  else if (globalDeltaPct < 0 && news.length <= 2) verdict = { label: 'Aceptable', emoji: '🙂', colorVar: 'var(--accent2)' };
  else if (globalDeltaPct < 0 && news.length >= 3) verdict = { label: 'Mixta', emoji: '⚠️', colorVar: 'var(--warn)' };
  else if (globalDeltaPct > 10 || news.length >= 3) verdict = { label: 'Problemática', emoji: '🔴', colorVar: 'var(--fail)' };
  else verdict = { label: 'Neutral', emoji: '➖', colorVar: 'var(--text-dim)' };

  return { avgActual, avgAnterior, globalDeltaPct, resolved, news, verdict };
}

// Dataset + baseline: se computan UNA vez por render y se comparten entre buildHistoricoViewModel
// (los 5 paneles agregados) y el panel-inspector por endpoint (que necesita las mismas filas).
function buildHistoricoRawAndBaseline() {
  return { filas: HIST.filas, conBaseline: HIST.filas, runs: HIST.runs };
}

const VERSION_COLOR_PALETTE = ['var(--text-faint)', 'var(--text-dim)', 'var(--confound)', 'var(--accent)', 'var(--accent2)'];
function versionColorFor(v) {
  return VERSION_COLOR_PALETTE[Math.min(versionIdx(v), VERSION_COLOR_PALETTE.length - 1)];
}

// ---- Escenarios: catalogo + detalle + comparar-contra-otro-escenario -----------------------
// Porte de scripts/report-assets/scenarios.browser.js (pepper-API-testing, el tab "Escenarios"
// real del informe HTML), a pedido explicito de Carlos (2026-09-18: "réplica más completa de
// pepper") tras confirmar que la v26 (1 sola corrida de escenario, sin catalogo ni comparacion)
// se quedaba corta. Umbrales EXACTOS del archivo real, no inventados: SCN_DEGRADED_PCT=50,
// SCN_IMPROVED_PCT=-30, SCN_MIN_ABS_MS=200 (piso absoluto para no contar como "degradado" un
// catalogo que pasa de 30ms a 46ms - 53% pero 16ms, ruido) y el corte de "generalizada" en
// max(3, 15% de los medidos). "dNormal" de pepper = nuestro deltaGlobalPct de una fila de
// escenario (contra el baseline normal del endpoint); "dOwn" = deltaOwnPct (contra el promedio de
// las corridas ANTERIORES de ESE MISMO escenario, ver calcularBaselinesHistoricos).
const SCN_DEGRADED_PCT = 50;
const SCN_IMPROVED_PCT = -30;
// El piso real de pepper (200ms) esta calibrado para SU escala de latencias, no la de GS32: acá el
// tier catálogo mide 30-130ms de base (ver baseP95HistoricoFor), asi que 200ms apagaria el piso
// para ese tier entero - nunca ningun cambio de catálogo lo cruzaria, ni siquiera uno real. 20ms
// es el techo aproximado del jitter de fondo en ese tier (jitterAmplitudeHistorico llega a 40% de
// la base, ~12-52ms en catálogo) - filtra ruido sin taparse la mejora real que el escenario de
// caché busca mostrar. Recalibrado a la escala propia, no un numero universal (ver CLAUDE.md).
const SCN_MIN_ABS_MS = 20;
const SCN_OWN_TREND_PCT = 15;

function buildEscenariosCatalogo(conBaseline) {
  const porNombre = new Map();
  conBaseline.forEach((f) => {
    if (!f.escenario) return;
    if (!porNombre.has(f.escenario)) porNombre.set(f.escenario, []);
    porNombre.get(f.escenario).push(f);
  });

  return ESCENARIOS_DEF.map((def) => {
    const filas = porNombre.get(def.nombre) || [];
    const corridas = [];
    const vistos = new Set();
    filas.forEach((f) => {
      if (vistos.has(f.timestamp)) return;
      vistos.add(f.timestamp);
      corridas.push({ runId: f.timestamp, fecha: f.fecha, hora: f.hora, version: f.version });
    });
    const ultimaCorridaId = corridas.length ? corridas[corridas.length - 1].runId : null;
    // "endpointsLast" = la fila de CADA endpoint en la ULTIMA corrida de este escenario - la foto
    // vigente para el catalogo/comparaciones, mismo recorte que ctx.endpoints[...].last en
    // report-scenarios.js (no toda la serie, que no hace falta para esto).
    const endpointsLast = new Map();
    filas.forEach((f) => {
      if (f.timestamp !== ultimaCorridaId) return;
      endpointsLast.set(f.endpoint, f);
    });
    return {
      nombre: def.nombre,
      corridas,
      corridasCount: corridas.length,
      primeraFecha: corridas.length ? corridas[0].fecha : null,
      ultimaFecha: corridas.length ? corridas[corridas.length - 1].fecha : null,
      ultimaVersion: corridas.length ? corridas[corridas.length - 1].version : null,
      endpointsLast,
    };
  });
}

function escenarioFindings(ctx) {
  const eps = [];
  ctx.endpointsLast.forEach((f, endpoint) => {
    if (f.baselineGlobal == null || f.deltaGlobalPct == null) return;
    eps.push({ endpoint, f, absDiff: Math.abs(f.p95 - f.baselineGlobal) });
  });
  const degraded = eps.filter((e) => e.f.deltaGlobalPct >= SCN_DEGRADED_PCT && e.absDiff >= SCN_MIN_ABS_MS)
    .sort((a, b) => b.f.deltaGlobalPct - a.f.deltaGlobalPct);
  const improved = eps.filter((e) => e.f.deltaGlobalPct <= SCN_IMPROVED_PCT && e.absDiff >= SCN_MIN_ABS_MS)
    .sort((a, b) => a.f.deltaGlobalPct - b.f.deltaGlobalPct);
  return { measured: eps.length, degraded, improved };
}

function escenarioOwnTrendNote(ctx) {
  if (ctx.corridasCount <= 1) return '';
  const eps = [];
  ctx.endpointsLast.forEach((f) => { if (f.baselineOwn != null && f.deltaOwnPct != null) eps.push(f); });
  if (!eps.length) return '';
  const worsening = eps.filter((f) => f.deltaOwnPct >= SCN_OWN_TREND_PCT).length;
  const improving = eps.filter((f) => f.deltaOwnPct <= -SCN_OWN_TREND_PCT).length;
  if (worsening > improving && worsening > 0) {
    return ' Comparado con sus propias corridas anteriores, la tendencia empeora en ' + worsening + ' endpoint' + (worsening === 1 ? '' : 's') + ' — este escenario se está poniendo más lento con el tiempo, no es un pico aislado.';
  }
  if (improving > worsening && improving > 0) {
    return ' Comparado con sus propias corridas anteriores, la tendencia mejora en ' + improving + ' endpoint' + (improving === 1 ? '' : 's') + ' — el impacto se está disipando.';
  }
  return '';
}

function escenarioNarrativa(ctx, findings) {
  let texto;
  if (!findings.degraded.length && !findings.improved.length) {
    texto = 'No muestra cambios notables frente al baseline normal — sus ' + findings.measured + ' endpoints medidos se comportan dentro de lo esperado.';
  } else if (findings.degraded.length) {
    const generalizada = findings.degraded.length >= Math.max(3, Math.round(findings.measured * 0.15));
    const worst = findings.degraded[0];
    texto = 'Muestra ' + (generalizada ? 'degradación generalizada' : 'degradación puntual') + ' frente al baseline normal — ' +
      findings.degraded.length + ' de ' + findings.measured + ' endpoints superan +' + SCN_DEGRADED_PCT + '%. El peor caso, ' +
      shortNameHist(worst.endpoint) + ', pasa de ' + msLabel(worst.f.baselineGlobal) + ' a ' + msLabel(worst.f.p95) + ' (' + deltaLabel(worst.f.deltaGlobalPct) + ').';
  } else {
    const best = findings.improved[0];
    texto = 'Muestra mejoras notables sin degradación frente al baseline normal — ' +
      findings.improved.length + ' de ' + findings.measured + ' endpoints mejoran más de ' + Math.abs(SCN_IMPROVED_PCT) + '%. El mejor caso, ' +
      shortNameHist(best.endpoint) + ', pasa de ' + msLabel(best.f.baselineGlobal) + ' a ' + msLabel(best.f.p95) + ' (' + deltaLabel(best.f.deltaGlobalPct) + ').';
  }
  texto += escenarioOwnTrendNote(ctx);
  return texto;
}

function escenarioCompararFilas(ctxA, ctxB) {
  const rows = [];
  ctxA.endpointsLast.forEach((fa, endpoint) => {
    const fb = ctxB.endpointsLast.get(endpoint);
    if (!fb) return;
    const delta = fa.p95 ? ((fb.p95 - fa.p95) / fa.p95) * 100 : null;
    rows.push({ endpoint, fa, fb, delta });
  });
  rows.sort((x, y) => Math.abs(y.delta == null ? -1 : y.delta) - Math.abs(x.delta == null ? -1 : x.delta));
  return rows;
}

const PATRON_TOP_N = 10;

// Tendencia con Kendall: la calcula scripts/gs32/informe-html.mjs (p exacto), acá solo se
// muestra. tau sin la magnitud engaña, así que van juntos.
function tendenciaDe(ep) {
  const t = (HIST.tendencia || {})[ep];
  if (!t || t.estado === 'n insuficiente') {
    return { tendLabel: 'n insuficiente', tendDetalle: (t ? t.n : 0) + ' de ' + (HIST.tendenciaMinN || 5) + ' corridas', tendColorVar: 'var(--text-faint)' };
  }
  const cambio = t.cambioPct === null ? '' : (t.cambioPct >= 0 ? '+' : '') + t.cambioPct.toFixed(0) + '% · ';
  return {
    tendLabel: t.estado === 'sube' ? '▲ sube · VIGILAR' : t.estado === 'baja' ? '▼ baja' : 'sin tendencia',
    tendDetalle: cambio + 'τ ' + t.tau.toFixed(2) + ' · p ' + t.p.toFixed(3) + ' · n ' + t.n,
    tendColorVar: t.estado === 'sube' ? colorVar('fail') : t.estado === 'baja' ? colorVar('ok') : 'var(--text-dim)',
  };
}

function buildHistoricoViewModel(conBaseline, runs, patronMode) {
  // ---- Scorecard ----
  const sc = buildScorecard(conBaseline);
  const verdictBgVarOf = (v) => 'color-mix(in oklch, ' + v + ' 16%, var(--bg-elevated))';

  // ---- Tendencia: ULTIMAS 10 corridas (recorte pedido por Carlos - las 21/37 barras en una
  // sola card quedaban ilegibles). El armado de las barras con hover vive en renderVals() (abajo,
  // en la clase Component), porque necesita el estado de hover - acá solo se prepara el DATO.
  const runsRecientes = runs.slice(-10);
  const runAverages = runsRecientes.map((run) => {
    const rows = conBaseline.filter((f) => f.timestamp === run.runId);
    return { run, avg: mediaHist(rows.map((f) => f.p95)) };
  });
  // "Hoy" = la ultima corrida NORMAL de TODA la historia (no solo de las ultimas 10, y no la de
  // escenario) - antes esto era un runId hardcodeado ('run-9'), roto apenas se agrego mas
  // historia. Se busca dinamicamente para no repetir ese bug.
  const runsNormales = runs.filter((r) => !r.escenario);
  const runHoy = runsNormales[runsNormales.length - 1];
  const filasHoy = conBaseline.filter((f) => f.timestamp === runHoy.runId);
  const baselinePromedio = mediaHist(filasHoy.map((f) => f.baselineGlobal).filter((v) => v !== null));

  // ---- Evolucion por version: ULTIMAS 10 versiones (mismo recorte, mismo motivo) ----
  const versionesRecientes = HISTORICO_VERSIONS.slice(-10);
  const maxVersionAvg = Math.max.apply(null, versionesRecientes.map((v) => mediaHist(conBaseline.filter((f) => f.version === v && !f.escenario).map((f) => f.p95))));
  const versionRows = versionesRecientes.map((v) => {
    const rows = conBaseline.filter((f) => f.version === v && !f.escenario);
    const avg = mediaHist(rows.map((f) => f.p95));
    const runCount = new Set(rows.map((f) => f.timestamp)).size;
    return {
      label: v + ' (×' + runCount + ')',
      widthPct: (avg / maxVersionAvg) * 100,
      valueLabel: msLabel(avg),
      extraClass: v === HISTORICO_VERSION_ACTUAL ? 'actual' : '',
    };
  });

  // ---- Semaforo: solo los endpoints EN ALERTA de la corrida mas reciente ----
  const semaforoRows = filasHoy
    .filter((f) => f.estado === 'warning' || f.estado === 'CRITICAL')
    .sort((a, b) => (b.deltaGlobalPct || 0) - (a.deltaGlobalPct || 0))
    .map((f) => {
      // Outlier: MISMO umbral (p95 > 3x baseline_global) que el panel real "Outliers" del
      // dashboard de Grafana de pepper-API-testing (verificado contra generate-metrics.js:
      // OUTLIER_MULTIPLIER = 3) - y el MISMO numero que ya usa HIST_OUTLIER_MULTIPLIER acá arriba
      // para limpiar el baseline, asi que no es un umbral nuevo, es reusar el mismo criterio con
      // otro proposito (marcar la fila, no descartarla del promedio).
      const outlierRatio = f.baselineGlobal ? f.p95 / f.baselineGlobal : null;
      const isOutlier = outlierRatio !== null && outlierRatio > HIST_OUTLIER_MULTIPLIER;
      return {
        name: shortNameHist(f.endpoint),
        resource: resourceOf(f.endpoint),
        p95Label: msLabel(f.p95),
        baselineLabel: f.baselineGlobal ? msLabel(f.baselineGlobal) : '-',
        deltaGlobalLabel: deltaLabel(f.deltaGlobalPct),
        deltaGlobalColorVar: colorVarFromEstado(f.estado),
        deltaVersionLabel: deltaLabel(f.deltaVersionPct),
        deltaVersionColorVar: colorVarFromEstado(estadoDesdeDeltaHist(f.deltaVersionPct)),
        regressionLabel: deltaLabel(f.regressionPct),
        regressionColorVar: colorVarFromEstado(estadoDesdeDeltaHist(f.regressionPct)),
        dotColorVar: colorVarFromEstado(f.estado),
        isOutlier,
        outlierRatioLabel: outlierRatio !== null ? outlierRatio.toFixed(1) + 'x' : '-',
      };
    });

  // ---- Endpoints Stability Score (bonus, hallado revisando el dashboard real de Grafana):
  // MISMA formula que el panel real homonimo - ratio = p95 actual / baseline_global, MISMOS
  // umbrales (verificado contra generate-metrics.js). Es el MISMO dato que ya muestra "Δ Global"
  // en el Semaforo de arriba, solo expresado como ratio en vez de porcentaje (ratio = 1 +
  // deltaGlobalPct/100) - se agrega como ranking visual aparte porque el dashboard real lo separa
  // asi, no porque sea un calculo distinto.
  const stabilityRows = filasHoy
    .filter((f) => f.baselineGlobal)
    .map((f) => ({ name: shortNameHist(f.endpoint), ratio: f.p95 / f.baselineGlobal }))
    .sort((a, b) => b.ratio - a.ratio)
    .slice(0, 10)
    .map((r) => ({
      name: r.name,
      ratioLabel: r.ratio.toFixed(2) + 'x',
      widthPct: Math.min(100, (r.ratio / 5) * 100),
      colorVar: r.ratio <= 1.5 ? colorVar('ok') : r.ratio <= 3 ? colorVar('warn') : r.ratio <= 5 ? 'var(--accent)' : colorVar('fail'),
    }));

  // ---- Distribucion historica / patron (CV), MISMA formula que extract-for-ai.js ----
  // Sobre TODOS los 45 endpoints (antes 9), ordenados por CV descendente - con esta escala hace
  // falta el filtro Top-10/Todos que pidio Carlos, igual criterio que "Top 10 (peor p95)" ya
  // usado en la seccion "Por endpoint".
  const patronAll = RAW_NAMES.map((ep) => {
    const valores = conBaseline.filter((f) => f.endpoint === ep && !f.escenario).map((f) => f.p95);
    const mean = mediaHist(valores);
    const variance = mediaHist(valores.map((v) => Math.pow(v - mean, 2)));
    const stddev = Math.sqrt(variance);
    const cv = mean > 0 ? stddev / mean : 0;
    const outlierCount = valores.filter((v) => v > mean * 3).length;
    const outlierPct = outlierCount / valores.length;
    let patronLabel, colorVar_;
    if (outlierPct >= 0.3) { patronLabel = 'BIMODAL'; colorVar_ = colorVar('fail'); }
    else if (outlierPct >= 0.1 || (outlierCount >= 3 && cv > 0.5)) { patronLabel = 'EPISÓDICO'; colorVar_ = colorVar('warn'); }
    else if (cv < 0.25) { patronLabel = 'CONSISTENTE'; colorVar_ = colorVar('ok'); }
    else { patronLabel = 'VARIABLE'; colorVar_ = 'var(--accent2)'; }
    // El badge de caché fría de la historia sale del frío MEDIDO (preflight) de la última corrida,
    // no de suponer por el tipo de endpoint.
    const cacheFriaHint = !!(GS32.endpoints.find((x) => x.slug === ep) || {}).frioMuyLento;
    return {
      name: shortNameHist(ep),
      resource: resourceOf(ep),
      cvRaw: cv,
      patronLabel,
      colorVar: colorVar_,
      bgVar: 'color-mix(in oklch, ' + colorVar_ + ' 16%, transparent)',
      corridas: valores.length,
      mediaLabel: msLabel(mean),
      cvLabel: cv.toFixed(2),
      cacheFriaHint,
      ...tendenciaDe(ep),
    };
  }).sort((a, b) => b.cvRaw - a.cvRaw);
  const patronRows = patronMode === 'all' ? patronAll : patronAll.slice(0, PATRON_TOP_N);

  const escenariosCount = runs.length - runsNormales.length;

  return {
    corridasCountLabel: runsNormales.length + ' corridas + ' + escenariosCount + ' de escenario',
    notaDatos: runsNormales.length + ' corridas reales de metrics/gs32/ con la clave de esta corrida (' + HIST.claveLabel + '). baseline_global y baseline_version salen de scripts/gs32/api-baseline-core.mjs, el mismo motor que usa el informe del smoke.' + (escenariosCount ? ' Incluye ' + escenariosCount + ' corridas de escenario, aisladas del baseline normal.' : ''),
    endpointsClaveCountLabel: String(RAW_NAMES.length),
    scorecard: {
      versionActual: HISTORICO_VERSION_ACTUAL,
      versionAnterior: HISTORICO_VERSION_ANTERIOR || "sin versión anterior",
      runsActual: new Set(conBaseline.filter((f) => f.version === HISTORICO_VERSION_ACTUAL && !f.escenario).map((f) => f.timestamp)).size,
      verdictLabel: sc.verdict.label,
      verdictEmoji: sc.verdict.emoji,
      verdictColorVar: sc.verdict.colorVar,
      verdictBgVar: verdictBgVarOf(sc.verdict.colorVar),
      globalDeltaLabel: deltaLabel(sc.globalDeltaPct),
      resolvedCount: sc.resolved.length,
      newCount: sc.news.length,
      hasResolved: sc.resolved.length > 0,
      hasNew: sc.news.length > 0,
      resolvedList: sc.resolved,
      newList: sc.news,
    },
    trend: {
      // El armado final (heightPct/hover/leyenda) lo hace renderVals(), que tiene el estado de
      // hover - acá solo viaja el dato ya recortado a las ultimas 10.
      runAverages,
      baselinePromedio,
      totalRunsCount: runsNormales.length,
    },
    versions: {
      count: versionesRecientes.length,
      totalCount: HISTORICO_VERSIONS.length,
      rows: versionRows,
    },
    semaforo: {
      rows: semaforoRows,
      hasRows: semaforoRows.length > 0,
      isEmpty: semaforoRows.length === 0,
      countLabel: semaforoRows.length + ' con alerta',
    },
    stability: {
      rows: stabilityRows,
      hasRows: stabilityRows.length > 0,
    },
    patron: {
      rows: patronRows,
      totalCount: patronAll.length,
      shownCount: patronRows.length,
    },
  };
}

// ---- Hallazgos / riesgos / salvedades: TODOS calculados de los datos de esta corrida. El mockup
// tenía estas listas escritas a mano para la historia sintética; acá cada ítem tiene una regla y
// solo aparece si la regla se cumple.
// Tope de nombres en un texto (2026-10-08): con 50+ endpoints, una enumeración completa es ilegible.
// Nombra hasta 5 y dice cuántos más hay; el detalle completo está en el mapa / tabla de endpoints.
function topeLista(xs, fn) {
  return xs.slice(0, 5).map(fn).join(", ") + (xs.length > 5 ? " y " + (xs.length - 5) + " más" : "");
}

function construirInsights(decorated, raw, ov) {
  const hallazgo = [], riesgo = [], confound = [];
  const n = decorated.length;
  const alTps = decorated.filter((e) => e.throughputRaw / raw.find((r) => r.name === e.name).tps >= 0.95);
  hallazgo.push({ text: alTps.length + " de " + n + " endpoints sostuvieron al menos el 95% de su tasa objetivo." + (alTps.length < n ? " No llegaron: " + topeLista(decorated.filter((e) => alTps.indexOf(e) === -1), (e) => e.shortName) + "." : "") });
  const conLim = raw.filter((e) => e.limite).map((e) => ({ e, uso: e.p95 / e.limite })).sort((a, b) => b.uso - a.uso);
  if (conLim.length) {
    const t = conLim[0];
    hallazgo.push({ text: "El más cerca de su límite es " + t.e.name + ": p95 " + msLabel(t.e.p95) + " sobre " + msLabel(t.e.limite) + " (" + Math.round(t.uso * 100) + "%)." + (conLim[1] ? " Le sigue " + methodOf(conLim[1].e.name) + " con " + Math.round(conLim[1].uso * 100) + "%." : "") });
  }
  const picos = decorated.filter((e) => e.patternLabel === "EPISÓDICO");
  if (picos.length) hallazgo.push({ text: picos.length + " endpoint" + (picos.length === 1 ? "" : "s") + " con un máximo de más del doble de su p95: " + topeLista(picos, (e) => e.shortName + " (" + e.maxLabel + " contra " + e.p95Label + ")") + "." });
  const ter = Math.floor(ov.p99.length / 3);
  if (ter >= 2) {
    const med = (a) => a.reduce((x, y) => x + y, 0) / a.length;
    const a99 = med(ov.p99.slice(1, ter)), b99 = med(ov.p99.slice(-ter)), a95 = med(ov.p95.slice(1, ter)), b95 = med(ov.p95.slice(-ter));
    const d99 = ((b99 - a99) / a99) * 100, d95 = ((b95 - a95) / a95) * 100;
    if (Math.abs(d99) >= 20) hallazgo.push({ text: "La cola agregada " + (d99 > 0 ? "sube" : "baja") + " a lo largo de la corrida: el p99 por request pasa de " + msLabel(a99) + " a " + msLabel(b99) + " (" + deltaLabel(d99) + ") entre el primer y el último tercio, con el p95 en " + deltaLabel(d95) + ". Es una serie agregada: no dice qué endpoint la mueve." });
  }
  const conFases = decorated.filter((e) => e.phaseWaitPct != null);
  const noEspera = conFases.filter((e) => e.phaseWaitPct < 80);
  if (conFases.length && !noEspera.length) hallazgo.push({ text: "En los " + conFases.length + " endpoints la espera del servidor es más del 80% de las fases HTTP: el tiempo es del backend, no de la red ni de la descarga." });
  else if (noEspera.length) hallazgo.push({ text: noEspera.length + " endpoint" + (noEspera.length === 1 ? "" : "s") + " con red o descarga por encima del 20% de sus fases HTTP: " + topeLista(noEspera, (e) => e.shortName + " (espera " + e.phaseWaitPct + "%)") + "." });

  decorated.filter((e) => e.isFail).forEach((e) => riesgo.push({ text: e.name + " tuvo " + e.errorLabel + " de requests con error" + e.errorTypeLabel + "." }));
  decorated.filter((e) => e.isWarn).forEach((e) => riesgo.push({ text: e.name + " descartó " + e.droppedLabel + " iteraciones: k6 no tuvo VUs libres para sostener la tasa." }));
  conLim.filter((x) => x.uso >= 0.8).forEach((x) => riesgo.push({ text: x.e.name + " usa el " + Math.round(x.uso * 100) + "% de su límite de p95." }));
  raw.filter((e) => e.frioMuyLento).forEach((e) => riesgo.push({ text: e.name + ": la primera pegada (en frío) tardó " + msLabel(e.frio.p50) + ", más de 5 veces su p95 en caliente (" + msLabel(e.p95) + ")" + (e.frio.n === 1 ? ", sobre 1 sola muestra." : ".") }));

  GS32.salvedades.forEach((t) => confound.push({ text: t }));
  const pocas = raw.filter((e) => e.iterations < 100);
  if (pocas.length) confound.push({ text: "Con menos de 100 iteraciones el p95 es poco robusto: " + topeLista(pocas, (e) => methodOf(e.name) + " (" + e.iterations + ")") + "." });
  return { hallazgo, riesgo, confound };
}

function notaLatencia(ov) {
  const n = ov.p95.length;
  if (n < 3) return "Corrida demasiado corta para describir la forma de la serie.";
  const resto = ov.p95.slice(1);
  const medResto = resto.reduce((a, b) => a + b, 0) / resto.length;
  const primero = ov.p95[0];
  return "Serie agregada de todos los endpoints, por request HTTP (no por iteración). Primer tramo p95 " + msLabel(primero) +
    (primero > medResto * 1.3 ? ", más lento que el resto (" + msLabel(medResto) + " de promedio): el arranque." : ", en línea con el resto (" + msLabel(medResto) + " de promedio).") +
    " El p99 es el que calcula k6 por tramo, sobre muestras reales.";
}

function notaTransfer(decorated) {
  const con = decorated.filter((e) => e.receivedKB != null).sort((a, b) => b.receivedKB * b.iterations - a.receivedKB * a.iterations);
  if (!con.length) return "Bytes agregados de todos los endpoints. El detalle por endpoint necesita samples.csv.gz.";
  const tot = con.reduce((a, e) => a + e.receivedKB * e.iterations, 0) || 1;
  return "Más volumen recibido: " + con.slice(0, 3).map((e) => e.shortName + " (" + Math.round((e.receivedKB * e.iterations / tot) * 100) + "%)").join(", ") + ".";
}

// ============================================================================
// POP-UPS (Carlos, 2026-10-08): reemplazan al title="" nativo. Al pasar el mouse (o con el foco
// del teclado) aparece una ETIQUETA COMPACTA; con clic (o Enter) se FIJA una TARJETA con contexto,

// pop-up adentro se borraría con cada hover. Contenido: data-tip='{json}' (lo arma renderVals) o
// data-tip-texto="..." (ayudas fijas, los "?").

//     porque: explicación (solo en la tarjeta), pie: pista (solo en la tarjeta) }
// ============================================================================
(function () {
  if (typeof window === "undefined" || typeof document === "undefined" || !document.body || window.__gs32Tips) return;
  window.__gs32Tips = true;
  const capa = document.createElement("div");

  capa.setAttribute("role", "tooltip");

  const SEL = "[data-tip],[data-tip-texto]";
  const escHtml = (v) => String(v == null ? "" : v).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const leer = (el) => {
    if (el.getAttribute("data-tip")) { try { return JSON.parse(el.getAttribute("data-tip")); } catch (e) { return null; } }
    if (el.getAttribute("data-tip-texto")) return { t: el.getAttribute("data-tip-titulo") || null, txt: el.getAttribute("data-tip-texto") };
    return null;
  };
  const dot = (c) => (c ? '<span class="tip-dot" style="background:' + escHtml(c) + '"></span>' : '<span class="tip-dot"></span>');
  const filasHtml = (d) => (d.filas || []).map((f) => '<span class="tip-fila">' + dot(f[2]) + '<span class="tip-et">' + escHtml(f[0]) + '</span><span class="tip-val">' + escHtml(f[1]) + "</span></span>").join("");
  const compacta = (d) =>
    (d.s ? '<span class="tip-eyebrow">' + escHtml(d.s) + "</span>" : "") +
    (d.t ? '<span class="tip-titulo">' + escHtml(d.t) + "</span>" : "") +
    (d.txt ? '<span class="tip-txt">' + escHtml(d.txt) + "</span>" : "") +
    filasHtml(d) +
    (d.chip ? '<span class="tip-chip" style="background:' + escHtml(d.chip[1]) + '">' + escHtml(d.chip[0]) + "</span>" : "");
  const tarjeta = (d) =>
    '<span class="tip-cab"><span class="tip-cab-txt">' + (d.s ? '<span class="tip-eyebrow">' + escHtml(d.s) + "</span>" : "") +
    (d.t ? '<span class="tip-titulo">' + escHtml(d.t) + "</span>" : "") + "</span>" +
    (d.chip ? '<span class="tip-pill" style="color:' + escHtml(d.chip[1]) + ";border-color:" + escHtml(d.chip[1]) + '">' + escHtml(d.chip[0]) + "</span>" : "") +
    '<button type="button" class="tip-cerrar" aria-label="Cerrar">×</button></span>' +
    (d.g ? '<span class="tip-grande"><span class="tip-grande-v" style="' + (d.g[2] ? "color:" + escHtml(d.g[2]) : "") + '">' + escHtml(d.g[0]) + '</span><span class="tip-grande-l">' + escHtml(d.g[1] || "") + "</span></span>" : "") +
    (d.barra ? '<span class="tip-barra"><span class="tip-barra-v" style="width:' + Math.max(1, Math.min(100, d.barra.pct)) + "%;background:" + escHtml(d.barra.color) + '"></span>' + (d.barra.lim != null ? '<span class="tip-barra-lim" style="left:' + Math.min(100, d.barra.lim) + '%"></span>' : "") + "</span>" : "") +
    (d.txt ? '<span class="tip-txt">' + escHtml(d.txt) + "</span>" : "") +
    (d.filas && d.filas.length ? '<span class="tip-grid">' + d.filas.map((f) => '<span class="tip-dato"><span class="tip-et">' + escHtml(f[0]) + '</span><span class="tip-val">' + escHtml(f[1]) + "</span></span>").join("") + "</span>" : "") +
    (d.porque ? '<span class="tip-porque">' + escHtml(d.porque) + "</span>" : "") +
    '<span class="tip-pie">' + escHtml(d.pie || "Esc o clic afuera para cerrar") + "</span>";
  const ubicar = (el) => {
    const r = el.getBoundingClientRect();
    const w = capa.offsetWidth, h = capa.offsetHeight;
    let left = r.left + r.width / 2 - w / 2;
    left = Math.max(8, Math.min(left, document.documentElement.clientWidth - w - 8));
    let top = r.top - h - 10;
    capa.classList.toggle("abajo", top < 8);
    if (top < 8) top = r.bottom + 10;
    capa.style.left = left + window.scrollX + "px";
    capa.style.top = top + window.scrollY + "px";
  };
  const mostrar = (el, fijar) => {
    const d = leer(el);
    if (!d) return;
    const informe = document.querySelector(".gs32-report");
    capa.setAttribute("data-theme", informe ? informe.getAttribute("data-theme") : "light");
    capa.className = "tip-capa " + (fijar ? "tip-tarjeta" : "tip-compacta");
    capa.innerHTML = fijar ? tarjeta(d) : compacta(d);
    capa.hidden = false;
    ubicar(el);
    fijado = !!fijar;
    actual = el;
    if (fijar) { const b = capa.querySelector(".tip-cerrar"); if (b) b.addEventListener("click", ocultar); }
  };
  function ocultar() { capa.hidden = true; fijado = false; actual = null; }
  document.addEventListener("mouseover", (ev) => {
    if (fijado) return;
    const el = ev.target.closest ? ev.target.closest(SEL) : null;
    if (el) { if (el !== actual) mostrar(el, false); }
    else if (!capa.contains(ev.target)) ocultar();
  });
  document.addEventListener("focusin", (ev) => { if (fijado) return; const el = ev.target.closest ? ev.target.closest(SEL) : null; if (el) mostrar(el, false); });
  document.addEventListener("focusout", () => { if (!fijado) ocultar(); });
  const fijable = (el) => el.getAttribute("data-tip-modo") !== "hover";
  document.addEventListener("click", (ev) => {
    if (capa.contains(ev.target)) return;
    const el = ev.target.closest ? ev.target.closest(SEL) : null;
    if (el && fijable(el)) { mostrar(el, true); return; }
    if (fijado) ocultar();
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { ocultar(); return; }
    if (ev.key === "Enter" || ev.key === " ") {
      const el = document.activeElement && document.activeElement.closest ? document.activeElement.closest(SEL) : null;
      if (el && fijable(el) && !/^(BUTTON|A|INPUT)$/.test(el.tagName)) { ev.preventDefault(); mostrar(el, true); }
    }
  });
  window.addEventListener("resize", () => { if (!fijado) ocultar(); });
})();

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      viewMode: "top10",
      selectedNames: [],
      selectedResources: [],
      inspectedEndpoint: null,
      showFilterPanel: false,
      expandHallazgo: false,
      expandRiesgo: false,
      expandConfound: false,
      hover: { chart: null, index: null },
      // Comparativa entre corridas y versiones (2026-09-18, ampliada):
      patronMode: "top10",
      // null = el endpoint de peor p95 de esta corrida (ver renderVals).
      inspectorResource: null,
      inspectorEndpoint: null,
      // Escenarios (2026-09-18, réplica más completa de pepper-API-testing):
      escenarioSeleccionado: null, // null = el primero del catalogo (ver renderVals)
      escenarioComparar: null,
      escenarioTablaMode: "top10",
      escenarioDegExpand: false,
      escenarioMejExpand: false,
      // Vista técnica (por defecto) o ejecutiva (Carlos, 2026-10-08). #ejecutiva en la URL abre
      // directo la ejecutiva, para mandarle el link a alguien no técnico.
      vista: (typeof location !== "undefined" && location.hash === "#ejecutiva") ? "ejecutiva" : "tecnica",
      // Modo claro/oscuro elegido en la página (Carlos, 2026-10-08). null = el del sistema
      // (props.darkMode). Se recuerda en ESTE navegador; sin almacenamiento disponible, igual anda.
      tema: (() => { try { const t = localStorage.getItem("gs32-informe-tema"); return t === "dark" || t === "light" ? t : null; } catch (e) { return null; } })(),
      tab: "ahora",
      mapaOrden: "peor",
      mapaFiltro: "todos",
      // Buscador del mapa / tabla de endpoints (2026-10-08).
      busqueda: "",
      mapaVista: "mapa",
      tablaCol: "peor",
      tablaDir: "desc",
    };
  }

  renderVals() {
    const dark = this.state && this.state.tema ? this.state.tema === "dark" : (this.props.darkMode ?? false);
    const cambiarTema = () => {
      const nuevo = dark ? "light" : "dark";
      try { localStorage.setItem("gs32-informe-tema", nuevo); } catch (e) { /* sin almacenamiento: vale solo para esta vista */ }
      this.setState({ tema: nuevo });
    };
    const theme = dark ? "dark" : "light";
    const state = this.state || {};
    const viewMode = state.viewMode || "top10";
    const selectedNames = state.selectedNames || [];
    const selectedResources = state.selectedResources || [];
    const hover = state.hover || { chart: null, index: null };

    const enterHover = (chartKey, i) => () => this.setState({ hover: { chart: chartKey, index: i } });
    const clearHover = () => this.setState({ hover: { chart: null, index: null } });
    const inspect = (name) => () => this.setState({ inspectedEndpoint: name });
    // Cambiar de API resetea la seleccion fina de endpoints: si no, un endpoint elegido bajo
    // "bonds" seguiria filtrando la grilla despues de pasar a "currencies", sin aparecer ya
    // en los chips visibles - una seleccion invisible e inconsistente con lo que se ve.
    const toggleResource = (name) => () => {
      const set = new Set(this.state.selectedResources || []);
      if (set.has(name)) set.delete(name);
      else set.add(name);
      this.setState({ selectedResources: Array.from(set), selectedNames: [] });
    };

    const raw = buildRawDataset();

    const decorated = raw.map((e) => {
      const achieved = Math.min(100, Math.round((e.throughput / e.tps) * 100));
      const spikeRatio = e.max / e.p95;
      const spikeLevel = spikeRatio >= 2 ? "fail" : spikeRatio >= 1.4 ? "warn" : "ok";
      const ringLevel = achieved >= 95 ? "ok" : achieved >= 80 ? "warn" : "fail";
      const hasFail = e.errorRate > 0;
      const hasWarn = e.dropped > 0;
      const status = hasFail ? "fail" : hasWarn ? "warn" : "pass";
      const p50Pct = Math.max(2, Math.round((e.p50 / e.max) * 100));
      const p95Pct = Math.max(4, Math.round((e.p95 / e.max) * 100));
      const p99Pct = e.p99 == null ? p95Pct : Math.max(5, Math.round((e.p99 / e.max) * 100));
      const circumference = 100.5;
      const tipoDesc = e.tier === "calc" ? "Cálculo" : e.tier === "catalog" ? "Catálogo" : "Detalle";
      const shortDesc = tipoDesc + (e.reqPorIter != null ? " · " + e.reqPorIter.toFixed(1).replace(".", ",") + " requests por iteración" : "") + (e.dataset ? " · pool " + e.dataset : " · UUID fijo");

      // Patrón de variabilidad: mismo corte que spikeLevel (arriba), solo con el nombre que ya
      // usa pepper-API-testing en su tabla "Distribución Histórica de P95" (CONSISTENTE/VARIABLE/
      // EPISÓDICO) en vez de un color sin etiquetar - no agrega cómputo nuevo, nombra el que ya
      // existía.
      const patternLabel = spikeLevel === "fail" ? "EPISÓDICO" : spikeLevel === "warn" ? "VARIABLE" : "CONSISTENTE";

      // Caché fría: el frío MEDIDO (primera pegada del preflight) más de 5 veces el p95 en
      // caliente, mismo corte que el informe del smoke. Es una hipótesis: puede ser 1 sola muestra.
      const cacheFriaHint = !!e.frioMuyLento;

      // Apdex: de las muestras de samples.csv.gz, con T y F universales (GS32.apdex).
      const apdexScore = e.apdex;
      const apdexTitle = "Satisfecha ≤ " + GS32.apdex.tMs + " ms, tolerable ≤ " + GS32.apdex.fMs + " ms, frustrada si tarda más o falló (iguales para todos los endpoints)";
      const apdexBandInfo = apdexScore == null ? { label: "s/d", varName: "var(--text-faint)" } : apdexBand(apdexScore);

      const hayFases = e.networkMs != null && e.waitingMs != null && e.receivingMs != null;
      const phaseTotal = hayFases ? (e.networkMs + e.waitingMs + e.receivingMs) || 1 : 1;
      const phaseNetPct = hayFases ? Math.round((e.networkMs / phaseTotal) * 100) : 0;
      const phaseWaitPct = hayFases ? Math.round((e.waitingMs / phaseTotal) * 100) : null;
      const phaseRecvPct = hayFases ? Math.max(0, 100 - phaseNetPct - phaseWaitPct) : 0;

      // Latencia por KB: MISMA formula y umbrales que el panel real "Latency Per KB" del
      // dashboard de Grafana de pepper-API-testing (verificado contra generate-metrics.js linea
      // 407: latencyPerKb = avgLatencyMs / (avgSizeBytes/1024) - acá "avg" es e.p50, la lectura
      // mas fiel a "promedio" que tenemos sin una distribucion completa de muestras).
      const latencyPerKB = e.receivedKB ? e.p50 / e.receivedKB : null;
      const latencyPerKBBandInfo = latencyPerKB == null ? { label: "s/d", colorVar: "var(--text-faint)" } : latencyPerKBBand(latencyPerKB);

      // Resource Impact Ranking: MISMA formula que el panel real homonimo (generate-metrics.js
      // linea 456-458: impact_score = baseline_p95 x total_ejecuciones). Acá con datos de una sola
      // corrida: p95 x iteraciones - "cuanto tiempo de servidor consumio este endpoint en total",
      // no solo cuanto tarda una vez. Un endpoint mediano pero muy frecuente puede pesar mas que
      // uno lento pero raro.
      const impactScore = Math.round(e.p95 * e.iterations);

      return {
        name: e.name,
        shortName: methodOf(e.name),
        resource: resourceOf(e.name),
        desc: shortDesc,
        p95Raw: e.p95,
        isPass: status === "pass",
        isWarn: status === "warn",
        isFail: status === "fail",
        tpsLabel: e.tps.toFixed(1) + " TPS",
        throughputLabel: e.throughput.toFixed(2) + " it/s",
        achievedLabel: achieved + "%",
        ringOffset: Math.round(circumference * (1 - achieved / 100) * 100) / 100,
        ringColorVar: colorVar(ringLevel),
        p50Pct,
        p95Pct,
        p99Pct,
        p50Label: msLabel(e.p50),
        p95Label: msLabel(e.p95),
        p99Label: msLabel(e.p99),
        maxLabel: msLabel(e.max),
        spikeColorVar: colorVar(spikeLevel),
        patternLabel,
        tier: e.tier,
        cacheFriaHint,
        errorLabel: e.errorRate.toFixed(2) + "%",
        errClass: e.errorRate > 0 ? "err-bad" : "err-ok",
        errorTypeLabel: e.errorType ? " · " + e.errorType : "",
        droppedLabel: e.dropped + " / " + e.iterations,
        iterations: e.iterations,
        throughputRaw: e.throughput,
        status,
        apdexScore,
        apdexLabel: apdexScore == null ? "s/d" : apdexScore.toFixed(2),
        apdexTitle,
        apdexColorVar: apdexBandInfo.varName,
        networkLabel: e.networkMs == null ? "s/d" : Math.round(e.networkMs) + "ms",
        waitingLabel: e.waitingMs == null ? "s/d" : Math.round(e.waitingMs) + "ms",
        receivingLabel: e.receivingMs == null ? "s/d" : Math.round(e.receivingMs) + "ms",
        phaseNetPct,
        phaseWaitPct,
        phaseRecvPct,
        receivedKB: e.receivedKB,
        sentKB: e.sentKB,
        receivedKBLabel: e.receivedKB == null ? "s/d" : e.receivedKB.toFixed(2) + " KB",
        sentKBLabel: e.sentKB == null ? "s/d" : e.sentKB.toFixed(2) + " KB",
        latencyPerKB,
        latencyPerKBLabel: latencyPerKB == null ? "s/d" : Math.round(latencyPerKB).toLocaleString("es-AR"),
        latencyPerKBBandLabel: latencyPerKBBandInfo.label,
        latencyPerKBColorVar: latencyPerKBBandInfo.colorVar,
        impactScore,
        impactScoreLabel: impactScore.toLocaleString("es-AR"),
        usoLimiteLabel: e.limite ? Math.round((e.p95 / e.limite) * 100) + "% de su límite de " + msLabel(e.limite) : "",
        // Crudos para la vista ejecutiva y el mapa de calor (2026-10-08).
        limite: e.limite || null,
        errorRateRaw: e.errorRate,
      };
    });

    // Buscador (2026-10-08): por endpoint o por API, sin distinguir mayúsculas. "bonds" trae todos
    // los de bonds. El mismo texto filtra el mapa y esta pestaña. El runtime redibuja todo en cada
    // tecla, así que el handler le devuelve el foco y el cursor al campo después de pintar.
    const busqueda = (state.busqueda || "").trim().toLowerCase();
    const coincide = (name) => !busqueda || name.toLowerCase().indexOf(busqueda) !== -1;
    const alBuscar = (ev) => {
      const el = ev && ev.target;
      const valor = el ? el.value : "";
      const id = el ? el.id : null;
      const pos = el && el.selectionStart != null ? el.selectionStart : valor.length;
      this.setState({ busqueda: valor });
      if (id && typeof document !== "undefined") {
        const nuevo = document.getElementById(id);
        if (nuevo) { nuevo.focus(); try { nuevo.setSelectionRange(pos, pos); } catch (e) { /* tipos sin cursor */ } }
      }
    };
    const limpiarBusqueda = () => this.setState({ busqueda: "" });
    const poolTodos = decorated.slice().sort((a, b) => b.p95Raw - a.p95Raw);
    const pool = poolTodos.filter((e) => coincide(e.name));

    // ---- Payload y eficiencia de transferencia (2026-09-18, adaptado de 3 paneles reales del
    // dashboard de Grafana de pepper-API-testing: "Top 5 Heaviest Payloads", "Latency Per KB" y
    // "Resource Impact Ranking" - formulas y umbrales verificados contra generate-metrics.js) ----
    const conPayload = decorated.filter((e) => e.receivedKB != null);
    const maxKBForBar = Math.max.apply(null, conPayload.map((e) => e.receivedKB)) || 1;
    const heaviestPayloads = conPayload
      .slice()
      .sort((a, b) => b.receivedKB - a.receivedKB)
      .slice(0, 10)
      .map((e) => ({ name: e.shortName, resource: e.resource, kbLabel: e.receivedKBLabel, widthPct: (e.receivedKB / maxKBForBar) * 100 }));

    const latencyPerKBTop = conPayload
      .slice()
      .sort((a, b) => b.latencyPerKB - a.latencyPerKB)
      .slice(0, 10)
      .map((e) => ({ name: e.shortName, resource: e.resource, p50Label: e.p50Label, receivedKBLabel: e.receivedKBLabel, ratioLabel: e.latencyPerKBLabel, bandLabel: e.latencyPerKBBandLabel, colorVar: e.latencyPerKBColorVar }));

    // impactTop (Resource Impact Ranking) se calcula MAS ABAJO, con el acumulado HISTORICO de
    // iteraciones (no solo esta corrida) - ver la seccion de comparativa entre corridas/versiones,
    // donde ya esta disponible histConBaseline. Carlos lo pidio historico despues de revisar la
    // v20: "que le costo mas tiempo de servidor en TODO lo que llevamos midiendo" es una pregunta
    // mas valiosa que "que peso mas en esta corrida puntual".

    // ---- Cuello de botella (Resumen Ejecutivo): top endpoints de ESTA corrida, con el motivo
    // generado por motivoCuelloDeBotella(). Orden: fail primero, warn despues, el resto por p95 -
    // mismo criterio de severidad que ya usa el veredicto de la tarjeta de cada endpoint.
    const bottlenecks = decorated
      .slice()
      .sort((a, b) => {
        const sevA = a.isFail ? 3 : a.isWarn ? 2 : 1;
        const sevB = b.isFail ? 3 : b.isWarn ? 2 : 1;
        if (sevA !== sevB) return sevB - sevA;
        return b.p95Raw - a.p95Raw;
      })
      .slice(0, 8)
      .map((ep) => ({
        name: ep.shortName,
        resource: ep.resource,
        p95Label: ep.p95Label,
        status: ep.status,
        statusColorVar: colorVar(ep.status === "fail" ? "fail" : ep.status === "warn" ? "warn" : "ok"),
        motivo: motivoCuelloDeBotella(ep),
        // Motivo real (no solo "es de los más lentos"): lo usa la vista ejecutiva, "Dónde duele".
        esReal: !!(ep.errorTypeLabel || ep.isFail || ep.patternLabel === "EPISÓDICO" || ep.isWarn || (ep.apdexScore != null && ep.apdexScore < 0.85)),
      }));

    const hasNameSelection = selectedNames.length > 0;
    const hasResourceSelection = selectedResources.length > 0;

    let visibleBase;
    let modeNote;
    if (hasNameSelection) {
      visibleBase = pool.filter((e) => selectedNames.indexOf(e.name) !== -1);
      modeNote = "Mostrando " + visibleBase.length + " endpoint(s) seleccionados de " + pool.length + ".";
    } else if (hasResourceSelection) {
      visibleBase = pool.filter((e) => selectedResources.indexOf(e.resource) !== -1);
      modeNote = "Mostrando " + visibleBase.length + " endpoint(s) de la(s) API(s): " + selectedResources.join(", ") + ".";
    } else if (viewMode === "all") {
      visibleBase = pool;
      modeNote = "Mostrando los " + pool.length + " endpoints, ordenados por p95 (peor primero).";
    } else if (viewMode === "warn") {
      visibleBase = pool.filter((e) => e.status === "warn");
      modeNote = "Mostrando " + visibleBase.length + " endpoint(s) en WARN (dropped iterations, sin llegar a error rate), de " + pool.length + " totales.";
    } else if (viewMode === "fail") {
      visibleBase = pool.filter((e) => e.status === "fail");
      modeNote = "Mostrando " + visibleBase.length + " endpoint(s) en FAIL (con error rate > 0), de " + pool.length + " totales.";
    } else {
      visibleBase = pool.slice(0, 10);
      modeNote = "Mostrando los 10 con peor p95, de " + pool.length + " endpoints totales.";
    }
    if (busqueda) modeNote = "Búsqueda \u201c" + (state.busqueda || "").trim() + "\u201d: " + pool.length + " de " + poolTodos.length + " endpoints. " + modeNote;
    const showRank = !hasNameSelection && !hasResourceSelection;

    // Endpoint inspeccionado en el panel de tendencia: el que se clickeo, o si todavia no se
    // clickeo nada, el primero de la lista visible - asi el panel nunca queda vacio.
    // Sin elección, el "peor": FAIL, después WARN, después el que más usa de su límite (o el de
    // peor p95 si no tiene límite). Es el mismo que abre la ficha del mapa (2026-10-08).
    const severidadRaw = (e) => (e.errorRate > 0 ? 3 : e.dropped > 0 ? 2 : 1);
    const usoRaw = (e) => (e.limite ? e.p95 / e.limite : 0);
    const peorRaw = raw.slice().sort((a, b) => severidadRaw(b) - severidadRaw(a) || usoRaw(b) - usoRaw(a) || b.p95 - a.p95)[0];
    const inspectedName = (state.inspectedEndpoint && raw.some((e) => e.name === state.inspectedEndpoint))
      ? state.inspectedEndpoint
      : peorRaw.name;

    const visibleEndpoints = visibleBase.map((e, idx) => ({
      ...e,
      rank: idx + 1,
      showRank,
      isInspecting: e.name === inspectedName,
      inspectingClass: e.name === inspectedName ? "inspecting" : "",
      pick: inspect(e.name),
    }));

    // Chips de endpoint: solo los de la(s) API(s) elegida(s) - nunca los 45 juntos, para que
    // elegir una API (ej. "bonds") de verdad achique la lista en vez de solo agregar una
    // pestaña mas arriba de la misma lista larga.
    const chipsSource = hasResourceSelection
      ? decorated.filter((e) => selectedResources.indexOf(e.resource) !== -1)
      : [];
    const chips = chipsSource.map((e) => {
      const selected = selectedNames.indexOf(e.name) !== -1;
      return {
        name: e.shortName,
        extraClass: selected ? "selected" : "",
        toggle: () => {
          const set = new Set(this.state.selectedNames || []);
          if (set.has(e.name)) set.delete(e.name);
          else set.add(e.name);
          this.setState({ selectedNames: Array.from(set) });
        },
      };
    });

    const resourceChips = RESOURCES.map((res) => {
      const count = raw.filter((e) => e.name.indexOf(res + "/") === 0).length;
      const selected = selectedResources.indexOf(res) !== -1;
      return {
        label: res + " (" + count + ")",
        extraClass: selected ? "selected" : "",
        toggle: toggleResource(res),
      };
    });

    const totalIterations = decorated.reduce((a, e) => a + e.iterations, 0);
    const totalThroughput = decorated.reduce((a, e) => a + e.throughputRaw, 0);
    const passCount = decorated.filter((e) => e.status === "pass").length;
    const warnCount = decorated.filter((e) => e.status === "warn").length;
    const failCount = decorated.filter((e) => e.status === "fail").length;

    // Apdex agregado: promedio simple de los Apdex por endpoint (no ponderado por throughput -
    // un promedio ponderado le daría más peso a los catálogos de alto TPS y taparía justo los
    // endpoints de cálculo, que son los que más conviene que se vean en un resumen ejecutivo).
    const conApdex = decorated.filter((e) => e.apdexScore != null);
    const apdexAgg = conApdex.length ? conApdex.reduce((a, e) => a + e.apdexScore, 0) / conApdex.length : null;
    const apdexAggBand = apdexAgg == null ? { label: "sin muestras (falta samples.csv.gz)", varName: "var(--text-faint)" } : apdexBand(apdexAgg);

    const insightsAll = construirInsights(decorated, raw, buildOverviewSeries());

    const DEFAULT_VISIBLE = 2;
    const hallazgoExpand = !!state.expandHallazgo;
    const riesgoExpand = !!state.expandRiesgo;
    const confoundExpand = !!state.expandConfound;

    const hasSelection = hasNameSelection || hasResourceSelection;
    const selectedCountLabel = hasNameSelection
      ? String(selectedNames.length)
      : hasResourceSelection
        ? selectedResources.length + " API" + (selectedResources.length === 1 ? "" : "s")
        : "0";

    // ============================================================================
    // Panel general: series de la corrida completa, con hover -> crosshair + legend
    // ============================================================================
    const ov = buildOverviewSeries();
    const N_OV = OVERVIEW_POINTS;

    // -- VUs (con techo del profile, para ver saturación del lado cliente) --
    const gVus = chartGeomWithCeiling(ov.vus, OVERVIEW_VUS_CEILING, 300, 84, 8, 8);
    const hoverVus = hover.chart === "vus";
    const idxVus = hoverVus ? hover.index : N_OV - 1;
    const avgVus = Math.round(ov.vus.reduce((a, b) => a + b, 0) / N_OV);
    const peakVus = Math.max.apply(null, ov.vus);
    const ceilingPct = Math.round((peakVus / OVERVIEW_VUS_CEILING) * 100);
    const overviewVus = {
      points: gVus.points,
      areaPoints: gVus.areaPoints,
      ceilingY: gVus.yFor(OVERVIEW_VUS_CEILING),
      ceilingLabel: OVERVIEW_VUS_CEILING + " VUs (pico usado: " + ceilingPct + "%)",
      headline: avgVus + " VUs (prom.)",
      bands: buildBands(N_OV, 300, 84, "vus", enterHover),
      hoverActive: hoverVus,
      hoverX: hoverVus ? xAt(idxVus, N_OV, 300).toFixed(1) : null,
      hoverY: hoverVus ? gVus.pts[idxVus][1].toFixed(1) : null,
      legendTimeLabel: hoverVus ? timeLabel(idxVus, N_OV, OVERVIEW_SECONDS) + " de la corrida" : "corrida completa",
      legendValue: vusLabel(ov.vus[idxVus]),
      footnote: GS32.endpoints.length + " scenarios " + GS32.meta.executor + " — pico " + vusLabel(peakVus) + " en uso, " + (OVERVIEW_VUS_CEILING - peakVus) + " VUs de margen contra los " + OVERVIEW_VUS_CEILING + " asignados (vus_max).",
    };

    // -- Latencia agregada (p50/p95/p99) --
    const gLat = chartGeomShared([ov.p95, ov.p50, ov.p99], 300, 84, 8, 8);
    const hoverLat = hover.chart === "latency";
    const idxLat = hoverLat ? hover.index : N_OV - 1;
    const overviewLatency = {
      p95Points: gLat[0].points,
      p50Points: gLat[1].points,
      p99Points: gLat[2].points,
      headline: msLabel(ov.p95[N_OV - 1]) + " p95",
      bands: buildBands(N_OV, 300, 84, "latency", enterHover),
      hoverActive: hoverLat,
      hoverX: hoverLat ? xAt(idxLat, N_OV, 300).toFixed(1) : null,
      hoverY95: hoverLat ? gLat[0].pts[idxLat][1].toFixed(1) : null,
      hoverY50: hoverLat ? gLat[1].pts[idxLat][1].toFixed(1) : null,
      hoverY99: hoverLat ? gLat[2].pts[idxLat][1].toFixed(1) : null,
      legendTimeLabel: hoverLat ? timeLabel(idxLat, N_OV, OVERVIEW_SECONDS) + " de la corrida" : "corrida completa",
      p95Value: msLabel(ov.p95[idxLat]),
      p50Value: msLabel(ov.p50[idxLat]),
      p99Value: msLabel(ov.p99[idxLat]),
      nota: notaLatencia(ov),
    };

    // -- Transfer rate (recibidos/enviados) --
    const gTr = chartGeomShared([ov.recv, ov.sent], 300, 84, 8, 8);
    const hoverTr = hover.chart === "transfer";
    const idxTr = hoverTr ? hover.index : N_OV - 1;
    const overviewTransfer = {
      recvPoints: gTr[0].points,
      sentPoints: gTr[1].points,
      headline: kbLabel(ov.recv[N_OV - 1]),
      bands: buildBands(N_OV, 300, 84, "transfer", enterHover),
      hoverActive: hoverTr,
      hoverX: hoverTr ? xAt(idxTr, N_OV, 300).toFixed(1) : null,
      hoverYRecv: hoverTr ? gTr[0].pts[idxTr][1].toFixed(1) : null,
      hoverYSent: hoverTr ? gTr[1].pts[idxTr][1].toFixed(1) : null,
      legendTimeLabel: hoverTr ? timeLabel(idxTr, N_OV, OVERVIEW_SECONDS) + " de la corrida" : "corrida completa",
      recvValue: kbLabel(ov.recv[idxTr]),
      sentValue: kbLabel(ov.sent[idxTr]),
      nota: notaTransfer(decorated),
    };

    // -- Overview HTTP (throughput + error rate) --
    const gReq = chartGeom(ov.reqRate, 300, 56, 6, 6);
    const hoverHttp = hover.chart === "http";
    const idxHttp = hoverHttp ? hover.index : N_OV - 1;
    const errLevelAt = (v) => (v >= 2 ? "fail" : v >= 0.5 ? "warn" : "ok");
    const reqSum = ov.reqRate.reduce((a, v) => a + v, 0);
    const reqTotalRate = ov.reqRate.length ? reqSum / ov.reqRate.length : 0;
    const errTotalPct = reqSum ? ov.errRate.reduce((a, v, i) => a + v * ov.reqRate[i], 0) / reqSum : 0;
    const overviewHttp = {
      reqPoints: gReq.points,
      reqAreaPoints: gReq.areaPoints,
      headline: reqTotalRate.toFixed(1) + " req/s",
      bands: buildBands(N_OV, 300, 56, "http", enterHover),
      hoverActive: hoverHttp,
      hoverX: hoverHttp ? xAt(idxHttp, N_OV, 300).toFixed(1) : null,
      hoverY: hoverHttp ? gReq.pts[idxHttp][1].toFixed(1) : null,
      errStrip: ov.errRate.map((v, i) => ({
        levelVar: colorVar(errLevelAt(v)),
        activeClass: hoverHttp && i === idxHttp ? "active" : "",
      })),
      legendTimeLabel: hoverHttp ? timeLabel(idxHttp, N_OV, OVERVIEW_SECONDS) + " de la corrida" : "corrida completa",
      // Sin hover, "corrida completa" = el total de la corrida, no el último tramo.
      reqValue: (hoverHttp ? ov.reqRate[idxHttp] : reqTotalRate).toFixed(1) + " req/s",
      errValue: pctLabel(hoverHttp ? ov.errRate[idxHttp] : errTotalPct),
      errDotColor: colorVar(errLevelAt(hoverHttp ? ov.errRate[idxHttp] : errTotalPct)),
    };

    const overview = { vus: overviewVus, latency: overviewLatency, transfer: overviewTransfer, http: overviewHttp };

    // ============================================================================
    // Panel "Por endpoint": TPS + p95 + % error del endpoint inspeccionado,
    // superpuestos como areas en UN solo grafico (mismo lenguaje visual que el
    // "HTTP Performance overview" nativo de k6: cada metrica con su propia
    // escala, para que convivan pese a tener unidades distintas). Sin p50 a
    // pedido explicito - solo lo que el overview de k6 muestra.
    // ============================================================================
    const inspectedIdx = raw.findIndex((e) => e.name === inspectedName);
    const inspectedEntry = raw[inspectedIdx];
    const epTsReal = buildEndpointTimeline(inspectedEntry);
    const epTs = epTsReal || { tps: [0, 0], p95: [0, 0], err: [0, 0] };
    const N_EP = epTs.tps.length;
    const gTps = chartGeom(epTs.tps, 480, 200, 10, 20);
    const gP95 = chartGeom(epTs.p95, 480, 200, 10, 20);
    const gErr = chartGeom(epTs.err, 480, 200, 10, 20);
    const hoverTrend = hover.chart === "trend";
    const idxTrend = hoverTrend ? hover.index : N_EP - 1;
    // Color de "duration" propio (no accent/accent2, ya usados por TPS y por otras cosas del
    // reporte): mismo formato oklch L/C fijo + hue variable que el resto de la paleta.
    const durationColor = dark ? "oklch(78% 0.12 235)" : "oklch(50% 0.13 235)";

    const trend = {
      disponible: !!epTsReal,
      noDisponible: !epTsReal,
      noDisponibleTexto: "La tendencia por endpoint en el tiempo sale de samples.csv.gz, y esta corrida no lo tiene (es anterior a la salida CSV de k6). Las tarjetas de abajo sí son de esta corrida.",
      name: methodOf(inspectedName),
      durationColor,
      tpsAreaPoints: gTps.areaPoints,
      tpsPoints: gTps.points,
      p95AreaPoints: gP95.areaPoints,
      p95Points: gP95.points,
      errPoints: gErr.points,
      bands: buildBands(N_EP, 480, 200, "trend", enterHover),
      hoverActive: hoverTrend,
      hoverX: hoverTrend ? xAt(idxTrend, N_EP, 480).toFixed(1) : null,
      hoverYTps: hoverTrend ? gTps.pts[idxTrend][1].toFixed(1) : null,
      hoverYP95: hoverTrend ? gP95.pts[idxTrend][1].toFixed(1) : null,
      hoverYErr: hoverTrend ? gErr.pts[idxTrend][1].toFixed(1) : null,
      legendTimeLabel: (hoverTrend ? timeLabel(idxTrend, N_EP, ENDPOINT_SECONDS) : "último tramo, " + timeLabel(N_EP - 1, N_EP, ENDPOINT_SECONDS)) + " de la corrida",
      tpsValue: itsLabel(epTs.tps[idxTrend]),
      p95Value: msLabel(epTs.p95[idxTrend]),
      errValue: pctLabel(epTs.err[idxTrend]),
    };

    // ============================================================================
    // Comparativa entre corridas y versiones: dataset/baseline UNA sola vez, compartido entre
    // los 5 paneles agregados (buildHistoricoViewModel) y el panel-inspector de abajo.
    // ============================================================================
