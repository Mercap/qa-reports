<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS32 Smoke · brasil/production · 7 de oct de 2026</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { color: var(--accent2); text-decoration: underline; }
    button { font-family: inherit; }

    .gs32-report {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      padding: 40px 48px 64px;
    }

    [data-theme="dark"] {
      --bg: oklch(18% 0.02 260);
      --bg-panel: oklch(22% 0.02 260);
      --bg-elevated: oklch(25% 0.018 260);
      --bg-elevated-2: oklch(30% 0.018 260);
      --border: oklch(34% 0.018 260);
      --text: oklch(95% 0.008 260);
      --text-dim: oklch(76% 0.01 260);
      --text-faint: oklch(58% 0.01 260);
      --accent: oklch(80% 0.15 85);
      --accent2: oklch(78% 0.1 200);
      --ok: oklch(75% 0.15 150);
      --warn: oklch(78% 0.16 70);
      --fail: oklch(68% 0.19 25);
      --confound: oklch(76% 0.07 290);
      /* Verde azulado (teal), a pedido de Carlos tras rechazar naranja y amarillo, evaluando la
         paleta completa: --accent (dorado, hue 85), --ok (verde, hue 150), --accent2 (celeste,
         hue 200), --warn (ambar, hue 70), --fail (rojo, hue 25), --confound (violeta, hue 290).
         Hue 180 cae en el unico hueco real de la rueda (entre --ok y --accent2) y no repite el
         significado semantico de ningun otro color (no es ok/warn/fail/accent). */
      --payload-accent: oklch(74% 0.12 180);
      --shadow: 0 1px 0 oklch(10% 0.02 260 / 0.4), 0 8px 24px oklch(5% 0.02 260 / 0.35);
    }
    [data-theme="light"] {
      --bg: oklch(97% 0.006 90);
      --bg-panel: oklch(100% 0 0);
      --bg-elevated: oklch(100% 0 0);
      --bg-elevated-2: oklch(94% 0.008 90);
      --border: oklch(87% 0.012 90);
      --text: oklch(24% 0.02 260);
      --text-dim: oklch(42% 0.02 260);
      --text-faint: oklch(56% 0.02 260);
      --accent: oklch(52% 0.14 85);
      --accent2: oklch(48% 0.1 200);
      --ok: oklch(48% 0.13 150);
      --warn: oklch(52% 0.16 70);
      --fail: oklch(50% 0.19 25);
      --confound: oklch(50% 0.08 290);
      --payload-accent: oklch(50% 0.13 180);
      --shadow: 0 1px 0 oklch(90% 0.01 90 / 0.6), 0 8px 24px oklch(60% 0.02 260 / 0.12);
    }

    .heading-font { font-family: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .brand-row { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: color-mix(in oklch, var(--accent) 22%, var(--bg-elevated));
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .title { font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
    .subtitle { color: var(--text-dim); font-size: 14px; margin: 4px 0 0; }
    .meta-tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .tag {
      font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 6px 10px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--text-faint);
      background: var(--bg-elevated); white-space: nowrap;
    }
    .tag.sample {
      color: var(--accent); border-color: color-mix(in oklch, var(--accent) 45%, transparent);
      background: color-mix(in oklch, var(--accent) 14%, var(--bg-elevated));
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .kpi-tile {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }
    .kpi-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-faint); margin: 0 0 8px;
    }
    .kpi-value {
      font-family: "IBM Plex Mono", monospace;
      font-size: 26px; font-weight: 600; margin: 0; line-height: 1.1;
    }
    .kpi-sub { font-size: 12px; color: var(--text-dim); margin: 0; }
    .kpi-status-row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .kpi-status-row .pass { color: var(--ok); }
    .kpi-status-row .warn { color: var(--warn); }
    .kpi-status-row .fail { color: var(--fail); }

    .section-heading {
      display: flex; align-items: baseline; gap: 10px;
      margin: 0 0 16px;
      /* Compensa la altura del nav sticky para que un salto de #ancla no tape el título. */
      scroll-margin-top: 84px;
    }
    .section-heading h2 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
    .section-heading .count {
      font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-faint);
    }

    .quicknav {
      position: sticky; top: 12px; z-index: 20;
      display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px;
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 999px;
      padding: 8px; margin-bottom: 28px; box-shadow: var(--shadow);
    }
    .quicknav-link {
      font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 500;
      color: var(--text-dim); padding: 7px 13px; border-radius: 999px; white-space: nowrap;
      flex-shrink: 0;
    }
    .quicknav-link:hover {
      color: var(--accent2); text-decoration: none;
      background: color-mix(in oklch, var(--accent2) 12%, var(--bg-panel));
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
      margin-bottom: 40px;
    }
    .overview-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 6px;
    }
    .overview-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .overview-title { font-size: 12.5px; font-weight: 600; color: var(--text-dim); }
    .overview-value { font-family: "IBM Plex Mono", monospace; font-size: 15.5px; font-weight: 600; color: var(--text); }
    .overview-chart { display: block; width: 100%; height: 84px; overflow: visible; cursor: crosshair; }
    .overview-chart-sm { display: block; width: 100%; height: 56px; overflow: visible; cursor: crosshair; }
    .overview-footnote { font-size: 10.5px; color: var(--text-faint); margin: 4px 0 0; }

    .chart-legend { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
    .chart-legend-time {
      font-size: 10px; color: var(--text-faint); margin: 0 0 2px;
      font-family: "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .legend-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
    .legend-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .legend-row .legend-name {
      color: var(--text-dim); font-family: "IBM Plex Mono", monospace; font-size: 11px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; min-width: 0;
    }
    .legend-row .legend-value {
      font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600;
      color: var(--text); flex-shrink: 0;
    }

    .err-strip { display: flex; gap: 2px; margin-top: 6px; }
    .err-strip span { flex-grow: 1; height: 8px; border-radius: 2px; }
    .err-strip span.active { outline: 1.5px solid var(--text); outline-offset: 0; }

    .controls-bar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 12px; margin-bottom: 14px;
    }
    .view-toggle {
      display: inline-flex; background: var(--bg-elevated-2); border-radius: 999px; padding: 3px;
      gap: 2px;
    }
    .view-btn {
      appearance: none; border: none; cursor: pointer; background: transparent;
      color: var(--text-dim); font-size: 12.5px; font-weight: 500;
      padding: 7px 16px; border-radius: 999px;
    }
    .view-btn.active { background: var(--bg-panel); color: var(--text); box-shadow: var(--shadow); }

    .filter-controls { display: flex; align-items: center; gap: 10px; }
    .filter-btn {
      appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
      background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-dim);
      font-size: 12.5px; font-weight: 500; padding: 7px 14px; border-radius: 999px;
    }
    .filter-btn.active { color: var(--accent2); border-color: color-mix(in oklch, var(--accent2) 45%, transparent); background: color-mix(in oklch, var(--accent2) 12%, var(--bg-panel)); }
    .filter-count {
      font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
      background: var(--accent2); color: var(--bg-panel); border-radius: 999px;
      padding: 1px 6px;
    }
    .clear-chips-btn {
      appearance: none; cursor: pointer; background: none; border: none;
      color: var(--accent2); font-size: 12.5px; padding: 0;
    }

    .chip-group-label {
      font-size: 11px; color: var(--text-faint); margin: 0 0 6px;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .chip-panel {
      display: flex; flex-wrap: wrap; gap: 7px;
      margin-bottom: 16px; padding: 14px; border-radius: 12px;
      background: var(--bg-elevated); border: 1px dashed var(--border);
    }
    .chip {
      appearance: none; cursor: pointer; font-family: "IBM Plex Mono", monospace;
      font-size: 11px; padding: 5px 10px; border-radius: 8px;
      background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-dim);
    }
    .chip.selected {
      color: var(--accent2); border-color: color-mix(in oklch, var(--accent2) 55%, transparent);
      background: color-mix(in oklch, var(--accent2) 18%, var(--bg-panel));
    }

    .trend-panel {
      background: var(--bg-elevated);
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 18px 22px;
      margin-bottom: 18px;
    }
    .trend-panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 4px; flex-wrap: wrap; }
    .trend-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin: 0 0 2px; }
    .trend-hint-inline { font-size: 11.5px; color: var(--text-faint); margin: 2px 0 0; }
    .trend-body { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; margin-top: 14px; }
    .trend-chart-col { flex: 1 1 340px; min-width: 280px; }
    .trend-chart-big { display: block; width: 100%; height: 190px; overflow: visible; cursor: crosshair; }
    .trend-legend-panel {
      flex: 0 0 230px; max-height: 230px; overflow-y: auto;
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
    }

    .footer-note { font-size: 12px; color: var(--text-faint); margin: 0 0 18px; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr));
      gap: 18px;
      margin-bottom: 40px;
    }
    .ep-card {
      position: relative;
      cursor: pointer;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 16px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .ep-card:hover { border-color: color-mix(in oklch, var(--accent2) 35%, var(--border)); }
    .ep-card.inspecting { border-color: var(--accent2); box-shadow: 0 0 0 1px var(--accent2), var(--shadow); }
    .rank-badge {
      position: absolute; top: -10px; left: -10px;
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--bg-elevated-2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--text-faint);
    }
    .inspect-badge {
      position: absolute; top: -10px; right: -10px;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent2); color: var(--bg-panel);
      display: flex; align-items: center; justify-content: center;
    }
    .ep-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .ep-name { font-family: "IBM Plex Mono", monospace; font-size: 14px; font-weight: 600; margin: 0; word-break: break-word; }
    .ep-desc { font-size: 12px; color: var(--text-faint); margin: 4px 0 0; line-height: 1.4; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
      padding: 5px 10px; border-radius: 999px; flex-shrink: 0;
      white-space: nowrap;
    }
    .status-pill.pass { color: var(--ok); background: color-mix(in oklch, var(--ok) 18%, transparent); border: 1px solid color-mix(in oklch, var(--ok) 40%, transparent); }
    .status-pill.warn { color: var(--warn); background: color-mix(in oklch, var(--warn) 20%, transparent); border: 1px solid color-mix(in oklch, var(--warn) 45%, transparent); }
    .status-pill.fail { color: var(--fail); background: color-mix(in oklch, var(--fail) 20%, transparent); border: 1px solid color-mix(in oklch, var(--fail) 45%, transparent); }

    .ep-body { display: flex; gap: 20px; align-items: center; }
    .ring-block { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; width: 96px; }
    .ring-wrap { position: relative; width: 56px; height: 56px; }
    .ring-pct {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600;
    }
    .ring-labels { text-align: center; }
    .ring-labels .l1, .ring-labels .l2 { font-size: 10.5px; color: var(--text-faint); margin: 0; line-height: 1.5; }
    .ring-labels .v1, .ring-labels .v2 { font-family: "IBM Plex Mono", monospace; color: var(--text); }

    .latency-block { flex-grow: 1; min-width: 0; }
    .latency-track {
      position: relative;
      height: 8px; border-radius: 999px;
      background: var(--bg-elevated-2);
      overflow: visible;
      margin-bottom: 10px;
    }
    .latency-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent2); border-radius: 999px; }
    .latency-p50 { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--text); opacity: 0.55; border-radius: 1px; }
    .latency-p99 { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--accent); opacity: 0.85; border-radius: 1px; }
    .latency-max-dot {
      position: absolute; right: -1px; top: -3px; width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid var(--bg-panel);
    }
    .latency-legend { display: flex; justify-content: space-between; font-family: "IBM Plex Mono", monospace; font-size: 11px; }
    .latency-legend .p50 { color: var(--text-faint); }
    .latency-legend .p95 { color: var(--text-dim); }
    .latency-legend .p99 { color: var(--accent); }

    /* Desglose de fases de la latencia (red/conexión vs espera de backend vs descarga):
       barra apilada CSS simple, sin SVG - alcanza con 3 divs a ancho variable. */
    .phase-bar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; margin-top: 10px; background: var(--bg-elevated-2); }
    .phase-seg.phase-net { background: var(--accent); }
    .phase-seg.phase-wait { background: var(--accent2); }
    .phase-seg.phase-recv { background: var(--text-faint); }
    .phase-legend {
      display: flex; justify-content: space-between; margin-top: 4px;
      font-family: "IBM Plex Mono", monospace; font-size: 9.5px; color: var(--text-faint);
    }

    .pattern-tag {
      font-family: "IBM Plex Mono", monospace; font-size: 9.5px; font-weight: 600;
      letter-spacing: 0.03em; text-transform: uppercase;
    }

    .ep-footer {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; row-gap: 6px; column-gap: 12px;
      border-top: 1px solid var(--border); padding-top: 12px;
      font-size: 11.5px; color: var(--text-faint);
    }
    .ep-footer .val { font-family: "IBM Plex Mono", monospace; color: var(--text-dim); }
    .ep-footer .val.err-ok { color: var(--ok); }
    .ep-footer .val.err-bad { color: var(--fail); }

    .insight-columns {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .insight-column { display: flex; flex-direction: column; gap: 8px; }
    .insight-col-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .insight-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .insight-col-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; flex-grow: 1; }
    .insight-col-count {
      font-family: "IBM Plex Mono", monospace; font-size: 11px;
      border-radius: 999px; padding: 2px 8px;
    }
    .insight-item { border-radius: 12px; padding: 12px 14px; }
    .insight-item p { font-size: 12.5px; line-height: 1.55; color: var(--text-dim); margin: 0; }
    .insight-expand-btn {
      appearance: none; cursor: pointer; background: none; border: none; text-align: left;
      font-size: 12px; padding: 2px 0; margin-top: 2px;
    }

    .col-hallazgo .insight-icon { background: color-mix(in oklch, var(--accent2) 24%, var(--bg-elevated)); color: var(--accent2); }
    .col-hallazgo .insight-col-title { color: var(--accent2); }
    .col-hallazgo .insight-col-count { color: var(--accent2); background: color-mix(in oklch, var(--accent2) 16%, transparent); }
    .col-hallazgo .insight-item { background: color-mix(in oklch, var(--accent2) 8%, var(--bg-elevated)); }
    .col-hallazgo .insight-expand-btn { color: var(--accent2); }

    .col-riesgo .insight-icon { background: color-mix(in oklch, var(--warn) 24%, var(--bg-elevated)); color: var(--warn); }
    .col-riesgo .insight-col-title { color: var(--warn); }
    .col-riesgo .insight-col-count { color: var(--warn); background: color-mix(in oklch, var(--warn) 16%, transparent); }
    .col-riesgo .insight-item { background: color-mix(in oklch, var(--warn) 8%, var(--bg-elevated)); }
    .col-riesgo .insight-expand-btn { color: var(--warn); }

    .col-confound .insight-icon { background: color-mix(in oklch, var(--confound) 26%, var(--bg-elevated)); color: var(--confound); }
    .col-confound .insight-col-title { color: var(--confound); }
    .col-confound .insight-col-count { color: var(--confound); background: color-mix(in oklch, var(--confound) 18%, transparent); }
    .col-confound .insight-item { background: color-mix(in oklch, var(--confound) 9%, var(--bg-elevated)); }
    .col-confound .insight-expand-btn { color: var(--confound); }

    /* ===== Comparativa entre corridas y versiones (2026-09-18) ===== */
    .historico-banner {
      font-size: 12.5px; color: var(--text-dim); margin: 0 0 20px; line-height: 1.5;
      background: var(--bg-elevated); border: 1px dashed var(--border); border-radius: 12px;
      padding: 12px 16px;
    }
    .historico-banner strong { color: var(--text); }

    .historico-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr));
      gap: 20px;
      margin-bottom: 22px;
      align-items: stretch;
    }
    .historico-card {
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px 20px; box-shadow: var(--shadow);
    }
    .historico-card-title {
      font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin: 0 0 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }

    /* Scorecard de versión */
    .verdict-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .verdict-pill {
      display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px;
      padding: 8px 16px; border-radius: 999px; font-family: "Space Grotesk", sans-serif;
    }
    .verdict-sub { font-size: 11.5px; color: var(--text-faint); }
    .scorecard-counts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .scorecard-count-tile {
      border-radius: 12px; padding: 12px 14px; text-align: center;
      background: var(--bg-elevated); border: 1px solid var(--border);
    }
    .scorecard-count-value { font-family: "IBM Plex Mono", monospace; font-size: 24px; font-weight: 700; line-height: 1.1; }
    .scorecard-count-label { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.03em; margin-top: 4px; }
    .scorecard-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; max-height: 130px; overflow-y: auto; }
    .scorecard-list-item {
      display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px;
      padding: 6px 10px; border-radius: 8px; background: var(--bg-elevated);
    }
    .scorecard-list-item .name { color: var(--text-dim); font-family: "IBM Plex Mono", monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .scorecard-list-item .delta { font-family: "IBM Plex Mono", monospace; font-weight: 600; flex-shrink: 0; }
    .scorecard-empty { font-size: 11.5px; color: var(--text-faint); font-style: italic; padding: 10px 0; }

    /* Tendencia de ultimas corridas: barras CSS, sin SVG (mismo criterio que .phase-bar). */
    .trend-bars-wrap { position: relative; height: 150px; margin: 10px 0 8px; }
    .trend-baseline-line {
      position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--fail); opacity: 0.6;
    }
    .trend-bars-row { display: flex; align-items: flex-end; gap: 6px; height: 100%; position: relative; z-index: 1; }
    .trend-bar-col { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .trend-bar { width: 100%; max-width: 26px; border-radius: 4px 4px 0 0; position: relative; }
    .trend-bar.escenario { background-image: repeating-linear-gradient(45deg, transparent, transparent 3px, color-mix(in oklch, white 30%, transparent) 3px, color-mix(in oklch, white 30%, transparent) 6px); }
    .trend-bar { cursor: crosshair; }
    .trend-bar.active { outline: 2px solid var(--text); outline-offset: 1px; }
    .trend-bar-labels { display: flex; gap: 6px; margin-top: 6px; }
    .trend-bar-label-col { flex: 1 1 0; text-align: center; font-size: 8.5px; color: var(--text-faint); font-family: "IBM Plex Mono", monospace; }
    .trend-legend-note { font-size: 10.5px; color: var(--text-faint); margin: 8px 0 0; }

    /* Evolucion por version: barras horizontales. */
    .version-rows { display: flex; flex-direction: column; gap: 10px; }
    .version-row { display: grid; grid-template-columns: 90px 1fr 70px; align-items: center; gap: 10px; }
    .version-row.actual .version-label { color: var(--accent2); font-weight: 700; }
    .version-label { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--text-dim); }
    .version-track { height: 16px; border-radius: 6px; background: var(--bg-elevated-2); overflow: hidden; }
    .version-fill { height: 100%; border-radius: 6px; background: var(--accent2); }
    .version-row.actual .version-fill { background: var(--accent); }
    .version-value { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; }

    /* Semaforo de endpoints */
    .semaforo-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .semaforo-table th {
      text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--text-faint); padding: 6px 10px; border-bottom: 1px solid var(--border);
    }
    .semaforo-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .semaforo-table td.num { font-family: "IBM Plex Mono", monospace; text-align: right; }
    /* th.num centrado (no left, que es el default de la tabla): antes el encabezado numerico
       quedaba pegado a la izquierda mientras el dato de abajo va a la derecha, y se veian
       desalineados - encontrado revisando una captura real del informe. */
    th.num { text-align: center; }
    .subsection-divider { border-top: 1px dashed var(--border); margin: 18px 0; }
    .info-tip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 13px; height: 13px; border-radius: 50%; margin-left: 4px;
      background: var(--bg-elevated-2); color: var(--text-faint);
      font-size: 9px; font-weight: 700; cursor: help; vertical-align: middle;
    }
    .semaforo-table tr:last-child td { border-bottom: none; }
    .semaforo-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; flex-shrink: 0; }
    .semaforo-name-cell { display: flex; align-items: center; }
    .semaforo-name { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; }

    /* Distribucion historica / patron */
    .patron-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .patron-table th {
      text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--text-faint); padding: 6px 10px; border-bottom: 1px solid var(--border);
    }
    .patron-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .patron-table td.num { font-family: "IBM Plex Mono", monospace; text-align: right; }
    .patron-table tr:last-child td { border-bottom: none; }
    .patron-badge {
      font-family: "IBM Plex Mono", monospace; font-size: 9.5px; font-weight: 700;
      padding: 3px 8px; border-radius: 999px; letter-spacing: 0.02em;
    }
    .escenario-callout {
      margin-top: 14px; padding: 12px 14px; border-radius: 10px;
      background: color-mix(in oklch, var(--confound) 10%, var(--bg-elevated));
      border: 1px solid color-mix(in oklch, var(--confound) 30%, var(--border));
      font-size: 11.5px; color: var(--text-dim); line-height: 1.5;
    }
    .escenario-callout strong { color: var(--confound); }

    /* ===== Escenarios: catalogo + detalle + comparar (2026-09-18) ===== */
    .escn-catalogo-row { cursor: pointer; }
    .escn-catalogo-row:hover td { background: var(--bg-elevated); }
    .escn-catalogo-row.selected td { background: color-mix(in oklch, var(--confound) 12%, transparent); }
    .escn-catalogo-row td:first-child { font-weight: 600; }
    .scn-single-banner {
      display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px;
      padding: 10px 14px; border-radius: 10px;
      background: color-mix(in oklch, var(--warn) 12%, var(--bg-elevated));
      border: 1px solid color-mix(in oklch, var(--warn) 35%, var(--border));
      border-left: 3px solid var(--warn);
      font-size: 11.5px; color: var(--text-dim); line-height: 1.5;
    }
    .scn-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .scn-narrativa {
      font-size: 12px; color: var(--text-dim); line-height: 1.55; margin: 0 0 18px;
      padding: 10px 14px; border-radius: 10px; background: var(--bg-elevated);
      border-left: 3px solid var(--accent2);
    }
    .scn-hallazgos-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
    .scn-hallazgos-empty { font-size: 11.5px; color: var(--text-faint); grid-column: 1 / -1; }
    .scn-hallazgos-col-title { font-size: 11px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
    .scn-compare-empty { font-size: 11.5px; color: var(--text-faint); padding: 10px 0; }

    /* ===== Resumen ejecutivo en lenguaje llano + Conclusiones/Recomendaciones (2026-09-18) ===== */
    .parrafo-card {
      display: flex; align-items: flex-start; gap: 14px;
      background: color-mix(in oklch, var(--accent2) 10%, var(--bg-panel));
      border: 1px solid color-mix(in oklch, var(--accent2) 30%, var(--border));
      border-radius: 14px; padding: 18px 22px; margin-bottom: 28px;
    }
    .parrafo-card-icon { font-size: 20px; line-height: 1.4; flex-shrink: 0; }
    .parrafo-card p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--text); }

    .subsection-title { font-size: 13px; font-weight: 700; margin: 0 0 12px; color: var(--text); }

    .conclusiones-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .conclusion-card { border-radius: 14px; padding: 16px 18px; border: 1px solid var(--border); }
    .conclusion-card.escalar { background: color-mix(in oklch, var(--fail) 8%, var(--bg-panel)); border-color: color-mix(in oklch, var(--fail) 35%, var(--border)); }
    .conclusion-card.investigar { background: color-mix(in oklch, var(--warn) 8%, var(--bg-panel)); border-color: color-mix(in oklch, var(--warn) 35%, var(--border)); }
    .conclusion-card.optimizar { background: color-mix(in oklch, var(--accent2) 8%, var(--bg-panel)); border-color: color-mix(in oklch, var(--accent2) 35%, var(--border)); }
    .conclusion-eyebrow {
      font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
      display: flex; align-items: center; gap: 6px; margin: 0 0 8px;
    }
    .conclusion-card.escalar .conclusion-eyebrow { color: var(--fail); }
    .conclusion-card.investigar .conclusion-eyebrow { color: var(--warn); }
    .conclusion-card.optimizar .conclusion-eyebrow { color: var(--accent2); }
    .conclusion-title { font-size: 14px; font-weight: 700; margin: 0 0 8px; color: var(--text); }
    .conclusion-text { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; margin: 0; }

    .recom-table, .bottleneck-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 28px; }
    .recom-table th, .bottleneck-table th {
      text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--text-faint); padding: 6px 10px; border-bottom: 1px solid var(--border);
    }
    .recom-table td, .bottleneck-table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .recom-table tr:last-child td, .bottleneck-table tr:last-child td { border-bottom: none; }
    .recom-evidencia { font-size: 11px; color: var(--text-faint); font-style: italic; }
    .prioridad-pill {
      display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 700;
      padding: 2px 8px; border-radius: 999px; color: var(--bg-panel); white-space: nowrap;
    }
    .bottleneck-name-cell { display: flex; align-items: center; gap: 8px; }

    /* ===== Payload y eficiencia de transferencia (2026-09-18) ===== */
    .payload-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr));
      gap: 20px; margin-bottom: 28px; align-items: start;
    }
    .rank-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .rank-table th {
      text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--text-faint); padding: 6px 10px; border-bottom: 1px solid var(--border);
    }
    .rank-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .rank-table td.num { font-family: "IBM Plex Mono", monospace; text-align: right; }
    .rank-table tr:last-child td { border-bottom: none; }
    .band-badge {
      font-family: "IBM Plex Mono", monospace; font-size: 9.5px; font-weight: 700;
      padding: 3px 8px; border-radius: 999px; letter-spacing: 0.02em; white-space: nowrap;
    }
    .outlier-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-family: "IBM Plex Mono", monospace; font-size: 9px; font-weight: 700;
      color: var(--fail); background: color-mix(in oklch, var(--fail) 16%, transparent);
      padding: 2px 7px; border-radius: 999px; margin-left: 6px; white-space: nowrap;
    }
    .cache-fria-badge {
      display: inline-flex; align-items: center; gap: 3px; cursor: help;
      font-family: "IBM Plex Mono", monospace; font-size: 9px; font-weight: 600;
      color: var(--accent2); background: color-mix(in oklch, var(--accent2) 14%, transparent);
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
    }
    .band-legend {
      display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 0; font-size: 10.5px; color: var(--text-faint);
    }
    .band-legend span.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

    footer.report-footer {
      margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border);
      font-size: 11.5px; color: var(--text-faint); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    footer.report-footer .mono { font-family: "IBM Plex Mono", monospace; }

    @media (max-width: 760px) {
      .gs32-report { padding: 24px 16px 48px; }
      .historico-card { overflow-x: auto; }
      .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .overview-grid { grid-template-columns: minmax(0, 1fr); }
      .trend-body { flex-direction: column; }
      .trend-legend-panel { flex-basis: auto; width: 100%; }
      .insight-columns { grid-template-columns: minmax(0, 1fr); }
      .top-bar { flex-direction: column; }
      .meta-tags { justify-content: flex-start; }
      .controls-bar { flex-direction: column; align-items: stretch; }
    }
  </style>

</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div class="gs32-report" data-theme="{{theme}}">

  <div class="top-bar">
    <div class="brand-row">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-7 4 14 2-7h6"></path></svg>
      </div>
      <div>
        <h1 class="title heading-font">GS32 — {{meta.tituloTipo}}</h1>
        <p class="subtitle">{{kpi.endpointCount}} endpoints en paralelo, cada uno a su tasa · {{meta.ambienteLabel}}</p>
      </div>
    </div>
    <div class="meta-tags">
      <span class="tag">{{meta.versionLabel}}</span>
      <span class="tag">Ventana {{kpi.ventanaLabel}}</span>
      <span class="tag">{{meta.fechaLabel}} · {{kpi.ventanaRangoLabel}}</span>
    </div>
  </div>

  <nav class="quicknav" aria-label="Accesos directos a las secciones del informe">
    <a class="quicknav-link" href="#sec-resumen">Resumen ejecutivo</a>
    <a class="quicknav-link" href="#sec-panel-general">Panel general</a>
    <a class="quicknav-link" href="#sec-por-endpoint">Por endpoint</a>
    <a class="quicknav-link" href="#sec-tendencia-endpoint">Tendencia por endpoint</a>
    <a class="quicknav-link" href="#sec-payload">Payload</a>
    <a class="quicknav-link" href="#sec-comparativa">Comparativa</a>
    <a class="quicknav-link" href="#sec-escenarios">Escenarios</a>
  </nav>

  <div class="section-heading" id="sec-resumen">
    <h2 class="heading-font">Resumen ejecutivo</h2>
    <span class="count">{{insightTotalLabel}} puntos clave</span>
  </div>

  <div class="parrafo-card">
    <span class="parrafo-card-icon">✨</span>
    <p>{{resumenEjecutivo.parrafo}}</p>
  </div>

  <p class="subsection-title">💡 Conclusiones y accionables</p>
  <div class="conclusiones-grid">
    <div class="conclusion-card escalar">
      <p class="conclusion-eyebrow">🚨 Escalar de forma prioritaria</p>
      <p class="conclusion-title">{{resumenEjecutivo.cardEscalar.titulo}}</p>
      <p class="conclusion-text">{{resumenEjecutivo.cardEscalar.texto}}</p>
    </div>
    <div class="conclusion-card investigar">
      <p class="conclusion-eyebrow">🔍 Investigar</p>
      <p class="conclusion-title">{{resumenEjecutivo.cardInvestigar.titulo}}</p>
      <p class="conclusion-text">{{resumenEjecutivo.cardInvestigar.texto}}</p>
    </div>
    <div class="conclusion-card optimizar">
      <p class="conclusion-eyebrow">⚡ Optimizar</p>
      <p class="conclusion-title">{{resumenEjecutivo.cardOptimizar.titulo}}</p>
      <p class="conclusion-text">{{resumenEjecutivo.cardOptimizar.texto}}</p>
    </div>
  </div>

  <template data-if="resumenEjecutivo.hasRecomendaciones">
    <p class="subsection-title">📋 Recomendaciones prioritarias</p>
    <table class="recom-table">
      <thead>
        <tr><th>Prioridad</th><th>Acción</th><th>API</th><th>Evidencia</th></tr>
      </thead>
      <tbody>
        <template data-for="resumenEjecutivo.recomendaciones" data-as="r">
          <tr>
            <td><span class="prioridad-pill" style="background: {{r.prioridadColorVar}};">{{r.prioridad}}</span></td>
            <td>{{r.accion}}</td>
            <td class="mono">{{r.seccion}}</td>
            <td class="recom-evidencia">{{r.evidencia}}</td>
          </tr>
        </template>
      </tbody>
    </table>
  </template>

  <template data-if="resumenEjecutivo.hasBottlenecks">
    <p class="subsection-title">🚧 Cuellos de botella detectados (corrida actual)</p>
    <table class="bottleneck-table">
      <thead>
        <tr><th>Endpoint</th><th>Motivo</th><th class="num">p95</th></tr>
      </thead>
      <tbody>
        <template data-for="resumenEjecutivo.bottlenecks" data-as="b">
          <tr>
            <td>
              <span class="bottleneck-name-cell">
                <span class="semaforo-dot" style="background: {{b.statusColorVar}};"></span>
                <span class="semaforo-name">{{b.name}}</span>
              </span>
            </td>
            <td>{{b.motivo}}</td>
            <td class="num mono">{{b.p95Label}}</td>
          </tr>
        </template>
      </tbody>
    </table>
  </template>

  <div class="insight-columns">
    <div class="insight-column col-hallazgo">
      <div class="insight-col-head">
        <div class="insight-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M20 20l-4.8-4.8"></path></svg>
        </div>
        <span class="insight-col-title">Hallazgos</span>
        <span class="insight-col-count">{{hallazgoCount}}</span>
      </div>
      <template data-for="hallazgoVisible" data-as="it">
        <div class="insight-item"><p>{{it.text}}</p></div>
      </template>
      <template data-if="hallazgoHasMore">
        <button type="button" class="insight-expand-btn" onClick="{{handlers.toggleHallazgo}}">{{hallazgoToggleLabel}}</button>
      </template>
    </div>

    <div class="insight-column col-riesgo">
      <div class="insight-col-head">
        <div class="insight-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5l8.5 14.5H3.5L12 4.5z"></path><path d="M12 10v4"></path></svg>
        </div>
        <span class="insight-col-title">Riesgos</span>
        <span class="insight-col-count">{{riesgoCount}}</span>
      </div>
      <template data-for="riesgoVisible" data-as="it">
        <div class="insight-item"><p>{{it.text}}</p></div>
      </template>
      <template data-if="riesgoHasMore">
        <button type="button" class="insight-expand-btn" onClick="{{handlers.toggleRiesgo}}">{{riesgoToggleLabel}}</button>
      </template>
    </div>

    <div class="insight-column col-confound">
      <div class="insight-col-head">
        <div class="insight-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 0 1 14.5-6"></path><path d="M18 3v4h-4"></path><path d="M20.5 12a8.5 8.5 0 0 1-14.5 6"></path><path d="M6 21v-4h4"></path></svg>
        </div>
        <span class="insight-col-title">Salvedades</span>
        <span class="insight-col-count">{{confoundCount}}</span>
      </div>
      <template data-for="confoundVisible" data-as="it">
        <div class="insight-item"><p>{{it.text}}</p></div>
      </template>
      <template data-if="confoundHasMore">
        <button type="button" class="insight-expand-btn" onClick="{{handlers.toggleConfound}}">{{confoundToggleLabel}}</button>
      </template>
    </div>
  </div>

  <div class="kpi-row">
    <div class="kpi-tile">
      <p class="kpi-label">Endpoints medidos</p>
      <p class="kpi-value">{{kpi.endpointCount}}</p>
    </div>
    <div class="kpi-tile">
      <p class="kpi-label">Ventana de la corrida</p>
      <p class="kpi-value">{{kpi.ventanaLabel}}</p>
    </div>
    <div class="kpi-tile">
      <p class="kpi-label">Iteraciones totales</p>
      <p class="kpi-value">{{kpi.totalIterationsLabel}}</p>
    </div>
    <div class="kpi-tile">
      <p class="kpi-label">Throughput agregado</p>
      <p class="kpi-value">{{kpi.totalThroughputLabel}}<span style="font-size:14px;color:var(--text-faint);"> it/s</span></p>
    </div>
    <div class="kpi-tile">
      <p class="kpi-label">Estado general</p>
      <div class="kpi-status-row">
        <p class="kpi-value pass">{{kpi.passCount}}</p>
        <p class="kpi-sub">PASS</p>
        <p class="kpi-value warn">{{kpi.warnCount}}</p>
        <p class="kpi-sub">WARN</p>
        <p class="kpi-value fail">{{kpi.failCount}}</p>
        <p class="kpi-sub">FAIL</p>
      </div>
    </div>
    <div class="kpi-tile">
      <p class="kpi-label">Apdex agregado <span class="info-tip" title="Índice de satisfacción de 0 a 1 sobre las iteraciones medidas: satisfecha si tarda ≤ 500 ms, tolerable si tarda ≤ 1500 ms, frustrada si tarda más o falló. T y F son los mismos para todo endpoint, ambiente y tipo de test: es una lectura rápida, no un criterio, y en un estrés lo esperable es que dé mal. Escala: ≥ 0,94 excelente, ≥ 0,85 bueno, ≥ 0,70 regular, ≥ 0,50 pobre, menos inaceptable. Promedio simple entre endpoints.">?</span></p>
      <p class="kpi-value" style="color: {{kpi.apdexColorVar}};">{{kpi.apdexLabel}}</p>
      <p class="kpi-sub">{{kpi.apdexBand}} · {{kpi.apdexTNote}}</p>
    </div>

<script>// Runtime mínimo para el template del informe de GS32 (templates/gs32/informe.dc.html), que es el
// mockup aprobado hecho en el canvas de diseño de claude.ai. Ese canvas trae su propio runtime y no
// funciona fuera de claude.ai; esto implementa SOLO lo que el template usa, para que el informe sea un
// HTML autocontenido (se abre local, se sube como artifact de Actions o a GH Pages):
//
//   {{a.b.c}}                    en textos y atributos (solo rutas, el template no usa expresiones)
//   <template data-for="lista" data-as="x">   (era <sc-for list="{{lista}}" as="x">)
//   <template data-if="cond">                 (era <sc-if value="{{cond}}">)
//   onClick / onMouseEnter / onMouseLeave = "{{handler}}"
//   class Component extends DCLogic { state, setState(), renderVals() }
//
// scripts/gs32/informe-html.mjs convierte sc-for/sc-if a <template> al generar: el parser de HTML
// saca de lugar cualquier elemento desconocido que esté dentro de una <tbody>, y <template> no.
// Se carga inline en el HTML. Sin dependencias.
(function () {
  'use strict';

  const PATH = /\{\{\s*([A-Za-z_$][\w$]*(?:\.[\w$]+)*)\s*\}\}/g;
  const SOLO = /^\{\{\s*([A-Za-z_$][\w$]*(?:\.[\w$]+)*)\s*\}\}$/;

  function resolver(scope, ruta) {
    const partes = ruta.split('.');
    let v = scope[partes[0]];
    for (let i = 1; i < partes.length && v !== undefined && v !== null; i++) v = v[partes[i]];
    return v;
  }
  function interpolar(texto, scope) {
    return texto.replace(PATH, (_, ruta) => {
      const v = resolver(scope, ruta);
      return v === undefined || v === null ? '' : String(v);
    });
  }
  const hijosDe = (n) => (n.content ? n.content.childNodes : n.childNodes);

  function render(nodo, scope, padre) {
    if (nodo.nodeType === 3) {
      padre.appendChild(document.createTextNode(interpolar(nodo.nodeValue, scope)));
      return;
    }
    if (nodo.nodeType !== 1) return;
    const tag = nodo.localName;
    if (tag === 'template' && nodo.hasAttribute('data-for')) {
      const lista = resolver(scope, nodo.getAttribute('data-for')) || [];
      const as = nodo.getAttribute('data-as') || 'item';
      for (let i = 0; i < lista.length; i++) {
        const s = Object.create(scope);
        s[as] = lista[i];
        hijosDe(nodo).forEach((h) => render(h, s, padre));
      }
      return;
    }
    if (tag === 'template' && nodo.hasAttribute('data-if')) {
      if (resolver(scope, nodo.getAttribute('data-if'))) hijosDe(nodo).forEach((h) => render(h, scope, padre));
      return;
    }
    const el = nodo.namespaceURI && nodo.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(nodo.namespaceURI, nodo.tagName)
      : document.createElement(tag);
    for (const a of Array.from(nodo.attributes)) {
      const nombre = a.name;
      if (/^on[a-z]+$/i.test(nombre)) {
        const m = a.value.match(SOLO);
        const fn = m ? resolver(scope, m[1]) : null;
        if (typeof fn === 'function') el.addEventListener(nombre.slice(2).toLowerCase(), fn);
        continue;
      }
      el.setAttribute(nombre, interpolar(a.value, scope));
    }
    hijosDe(nodo).forEach((h) => render(h, scope, el));
    padre.appendChild(el);
  }

  class DCLogic {
    constructor(props) {
      this.props = props || {};
      this.state = {};
    }
    setState(parcial) {
      // Sin cambio real no se re-renderiza: al reemplazar el DOM, el navegador vuelve a disparar
      // mouseenter sobre el elemento nuevo que queda bajo el puntero, y sin esta guarda el hover
      // entraría en un bucle.
      const antes = JSON.stringify(Object.keys(parcial).map((k) => this.state[k]));
      const despues = JSON.stringify(Object.keys(parcial).map((k) => parcial[k]));
      Object.assign(this.state, parcial);
      if (antes !== despues && this.__pintar) this.__pintar();
    }
  }
  window.DCLogic = DCLogic;

  window.dcMontar = function (Componente, tpl, raiz, props) {
    const c = new Componente(props);
    c.__pintar = () => {
      const scrollY = window.scrollY;
      const frag = document.createDocumentFragment();
      const vals = c.renderVals();
      hijosDe(tpl).forEach((h) => render(h, vals, frag));
      raiz.replaceChildren(frag);
      window.scrollTo(0, scrollY);
    };
    c.__pintar();
    return c;
  };
})();
</script>
<script>

// Datos de la corrida: los inyecta scripts/gs32/informe-html.mjs en window.__GS32__. Este template
// no inventa ningún número (el mockup aprobado usaba una semilla pseudoaleatoria, que ya no existe): lo que no está en
// los datos se muestra como "s/d" o con un estado vacío.
const GS32 = window.__GS32__;
const RAW_NAMES = GS32.endpoints.map((e) => e.slug);
const RUN_WINDOW_SECONDS = GS32.ventanaSeg;

function colorVar(level) {
  return level === "ok" ? "var(--ok)" : level === "warn" ? "var(--warn)" : "var(--fail)";
}

// ---- Cuello de botella (Resumen Ejecutivo, 2026-09-18): motivo por endpoint -------------------
// Pedido de Carlos: listar endpoints + POR QUE son un cuello de botella. El motivo sale de
// señales que YA se calculan para la tarjeta de cada endpoint (error/patron/fase/apdex) - no es
// un texto nuevo escrito a mano por endpoint, es una explicacion generada de datos reales, con
// prioridad de que señal es mas diagnostica primero (un error rate real pesa mas que un apdex bajo).
// ---- Latencia por KB (2026-09-18): mismo calculo y MISMOS umbrales que el panel real "Latency
// Per KB" del dashboard de Grafana de pepper-API-testing (tooltip transcripto tal cual, no
// inventado): ratio = latencia promedio (ms) / payload promedio (KB). Un ratio ALTO ("Cuentagotas")
// es ineficiente - el servidor tarda mucho para entregar POCOS bytes (computo puro, no volumen de
// datos). Un ratio BAJO ("Manguera") es eficiente - entrega mucho volumen rapido. Usa p50 (no p95)
// como "latencia promedio", que es la lectura mas fiel a lo que el panel real llama "promedio".
// Nombres de banda CAMBIADOS a proposito de los que usa pepper ("Eficiencia alta"/"Critico") a
// algo mas acotado ("Proporcional"/"Desproporcionado"): Carlos encontro un problema real - un
// endpoint puede salir en VERDE acá (porque su latencia es chica en relacion a su payload) y
// seguir siendo un cuello de botella por OTRO motivo (computo puro, ej. appraise-market-value,
// que esta en la lista de Cuellos de Botella y en el Semaforo pese a dar "verde" en esta metrica
// puntual). El verde de esta tabla NO es un veredicto de salud general del endpoint, es una
// respuesta acotada a UNA pregunta especifica ("¿la latencia se explica por el volumen de datos
// o no?") - el nombre de la banda tiene que dejar eso claro, no sugerir "todo bien".
function latencyPerKBBand(ratio) {
  if (ratio <= 5000) return { label: "Proporcional", colorVar: colorVar("ok") };
  if (ratio <= 50000) return { label: "A revisar", colorVar: colorVar("warn") };
  if (ratio <= 150000) return { label: "Desproporcionado", colorVar: "var(--accent)" };
  return { label: "Muy desproporcionado", colorVar: colorVar("fail") };
}

function motivoCuelloDeBotella(ep) {
  if (ep.errorTypeLabel) return "Error rate elevado (" + ep.errorLabel + ep.errorTypeLabel + ")";
  if (ep.isFail) return "Error rate elevado (" + ep.errorLabel + ")";
  if (ep.patternLabel === "EPISÓDICO" && ep.cacheFriaHint) return "Picos de latencia aislados (máx " + ep.maxLabel + " vs p95 " + ep.p95Label + "), y la primera pegada en frío también fue lenta";
  if (ep.patternLabel === "EPISÓDICO") return "Picos de latencia aislados (máx " + ep.maxLabel + " vs p95 " + ep.p95Label + ")";
  if (ep.isWarn) return "Pérdida de iteraciones bajo carga (" + ep.droppedLabel + ")";
  if (ep.apdexScore != null && ep.apdexScore < 0.85) return "Satisfacción baja (Apdex " + ep.apdexLabel + ")";
  return ep.usoLimiteLabel ? "p95 " + ep.p95Label + ", " + ep.usoLimiteLabel : "p95 " + ep.p95Label;
}

// El nombre real es "recurso/metodo" (ej. "bonds/get-bond-by-uuid"). Mostrar solo el metodo
// evita repetir el recurso en cada tarjeta/chip - el recurso ya se elige aparte, con los
// chips "Por API".
function resourceOf(name) {
  const i = name.indexOf("/");
  return i === -1 ? name : name.slice(0, i);
}
function methodOf(name) {
  const i = name.indexOf("/");
  return i === -1 ? name : name.slice(i + 1);
}
const RESOURCES = Array.from(new Set(RAW_NAMES.map(resourceOf))).sort();

// Tier por NOMBRE real, no por posicion en la lista: asi appraiser/bond-payment-forecasts/
// bond-screener (los unicos endpoints de calculo JSON-RPC del catalogo real) siempre caen en
// "calc", y yield-curves/get-yield-curve-metrics-by-uuid (el unico con variabilidad ya
// documentada, H-016/H-017) siempre cae en "lowtps" - sin esto, el resumen ejecutivo puede
// terminar describiendo un endpoint que el propio dataset no generó así.
function tierFor(name) {
  if (name.indexOf("appraiser/") === 0 || name.indexOf("bond-payment-forecasts/") === 0 || name.indexOf("bond-screener/") === 0) {
    return "calc";
  }
  if (name === "yield-curves/get-yield-curve-metrics-by-uuid") return "lowtps";
  if (name.indexOf("/get-all-") !== -1) return "catalog";
  return "detail";
}

// Una fila por endpoint con lo medido. Los campos que salen de samples.csv.gz (fases, payload,
// Apdex, tipo de error) quedan en null en una corrida sin CSV.
function buildRawDataset() {
  return GS32.endpoints.map((e) => ({ ...e, name: e.slug, tier: tierFor(e.slug), tps: e.tasa, throughput: e.tps, errorRate: e.errorPct }));
}

// ---- Geometria de graficos (SVG en linea, sin libreria) ----------------------------------

function xAt(i, n, w) { return n === 1 ? 0 : (i / (n - 1)) * w; }

function chartGeom(values, w, h, padT, padB) {
  const n = values.length;
  const lo = Math.min.apply(null, values);
  const hi = Math.max.apply(null, values);
  const range = (hi - lo) || 1;
  const innerH = h - padT - padB;
  const pts = values.map((v, i) => [xAt(i, n, w), padT + innerH * (1 - (v - lo) / range)]);
  const points = pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const areaPoints = points + " " + pts[pts.length - 1][0].toFixed(1) + "," + (h - padB).toFixed(1) + " 0.0," + (h - padB).toFixed(1);
  return { points: points, areaPoints: areaPoints, lo: lo, hi: hi, last: values[values.length - 1], pts: pts, values: values, n: n };
}

// Misma escala para varias series del mismo grafico (ej. p95 y p50, o hasta 10 endpoints
// comparados), para que las lineas sean comparables entre si.
function chartGeomShared(seriesList, w, h, padT, padB) {
  const all = [].concat.apply([], seriesList);
  const lo = Math.min.apply(null, all);
  const hi = Math.max.apply(null, all);
  const range = (hi - lo) || 1;
  const innerH = h - padT - padB;
  return seriesList.map((values) => {
    const n = values.length;
    const pts = values.map((v, i) => [xAt(i, n, w), padT + innerH * (1 - (v - lo) / range)]);
    const points = pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    return { points: points, last: values[values.length - 1], pts: pts, values: values, n: n };
  });
}

// Escala estándar del Apdex (la que pasó Carlos, 2026-10-02). El puntaje lo calcula
// scripts/gs32/informe-html.mjs de las muestras crudas, con T = 500 ms y F = 1500 ms universales.
function apdexBand(score) {
  if (score >= 0.94) return { label: "Excelente", varName: "var(--ok)" };
  if (score >= 0.85) return { label: "Bueno", varName: "var(--ok)" };
  if (score >= 0.70) return { label: "Regular", varName: "var(--warn)" };
  if (score >= 0.50) return { label: "Pobre", varName: "var(--fail)" };
  return { label: "Inaceptable", varName: "var(--fail)" };
}

// Igual que chartGeom, pero el dominio (lo/hi) se calcula incluyendo un techo estático (ej. el
// maxVUs del profile) aunque ningún punto de la serie lo alcance todavía - así la línea de techo
// siempre entra en el viewBox en vez de quedar recortada o, peor, fuera de la vista visible.
function chartGeomWithCeiling(values, ceiling, w, h, padT, padB) {
  const domainValues = ceiling != null ? values.concat([ceiling]) : values;
  const lo = Math.min.apply(null, domainValues);
  const hi = Math.max.apply(null, domainValues);
  const range = (hi - lo) || 1;
  const innerH = h - padT - padB;
  const n = values.length;
  const pts = values.map((v, i) => [xAt(i, n, w), padT + innerH * (1 - (v - lo) / range)]);
  const points = pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const areaPoints = points + " " + pts[pts.length - 1][0].toFixed(1) + "," + (h - padB).toFixed(1) + " 0.0," + (h - padB).toFixed(1);
  const yFor = (v) => (padT + innerH * (1 - (v - lo) / range)).toFixed(1);
  return { points: points, areaPoints: areaPoints, lo: lo, hi: hi, last: values[values.length - 1], pts: pts, values: values, n: n, yFor: yFor };
}

// Bandas invisibles de hover: una por punto de la serie, a lo ancho de todo el grafico. Al
// pasar el mouse por cualquier tramo de la linea, dispara el punto mas cercano en el tiempo.
function buildBands(n, w, h, chartKey, enterFn) {
  const bw = w / n;
  const bands = [];
  for (let i = 0; i < n; i++) {
    bands.push({ x: (i * bw).toFixed(1), w: bw.toFixed(1), onEnter: enterFn(chartKey, i) });
  }
  return bands;
}

function timeLabel(i, n, totalSeconds) {
  const s = Math.round((i / (n - 1)) * totalSeconds);
  const m = Math.floor(s / 60);
  const ss = s % 60;
  return m + ":" + String(ss).padStart(2, "0");
}

// Ventana de la corrida actual, derivada de RUN_WINDOW_SECONDS - una sola fuente para el tag del
// encabezado, el KPI y el subtítulo de "Panel general" (antes "5 min" tipeado en los 3 lugares).
function windowDurationLabel(seconds) {
  if (seconds % 3600 === 0) return (seconds / 3600) + " h";
  return Math.round(seconds / 60) + " min";
}
function windowRangeLabel(startHH, startMM, seconds) {
  const endTotalMin = startHH * 60 + startMM + Math.round(seconds / 60);
  const endHH = Math.floor(endTotalMin / 60) % 24;
  const endMM = endTotalMin % 60;
  return String(startHH).padStart(2, "0") + ":" + String(startMM).padStart(2, "0") + "–" +
    String(endHH).padStart(2, "0") + ":" + String(endMM).padStart(2, "0");
}
function msLabel(v) { return v == null ? "s/d" : Math.round(v).toLocaleString("es-AR") + " ms"; }
function pctLabel(v) { return v == null ? "s/d" : v.toFixed(2) + "%"; }
function itsLabel(v) { return v == null ? "s/d" : v.toFixed(2) + " it/s"; }
function vusLabel(v) { return Math.round(v) + " VUs"; }
function kbLabel(v) { return Math.round(v) + " KB/s"; }

// ---- Serie de la corrida completa (panel general) ----------------------------------------
const OVERVIEW_POINTS = GS32.serie.length;
const OVERVIEW_SECONDS = RUN_WINDOW_SECONDS;
// Techo de VUs = vus_max de k6 (los VUs asignados a todos los scenarios): cuánto margen queda
// antes de que k6 no pueda sostener la tasa.

// Serie real del dashboard nativo de k6 (un punto por tramo de GS32.bucketSeg segundos). Es
// AGREGADA: mezcla todos los endpoints y mide cada request HTTP, no la iteración.

// ---- Serie de UN endpoint durante la corrida (usada por el panel "Por endpoint") ---------
// Reusa la entrada ya calibrada (p95/p50/tps/errorRate/max) y le agrega una trayectoria en el
// tiempo: arranque frio, un pico si ese endpoint ya tiene spikeLevel alto, y un bache de error
// solo si errorRate > 0 - nunca inventa un endpoint fallando que el dataset agregado no tiene.
const ENDPOINT_SECONDS = RUN_WINDOW_SECONDS;

// Serie de UN endpoint en el tiempo, de samples.csv.gz (tramos de GS32.bucketSeg segundos). null
// si la corrida no tiene CSV: k6 solo exporta en el tiempo las métricas sin tags.
function buildEndpointTimeline(entry) {
  return GS32.porEndpointSerie ? GS32.porEndpointSerie[entry.name] || null : null;
}

// ============================================================================
// Comparativa entre corridas y versiones: filas REALES de metrics/gs32/ con la misma clave de
// baseline que esta corrida (endpoint::ambiente::tipo::nivel[::pool]). baseline_global/version y
// sus deltas los calcula scripts/gs32/api-baseline-core.mjs (el motor real) en el generador;
// regressionPct y baselineOwn/deltaOwnPct los agrega el generador sobre esas mismas filas.
// ============================================================================
const HIST = GS32.historico;
const HISTORICO_VERSIONS = Array.from(new Set(HIST.runs.filter((r) => !r.escenario).map((r) => r.version)));
const HISTORICO_VERSION_ACTUAL = HISTORICO_VERSIONS[HISTORICO_VERSIONS.length - 1] || null;
const HISTORICO_VERSION_ANTERIOR = HISTORICO_VERSIONS.length > 1 ? HISTORICO_VERSIONS[HISTORICO_VERSIONS.length - 2] : null;
function versionIdx(v) { return HISTORICO_VERSIONS.indexOf(v); }
const ESCENARIOS_DEF = Array.from(new Set(HIST.runs.filter((r) => r.escenario).map((r) => r.escenario))).map((nombre) => ({ nombre }));
// Corridas mínimas con la misma clave para mostrar tendencia/comparativa: con 1 no hay contra qué.
const HIST_MIN_CORRIDAS = 2;

// ---- Motor de baseline: espejo de scripts/lib/api-baseline-core.mjs --------------------
const HIST_WARNING_DELTA_PCT = 50;
const HIST_CRITICAL_DELTA_PCT = 100;
const HIST_OUTLIER_MULTIPLIER = 3;

function mediaHist(valores) {
  return valores.length ? valores.reduce((a, b) => a + b, 0) / valores.length : null;
}

function estadoDesdeDeltaHist(deltaPct) {
  if (deltaPct === null || deltaPct === undefined) return null;
  if (deltaPct > HIST_CRITICAL_DELTA_PCT) return 'CRITICAL';
  if (deltaPct > HIST_WARNING_DELTA_PCT) return 'warning';
  if (deltaPct < -HIST_WARNING_DELTA_PCT) return 'mejora';
  return 'ok';
}

function deltaLabel(pct) {
  if (pct === null || pct === undefined) return '-';
  return (pct > 0 ? '+' : '') + pct.toFixed(1) + '%';
}

function colorVarFromEstado(estado) {
  if (estado === 'CRITICAL') return colorVar('fail');
  if (estado === 'warning') return colorVar('warn');
  if (estado === 'mejora') return colorVar('ok');
  return 'var(--text-dim)';
}

// Umbral de COLOR (no de "hallazgo notable"): mismo criterio que xPctHtml en
// cross-suite.browser.js de pepper-API-testing (±15%) - deliberadamente mas laxo que
// SCN_DEGRADED_PCT/SCN_IMPROVED_PCT (50%/-30%, ver escenarioFindings), que clasifican que ENTRA
// a "hallazgos". Para la tabla comparativa completa de Escenarios, pepper pinta cualquier delta
// moderado (15%+), no solo los que llegan a "notable" - por eso NO se reusa
// colorVarFromEstado(estadoDesdeDeltaHist(...)) acá, que usa el umbral del Semáforo (50/100%).
function colorVarFromPctSimple(pct) {
  if (pct == null) return 'var(--text-dim)';
  if (pct <= -15) return colorVar('ok');
  if (pct >= 15) return colorVar('fail');
  return 'var(--text-dim)';
}

function shortNameHist(endpoint) {
  return methodOf(endpoint);
}

// ---- Deteccion de anomalias por endpoint: pedido explicito de Carlos ("es posible?") ----------
// SI es posible, y sin inventar un metodo estadistico nuevo: reusa el `estado` que
// calcularBaselinesHistoricos ya calcula para CADA corrida (warning/CRITICAL/mejora/ok, contra el
// baseline_global de ese mismo endpoint) y solo lo RESUME, agrupando corridas consecutivas con la
// misma direccion:
//   - PICO AISLADO: una corrida en warning/CRITICAL/mejora con las corridas vecinas en 'ok' - un
//     valor puntual que no se repite.
//   - CAMBIO SOSTENIDO: 2 o mas corridas SEGUIDAS en la misma direccion - mismo concepto de
//     "persistencia" que ya usa scripts/lib/baseline-core.mjs para escalar de warning a critical
//     (un pico solo nunca alcanza, hace falta que se repita), aplicado acá para distinguir ruido
//     de un cambio real que arranca en una corrida/version puntual.
// Como baseline_global se ADAPTA al nivel de cada endpoint (ver la limitacion ya documentada en
// buildScorecard), un cambio sostenido largo (ej. bond-groups, cronico desde hace 3 versiones)
// va a aparecer con una duracion CORTA acá (1-3 corridas): el detector marca el ARRANQUE del
// cambio, no todo el tiempo que dura - es la señal correcta para contestar "¿desde cuando viene
// pasando esto?", no un conteo de cuanto tiempo lleva.
function directionDeEstado(estado) {
  if (estado === 'warning' || estado === 'CRITICAL') return 'degradacion';
  if (estado === 'mejora') return 'mejora';
  return null;
}

function detectarAnomaliasHistoricas(rows) {
  // rows: filas de UN endpoint, en orden cronologico, SIN la corrida de escenario (que tiene su
  // propio arbol de comparacion y no participa de "cuando empezo a cambiar la tendencia normal").
  const picos = [];
  const cambios = [];
  let i = 0;
  while (i < rows.length) {
    const dir = directionDeEstado(rows[i].estado);
    if (!dir) { i++; continue; }
    let j = i;
    while (j + 1 < rows.length && directionDeEstado(rows[j + 1].estado) === dir) j++;
    const largo = j - i + 1;
    const item = {
      fecha: rows[i].fecha,
      hora: rows[i].hora,
      version: rows[i].version,
      tipo: dir,
      deltaLabel: deltaLabel(rows[i].deltaGlobalPct),
      largo,
    };
    if (largo === 1) picos.push(item);
    else cambios.push(item);
    i = j + 1;
  }
  return { picos, cambios };
}

// ---- Scorecard de version: MISMA formula que extract-for-ai.js de pepper-API-testing ----
function buildScorecard(filasConBaseline) {
  const filasActual = filasConBaseline.filter((f) => f.version === HISTORICO_VERSION_ACTUAL && !f.escenario);
  const filasAnterior = filasConBaseline.filter((f) => f.version === HISTORICO_VERSION_ANTERIOR && !f.escenario);
  const avgActual = mediaHist(filasActual.map((f) => f.p95));
  const avgAnterior = mediaHist(filasAnterior.map((f) => f.p95));
  // Con una sola versión en la historia no hay veredicto de versión: se dice, no se inventa un 0%.
  if (avgAnterior == null) {
    return { avgActual, avgAnterior, globalDeltaPct: null, resolved: [], news: [], verdict: { label: 'Sin versión anterior', emoji: '➖', colorVar: 'var(--text-dim)' } };
  }
  const globalDeltaPct = ((avgActual - avgAnterior) / avgAnterior) * 100;

  const resolved = [];
  const news = [];
  RAW_NAMES.forEach((ep) => {
    const rowsActual = filasActual.filter((f) => f.endpoint === ep);
    const rowsAnterior = filasAnterior.filter((f) => f.endpoint === ep);
    const pActual = mediaHist(rowsActual.map((f) => f.p95));
    const pAnterior = mediaHist(rowsAnterior.map((f) => f.p95));
    if (pActual == null || pAnterior == null) return;
    const deltaPct = ((pActual - pAnterior) / pAnterior) * 100;
    // "Resuelto" en pepper exige ADEMAS ser cronico (outlierRecurrenceMap >= 5 corridas como
    // outlier historico) - sin eso, cualquier mejora grande contaria como "problema resuelto".
    // Ese contador NO es portable acá con solo ~10 corridas sinteticas: nuestro baseline_global
    // se ADAPTA al nivel de cada endpoint (igual que el real), asi que un endpoint sostenido en
    // un nivel malo desde siempre NUNCA dispara warning contra SU PROPIO baseline - el gate de
    // "cronico" nunca se cumpliria aunque el endpoint sea justo el caso que se quiere destacar.
    // Simplificado a proposito a "mejora >=50%", documentado como limitacion explicita (no
    // fingiendo un contador de recurrencia que no se puede calcular bien con esta escala de datos).
    const estaAhoraEnAlerta = rowsActual.some((f) => f.estado === 'warning' || f.estado === 'CRITICAL');
    if (deltaPct <= -50) resolved.push({ name: shortNameHist(ep), resource: resourceOf(ep), delta: deltaLabel(deltaPct), deltaRaw: deltaPct });
    if (deltaPct >= 50 && estaAhoraEnAlerta) news.push({ name: shortNameHist(ep), resource: resourceOf(ep), delta: deltaLabel(deltaPct), deltaRaw: deltaPct });
  });
  // Ordenados por magnitud (la mejora mas grande primero, la regresion mas grande primero): asi
  // el resumen ejecutivo en lenguaje llano puede citar "el peor"/"el mejor" sin tener que buscarlo
  // aparte - son las mismas listas que ya mostraba el Scorecard, solo ordenadas.
  resolved.sort((a, b) => a.deltaRaw - b.deltaRaw);
  news.sort((a, b) => b.deltaRaw - a.deltaRaw);

  let verdict;
  if (globalDeltaPct < -20 && news.length === 0) verdict = { label: 'Excelente', emoji: '🎉', colorVar: 'var(--ok)' };
  else if (globalDeltaPct < -10 && news.length <= 1) verdict = { label: 'Positiva', emoji: '👍', colorVar: 'var(--ok)' };
  else if (globalDeltaPct < 0 && news.length <= 2) verdict = { label: 'Aceptable', emoji: '🙂', colorVar: 'var(--accent2)' };
  else if (globalDeltaPct < 0 && news.length >= 3) verdict = { label: 'Mixta', emoji: '⚠️', colorVar: 'var(--warn)' };
  else if (globalDeltaPct > 10 || news.length >= 3) verdict = { label: 'Problemática', emoji: '🔴', colorVar: 'var(--fail)' };
  else verdict = { label: 'Neutral', emoji: '➖', colorVar: 'var(--text-dim)' };

  return { avgActual, avgAnterior, globalDeltaPct, resolved, news, verdict };
}

// Dataset + baseline: se computan UNA vez por render y se comparten entre buildHistoricoViewModel
// (los 5 paneles agregados) y el panel-inspector por endpoint (que necesita las mismas filas).
function buildHistoricoRawAndBaseline() {
  return { filas: HIST.filas, conBaseline: HIST.filas, runs: HIST.runs };
}

const VERSION_COLOR_PALETTE = ['var(--text-faint)', 'var(--text-dim)', 'var(--confound)', 'var(--accent)', 'var(--accent2)'];
function versionColorFor(v) {
  return VERSION_COLOR_PALETTE[Math.min(versionIdx(v), VERSION_COLOR_PALETTE.length - 1)];
}

// ---- Escenarios: catalogo + detalle + comparar-contra-otro-escenario -----------------------
// Porte de scripts/report-assets/scenarios.browser.js (pepper-API-testing, el tab "Escenarios"
// real del informe HTML), a pedido explicito de Carlos (2026-09-18: "réplica más completa de
// pepper") tras confirmar que la v26 (1 sola corrida de escenario, sin catalogo ni comparacion)
// se quedaba corta. Umbrales EXACTOS del archivo real, no inventados: SCN_DEGRADED_PCT=50,
// SCN_IMPROVED_PCT=-30, SCN_MIN_ABS_MS=200 (piso absoluto para no contar como "degradado" un
// catalogo que pasa de 30ms a 46ms - 53% pero 16ms, ruido) y el corte de "generalizada" en
// max(3, 15% de los medidos). "dNormal" de pepper = nuestro deltaGlobalPct de una fila de
// escenario (contra el baseline normal del endpoint); "dOwn" = deltaOwnPct (contra el promedio de
// las corridas ANTERIORES de ESE MISMO escenario, ver calcularBaselinesHistoricos).
const SCN_DEGRADED_PCT = 50;
const SCN_IMPROVED_PCT = -30;
// El piso real de pepper (200ms) esta calibrado para SU escala de latencias, no la de GS32: acá el
// tier catálogo mide 30-130ms de base (ver baseP95HistoricoFor), asi que 200ms apagaria el piso
// para ese tier entero - nunca ningun cambio de catálogo lo cruzaria, ni siquiera uno real. 20ms
// es el techo aproximado del jitter de fondo en ese tier (jitterAmplitudeHistorico llega a 40% de
// la base, ~12-52ms en catálogo) - filtra ruido sin taparse la mejora real que el escenario de
// caché busca mostrar. Recalibrado a la escala propia, no un numero universal (ver CLAUDE.md).
const SCN_MIN_ABS_MS = 20;
const SCN_OWN_TREND_PCT = 15;

function buildEscenariosCatalogo(conBaseline) {
  const porNombre = new Map();
  conBaseline.forEach((f) => {
    if (!f.escenario) return;
    if (!porNombre.has(f.escenario)) porNombre.set(f.escenario, []);
    porNombre.get(f.escenario).push(f);
  });

  return ESCENARIOS_DEF.map((def) => {
    const filas = porNombre.get(def.nombre) || [];
    const corridas = [];
    const vistos = new Set();
    filas.forEach((f) => {
      if (vistos.has(f.timestamp)) return;
      vistos.add(f.timestamp);
      corridas.push({ runId: f.timestamp, fecha: f.fecha, hora: f.hora, version: f.version });
    });
    const ultimaCorridaId = corridas.length ? corridas[corridas.length - 1].runId : null;
    // "endpointsLast" = la fila de CADA endpoint en la ULTIMA corrida de este escenario - la foto
    // vigente para el catalogo/comparaciones, mismo recorte que ctx.endpoints[...].last en
    // report-scenarios.js (no toda la serie, que no hace falta para esto).
    const endpointsLast = new Map();
    filas.forEach((f) => {
      if (f.timestamp !== ultimaCorridaId) return;
      endpointsLast.set(f.endpoint, f);
    });
    return {
      nombre: def.nombre,
      corridas,
      corridasCount: corridas.length,
      primeraFecha: corridas.length ? corridas[0].fecha : null,
      ultimaFecha: corridas.length ? corridas[corridas.length - 1].fecha : null,
      ultimaVersion: corridas.length ? corridas[corridas.length - 1].version : null,
      endpointsLast,
    };
  });
}

function escenarioFindings(ctx) {
  const eps = [];
  ctx.endpointsLast.forEach((f, endpoint) => {
    if (f.baselineGlobal == null || f.deltaGlobalPct == null) return;
    eps.push({ endpoint, f, absDiff: Math.abs(f.p95 - f.baselineGlobal) });
  });
  const degraded = eps.filter((e) => e.f.deltaGlobalPct >= SCN_DEGRADED_PCT && e.absDiff >= SCN_MIN_ABS_MS)
    .sort((a, b) => b.f.deltaGlobalPct - a.f.deltaGlobalPct);
  const improved = eps.filter((e) => e.f.deltaGlobalPct <= SCN_IMPROVED_PCT && e.absDiff >= SCN_MIN_ABS_MS)
    .sort((a, b) => a.f.deltaGlobalPct - b.f.deltaGlobalPct);
  return { measured: eps.length, degraded, improved };
}

function escenarioOwnTrendNote(ctx) {
  if (ctx.corridasCount <= 1) return '';
  const eps = [];
  ctx.endpointsLast.forEach((f) => { if (f.baselineOwn != null && f.deltaOwnPct != null) eps.push(f); });
  if (!eps.length) return '';
  const worsening = eps.filter((f) => f.deltaOwnPct >= SCN_OWN_TREND_PCT).length;
  const improving = eps.filter((f) => f.deltaOwnPct <= -SCN_OWN_TREND_PCT).length;
  if (worsening > improving && worsening > 0) {
    return ' Comparado con sus propias corridas anteriores, la tendencia empeora en ' + worsening + ' endpoint' + (worsening === 1 ? '' : 's') + ' — este escenario se está poniendo más lento con el tiempo, no es un pico aislado.';
  }
  if (improving > worsening && improving > 0) {
    return ' Comparado con sus propias corridas anteriores, la tendencia mejora en ' + improving + ' endpoint' + (improving === 1 ? '' : 's') + ' — el impacto se está disipando.';
  }
  return '';
}

function escenarioNarrativa(ctx, findings) {
  let texto;
  if (!findings.degraded.length && !findings.improved.length) {
    texto = 'No muestra cambios notables frente al baseline normal — sus ' + findings.measured + ' endpoints medidos se comportan dentro de lo esperado.';
  } else if (findings.degraded.length) {
    const generalizada = findings.degraded.length >= Math.max(3, Math.round(findings.measured * 0.15));
    const worst = findings.degraded[0];
    texto = 'Muestra ' + (generalizada ? 'degradación generalizada' : 'degradación puntual') + ' frente al baseline normal — ' +
      findings.degraded.length + ' de ' + findings.measured + ' endpoints superan +' + SCN_DEGRADED_PCT + '%. El peor caso, ' +
      shortNameHist(worst.endpoint) + ', pasa de ' + msLabel(worst.f.baselineGlobal) + ' a ' + msLabel(worst.f.p95) + ' (' + deltaLabel(worst.f.deltaGlobalPct) + ').';
  } else {
    const best = findings.improved[0];
    texto = 'Muestra mejoras notables sin degradación frente al baseline normal — ' +
      findings.improved.length + ' de ' + findings.measured + ' endpoints mejoran más de ' + Math.abs(SCN_IMPROVED_PCT) + '%. El mejor caso, ' +
      shortNameHist(best.endpoint) + ', pasa de ' + msLabel(best.f.baselineGlobal) + ' a ' + msLabel(best.f.p95) + ' (' + deltaLabel(best.f.deltaGlobalPct) + ').';
  }
  texto += escenarioOwnTrendNote(ctx);
  return texto;
}

function escenarioCompararFilas(ctxA, ctxB) {
  const rows = [];
  ctxA.endpointsLast.forEach((fa, endpoint) => {
    const fb = ctxB.endpointsLast.get(endpoint);
    if (!fb) return;
    const delta = fa.p95 ? ((fb.p95 - fa.p95) / fa.p95) * 100 : null;
    rows.push({ endpoint, fa, fb, delta });
  });
  rows.sort((x, y) => Math.abs(y.delta == null ? -1 : y.delta) - Math.abs(x.delta == null ? -1 : x.delta));
  return rows;
}

const PATRON_TOP_N = 10;

// Tendencia con Kendall: la calcula scripts/gs32/informe-html.mjs (p exacto), acá solo se
// muestra. tau sin la magnitud engaña, así que van juntos.
function tendenciaDe(ep) {
  const t = (HIST.tendencia || {})[ep];
  if (!t || t.estado === 'n insuficiente') {
    return { tendLabel: 'n insuficiente', tendDetalle: (t ? t.n : 0) + ' de ' + (HIST.tendenciaMinN || 5) + ' corridas', tendColorVar: 'var(--text-faint)' };
  }
  const cambio = t.cambioPct === null ? '' : (t.cambioPct >= 0 ? '+' : '') + t.cambioPct.toFixed(0) + '% · ';
  return {
    tendLabel: t.estado === 'sube' ? '▲ sube · VIGILAR' : t.estado === 'baja' ? '▼ baja' : 'sin tendencia',
    tendDetalle: cambio + 'τ ' + t.tau.toFixed(2) + ' · p ' + t.p.toFixed(3) + ' · n ' + t.n,
    tendColorVar: t.estado === 'sube' ? colorVar('fail') : t.estado === 'baja' ? colorVar('ok') : 'var(--text-dim)',
  };
}

function buildHistoricoViewModel(conBaseline, runs, patronMode) {
  // ---- Scorecard ----
  const sc = buildScorecard(conBaseline);
  const verdictBgVarOf = (v) => 'color-mix(in oklch, ' + v + ' 16%, var(--bg-elevated))';

  // ---- Tendencia: ULTIMAS 10 corridas (recorte pedido por Carlos - las 21/37 barras en una
  // sola card quedaban ilegibles). El armado de las barras con hover vive en renderVals() (abajo,
  // en la clase Component), porque necesita el estado de hover - acá solo se prepara el DATO.
  const runsRecientes = runs.slice(-10);
  const runAverages = runsRecientes.map((run) => {
    const rows = conBaseline.filter((f) => f.timestamp === run.runId);
    return { run, avg: mediaHist(rows.map((f) => f.p95)) };
  });
  // "Hoy" = la ultima corrida NORMAL de TODA la historia (no solo de las ultimas 10, y no la de
  // escenario) - antes esto era un runId hardcodeado ('run-9'), roto apenas se agrego mas
  // historia. Se busca dinamicamente para no repetir ese bug.
  const runsNormales = runs.filter((r) => !r.escenario);
  const runHoy = runsNormales[runsNormales.length - 1];
  const filasHoy = conBaseline.filter((f) => f.timestamp === runHoy.runId);
  const baselinePromedio = mediaHist(filasHoy.map((f) => f.baselineGlobal).filter((v) => v !== null));

  // ---- Evolucion por version: ULTIMAS 10 versiones (mismo recorte, mismo motivo) ----
  const versionesRecientes = HISTORICO_VERSIONS.slice(-10);
  const maxVersionAvg = Math.max.apply(null, versionesRecientes.map((v) => mediaHist(conBaseline.filter((f) => f.version === v && !f.escenario).map((f) => f.p95))));
  const versionRows = versionesRecientes.map((v) => {
    const rows = conBaseline.filter((f) => f.version === v && !f.escenario);
    const avg = mediaHist(rows.map((f) => f.p95));
    const runCount = new Set(rows.map((f) => f.timestamp)).size;
    return {
      label: v + ' (×' + runCount + ')',
      widthPct: (avg / maxVersionAvg) * 100,
      valueLabel: msLabel(avg),
      extraClass: v === HISTORICO_VERSION_ACTUAL ? 'actual' : '',
    };
  });

  // ---- Semaforo: solo los endpoints EN ALERTA de la corrida mas reciente ----
  const semaforoRows = filasHoy
    .filter((f) => f.estado === 'warning' || f.estado === 'CRITICAL')
    .sort((a, b) => (b.deltaGlobalPct || 0) - (a.deltaGlobalPct || 0))
    .map((f) => {
      // Outlier: MISMO umbral (p95 > 3x baseline_global) que el panel real "Outliers" del
      // dashboard de Grafana de pepper-API-testing (verificado contra generate-metrics.js:
      // OUTLIER_MULTIPLIER = 3) - y el MISMO numero que ya usa HIST_OUTLIER_MULTIPLIER acá arriba
      // para limpiar el baseline, asi que no es un umbral nuevo, es reusar el mismo criterio con
      // otro proposito (marcar la fila, no descartarla del promedio).
      const outlierRatio = f.baselineGlobal ? f.p95 / f.baselineGlobal : null;
      const isOutlier = outlierRatio !== null && outlierRatio > HIST_OUTLIER_MULTIPLIER;
      return {
        name: shortNameHist(f.endpoint),
        resource: resourceOf(f.endpoint),
        p95Label: msLabel(f.p95),
        baselineLabel: f.baselineGlobal ? msLabel(f.baselineGlobal) : '-',
        deltaGlobalLabel: deltaLabel(f.deltaGlobalPct),
        deltaGlobalColorVar: colorVarFromEstado(f.estado),
        deltaVersionLabel: deltaLabel(f.deltaVersionPct),
        deltaVersionColorVar: colorVarFromEstado(estadoDesdeDeltaHist(f.deltaVersionPct)),
        regressionLabel: deltaLabel(f.regressionPct),
        regressionColorVar: colorVarFromEstado(estadoDesdeDeltaHist(f.regressionPct)),
        dotColorVar: colorVarFromEstado(f.estado),
        isOutlier,
        outlierRatioLabel: outlierRatio !== null ? outlierRatio.toFixed(1) + 'x' : '-',
      };
    });

  // ---- Endpoints Stability Score (bonus, hallado revisando el dashboard real de Grafana):
  // MISMA formula que el panel real homonimo - ratio = p95 actual / baseline_global, MISMOS
  // umbrales (verificado contra generate-metrics.js). Es el MISMO dato que ya muestra "Δ Global"
