  // en el Semaforo de arriba, solo expresado como ratio en vez de porcentaje (ratio = 1 +
  // deltaGlobalPct/100) - se agrega como ranking visual aparte porque el dashboard real lo separa
  // asi, no porque sea un calculo distinto.
  const stabilityRows = filasHoy
    .filter((f) => f.baselineGlobal)
    .map((f) => ({ name: shortNameHist(f.endpoint), ratio: f.p95 / f.baselineGlobal }))
    .sort((a, b) => b.ratio - a.ratio)
    .slice(0, 10)
    .map((r) => ({
      name: r.name,
      ratioLabel: r.ratio.toFixed(2) + 'x',
      widthPct: Math.min(100, (r.ratio / 5) * 100),
      colorVar: r.ratio <= 1.5 ? colorVar('ok') : r.ratio <= 3 ? colorVar('warn') : r.ratio <= 5 ? 'var(--accent)' : colorVar('fail'),
    }));

  // ---- Distribucion historica / patron (CV), MISMA formula que extract-for-ai.js ----
  // Sobre TODOS los 45 endpoints (antes 9), ordenados por CV descendente - con esta escala hace
  // falta el filtro Top-10/Todos que pidio Carlos, igual criterio que "Top 10 (peor p95)" ya
  // usado en la seccion "Por endpoint".
  const patronAll = RAW_NAMES.map((ep) => {
    const valores = conBaseline.filter((f) => f.endpoint === ep && !f.escenario).map((f) => f.p95);
    const mean = mediaHist(valores);
    const variance = mediaHist(valores.map((v) => Math.pow(v - mean, 2)));
    const stddev = Math.sqrt(variance);
    const cv = mean > 0 ? stddev / mean : 0;
    const outlierCount = valores.filter((v) => v > mean * 3).length;
    const outlierPct = outlierCount / valores.length;
    let patronLabel, colorVar_;
    if (outlierPct >= 0.3) { patronLabel = 'BIMODAL'; colorVar_ = colorVar('fail'); }
    else if (outlierPct >= 0.1 || (outlierCount >= 3 && cv > 0.5)) { patronLabel = 'EPISÓDICO'; colorVar_ = colorVar('warn'); }
    else if (cv < 0.25) { patronLabel = 'CONSISTENTE'; colorVar_ = colorVar('ok'); }
    else { patronLabel = 'VARIABLE'; colorVar_ = 'var(--accent2)'; }
    // El badge de caché fría de la historia sale del frío MEDIDO (preflight) de la última corrida,
    // no de suponer por el tipo de endpoint.
    const cacheFriaHint = !!(GS32.endpoints.find((x) => x.slug === ep) || {}).frioMuyLento;
    return {
      name: shortNameHist(ep),
      resource: resourceOf(ep),
      cvRaw: cv,
      patronLabel,
      colorVar: colorVar_,
      bgVar: 'color-mix(in oklch, ' + colorVar_ + ' 16%, transparent)',
      corridas: valores.length,
      mediaLabel: msLabel(mean),
      cvLabel: cv.toFixed(2),
      cacheFriaHint,
      ...tendenciaDe(ep),
    };
  }).sort((a, b) => b.cvRaw - a.cvRaw);
  const patronRows = patronMode === 'all' ? patronAll : patronAll.slice(0, PATRON_TOP_N);

  const escenariosCount = runs.length - runsNormales.length;

  return {
    corridasCountLabel: runsNormales.length + ' corridas + ' + escenariosCount + ' de escenario',
    notaDatos: runsNormales.length + ' corridas reales de metrics/gs32/ con la clave de esta corrida (' + HIST.claveLabel + '). baseline_global y baseline_version salen de scripts/gs32/api-baseline-core.mjs, el mismo motor que usa el informe del smoke.' + (escenariosCount ? ' Incluye ' + escenariosCount + ' corridas de escenario, aisladas del baseline normal.' : ''),
    endpointsClaveCountLabel: String(RAW_NAMES.length),
    scorecard: {
      versionActual: HISTORICO_VERSION_ACTUAL,
      versionAnterior: HISTORICO_VERSION_ANTERIOR || "sin versión anterior",
      runsActual: new Set(conBaseline.filter((f) => f.version === HISTORICO_VERSION_ACTUAL && !f.escenario).map((f) => f.timestamp)).size,
      verdictLabel: sc.verdict.label,
      verdictEmoji: sc.verdict.emoji,
      verdictColorVar: sc.verdict.colorVar,
      verdictBgVar: verdictBgVarOf(sc.verdict.colorVar),
      globalDeltaLabel: deltaLabel(sc.globalDeltaPct),
      resolvedCount: sc.resolved.length,
      newCount: sc.news.length,
      hasResolved: sc.resolved.length > 0,
      hasNew: sc.news.length > 0,
      resolvedList: sc.resolved,
      newList: sc.news,
    },
    trend: {
      // El armado final (heightPct/hover/leyenda) lo hace renderVals(), que tiene el estado de
      // hover - acá solo viaja el dato ya recortado a las ultimas 10.
      runAverages,
      baselinePromedio,
      totalRunsCount: runsNormales.length,
    },
    versions: {
      count: versionesRecientes.length,
      totalCount: HISTORICO_VERSIONS.length,
      rows: versionRows,
    },
    semaforo: {
      rows: semaforoRows,
      hasRows: semaforoRows.length > 0,
      isEmpty: semaforoRows.length === 0,
      countLabel: semaforoRows.length + ' con alerta',
    },
    stability: {
      rows: stabilityRows,
      hasRows: stabilityRows.length > 0,
    },
    patron: {
      rows: patronRows,
      totalCount: patronAll.length,
      shownCount: patronRows.length,
    },
  };
}

// ---- Hallazgos / riesgos / salvedades: TODOS calculados de los datos de esta corrida. El mockup
// tenía estas listas escritas a mano para la historia sintética; acá cada ítem tiene una regla y
// solo aparece si la regla se cumple.
function construirInsights(decorated, raw, ov) {
  const hallazgo = [], riesgo = [], confound = [];
  const n = decorated.length;
  const alTps = decorated.filter((e) => e.throughputRaw / raw.find((r) => r.name === e.name).tps >= 0.95);
  hallazgo.push({ text: alTps.length + " de " + n + " endpoints sostuvieron al menos el 95% de su tasa objetivo." + (alTps.length < n ? " No llegaron: " + decorated.filter((e) => alTps.indexOf(e) === -1).map((e) => e.shortName).join(", ") + "." : "") });
  const conLim = raw.filter((e) => e.limite).map((e) => ({ e, uso: e.p95 / e.limite })).sort((a, b) => b.uso - a.uso);
  if (conLim.length) {
    const t = conLim[0];
    hallazgo.push({ text: "El más cerca de su límite es " + t.e.name + ": p95 " + msLabel(t.e.p95) + " sobre " + msLabel(t.e.limite) + " (" + Math.round(t.uso * 100) + "%)." + (conLim[1] ? " Le sigue " + methodOf(conLim[1].e.name) + " con " + Math.round(conLim[1].uso * 100) + "%." : "") });
  }
  const picos = decorated.filter((e) => e.patternLabel === "EPISÓDICO");
  if (picos.length) hallazgo.push({ text: picos.length + " endpoint" + (picos.length === 1 ? "" : "s") + " con un máximo de más del doble de su p95: " + picos.map((e) => e.shortName + " (" + e.maxLabel + " contra " + e.p95Label + ")").join(", ") + "." });
  const ter = Math.floor(ov.p99.length / 3);
  if (ter >= 2) {
    const med = (a) => a.reduce((x, y) => x + y, 0) / a.length;
    const a99 = med(ov.p99.slice(1, ter)), b99 = med(ov.p99.slice(-ter)), a95 = med(ov.p95.slice(1, ter)), b95 = med(ov.p95.slice(-ter));
    const d99 = ((b99 - a99) / a99) * 100, d95 = ((b95 - a95) / a95) * 100;
    if (Math.abs(d99) >= 20) hallazgo.push({ text: "La cola agregada " + (d99 > 0 ? "sube" : "baja") + " a lo largo de la corrida: el p99 por request pasa de " + msLabel(a99) + " a " + msLabel(b99) + " (" + deltaLabel(d99) + ") entre el primer y el último tercio, con el p95 en " + deltaLabel(d95) + ". Es una serie agregada: no dice qué endpoint la mueve." });
  }
  const conFases = decorated.filter((e) => e.phaseWaitPct != null);
  const noEspera = conFases.filter((e) => e.phaseWaitPct < 80);
  if (conFases.length && !noEspera.length) hallazgo.push({ text: "En los " + conFases.length + " endpoints la espera del servidor es más del 80% de las fases HTTP: el tiempo es del backend, no de la red ni de la descarga." });
  else if (noEspera.length) hallazgo.push({ text: noEspera.length + " endpoint" + (noEspera.length === 1 ? "" : "s") + " con red o descarga por encima del 20% de sus fases HTTP: " + noEspera.map((e) => e.shortName + " (espera " + e.phaseWaitPct + "%)").join(", ") + "." });

  decorated.filter((e) => e.isFail).forEach((e) => riesgo.push({ text: e.name + " tuvo " + e.errorLabel + " de requests con error" + e.errorTypeLabel + "." }));
  decorated.filter((e) => e.isWarn).forEach((e) => riesgo.push({ text: e.name + " descartó " + e.droppedLabel + " iteraciones: k6 no tuvo VUs libres para sostener la tasa." }));
  conLim.filter((x) => x.uso >= 0.8).forEach((x) => riesgo.push({ text: x.e.name + " usa el " + Math.round(x.uso * 100) + "% de su límite de p95." }));
  raw.filter((e) => e.frioMuyLento).forEach((e) => riesgo.push({ text: e.name + ": la primera pegada (en frío) tardó " + msLabel(e.frio.p50) + ", más de 5 veces su p95 en caliente (" + msLabel(e.p95) + ")" + (e.frio.n === 1 ? ", sobre 1 sola muestra." : ".") }));

  GS32.salvedades.forEach((t) => confound.push({ text: t }));
  const pocas = raw.filter((e) => e.iterations < 100);
  if (pocas.length) confound.push({ text: "Con menos de 100 iteraciones el p95 es poco robusto: " + pocas.map((e) => methodOf(e.name) + " (" + e.iterations + ")").join(", ") + "." });
  return { hallazgo, riesgo, confound };
}

function notaLatencia(ov) {
  const n = ov.p95.length;
  if (n < 3) return "Corrida demasiado corta para describir la forma de la serie.";
  const resto = ov.p95.slice(1);
  const medResto = resto.reduce((a, b) => a + b, 0) / resto.length;
  const primero = ov.p95[0];
  return "Serie agregada de todos los endpoints, por request HTTP (no por iteración). Primer tramo p95 " + msLabel(primero) +
    (primero > medResto * 1.3 ? ", más lento que el resto (" + msLabel(medResto) + " de promedio): el arranque." : ", en línea con el resto (" + msLabel(medResto) + " de promedio).") +
    " El p99 es el que calcula k6 por tramo, sobre muestras reales.";
}

function notaTransfer(decorated) {
  const con = decorated.filter((e) => e.receivedKB != null).sort((a, b) => b.receivedKB * b.iterations - a.receivedKB * a.iterations);
  if (!con.length) return "Bytes agregados de todos los endpoints. El detalle por endpoint necesita samples.csv.gz.";
  const tot = con.reduce((a, e) => a + e.receivedKB * e.iterations, 0) || 1;
  return "Más volumen recibido: " + con.slice(0, 3).map((e) => e.shortName + " (" + Math.round((e.receivedKB * e.iterations / tot) * 100) + "%)").join(", ") + ".";
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      viewMode: "top10",
      selectedNames: [],
      selectedResources: [],
      inspectedEndpoint: null,
      showFilterPanel: false,
      expandHallazgo: false,
      expandRiesgo: false,
      expandConfound: false,
      hover: { chart: null, index: null },
      // Comparativa entre corridas y versiones (2026-09-18, ampliada):
      patronMode: "top10",
      // null = el endpoint de peor p95 de esta corrida (ver renderVals).
      inspectorResource: null,
      inspectorEndpoint: null,
      // Escenarios (2026-09-18, réplica más completa de pepper-API-testing):
      escenarioSeleccionado: null, // null = el primero del catalogo (ver renderVals)
      escenarioComparar: null,
      escenarioTablaMode: "top10",
      escenarioDegExpand: false,
      escenarioMejExpand: false,
    };
  }

  renderVals() {
    const dark = this.props.darkMode ?? false;
    const theme = dark ? "dark" : "light";
    const state = this.state || {};
    const viewMode = state.viewMode || "top10";
    const selectedNames = state.selectedNames || [];
    const selectedResources = state.selectedResources || [];
    const hover = state.hover || { chart: null, index: null };

    const enterHover = (chartKey, i) => () => this.setState({ hover: { chart: chartKey, index: i } });
    const clearHover = () => this.setState({ hover: { chart: null, index: null } });
    const inspect = (name) => () => this.setState({ inspectedEndpoint: name });
    // Cambiar de API resetea la seleccion fina de endpoints: si no, un endpoint elegido bajo
    // "bonds" seguiria filtrando la grilla despues de pasar a "currencies", sin aparecer ya
    // en los chips visibles - una seleccion invisible e inconsistente con lo que se ve.
    const toggleResource = (name) => () => {
      const set = new Set(this.state.selectedResources || []);
      if (set.has(name)) set.delete(name);
      else set.add(name);
      this.setState({ selectedResources: Array.from(set), selectedNames: [] });
    };

    const raw = buildRawDataset();

    const decorated = raw.map((e) => {
      const achieved = Math.min(100, Math.round((e.throughput / e.tps) * 100));
      const spikeRatio = e.max / e.p95;
      const spikeLevel = spikeRatio >= 2 ? "fail" : spikeRatio >= 1.4 ? "warn" : "ok";
      const ringLevel = achieved >= 95 ? "ok" : achieved >= 80 ? "warn" : "fail";
      const hasFail = e.errorRate > 0;
      const hasWarn = e.dropped > 0;
      const status = hasFail ? "fail" : hasWarn ? "warn" : "pass";
      const p50Pct = Math.max(2, Math.round((e.p50 / e.max) * 100));
      const p95Pct = Math.max(4, Math.round((e.p95 / e.max) * 100));
      const p99Pct = e.p99 == null ? p95Pct : Math.max(5, Math.round((e.p99 / e.max) * 100));
      const circumference = 100.5;
      const tipoDesc = e.tier === "calc" ? "Cálculo" : e.tier === "catalog" ? "Catálogo" : "Detalle";
      const shortDesc = tipoDesc + (e.reqPorIter != null ? " · " + e.reqPorIter.toFixed(1).replace(".", ",") + " requests por iteración" : "") + (e.dataset ? " · pool " + e.dataset : " · UUID fijo");

      // Patrón de variabilidad: mismo corte que spikeLevel (arriba), solo con el nombre que ya
      // usa pepper-API-testing en su tabla "Distribución Histórica de P95" (CONSISTENTE/VARIABLE/
      // EPISÓDICO) en vez de un color sin etiquetar - no agrega cómputo nuevo, nombra el que ya
      // existía.
      const patternLabel = spikeLevel === "fail" ? "EPISÓDICO" : spikeLevel === "warn" ? "VARIABLE" : "CONSISTENTE";

      // Caché fría: el frío MEDIDO (primera pegada del preflight) más de 5 veces el p95 en
      // caliente, mismo corte que el informe del smoke. Es una hipótesis: puede ser 1 sola muestra.
      const cacheFriaHint = !!e.frioMuyLento;

      // Apdex: de las muestras de samples.csv.gz, con T y F universales (GS32.apdex).
      const apdexScore = e.apdex;
      const apdexTitle = "Satisfecha ≤ " + GS32.apdex.tMs + " ms, tolerable ≤ " + GS32.apdex.fMs + " ms, frustrada si tarda más o falló (iguales para todos los endpoints)";
      const apdexBandInfo = apdexScore == null ? { label: "s/d", varName: "var(--text-faint)" } : apdexBand(apdexScore);

      const hayFases = e.networkMs != null && e.waitingMs != null && e.receivingMs != null;
      const phaseTotal = hayFases ? (e.networkMs + e.waitingMs + e.receivingMs) || 1 : 1;
      const phaseNetPct = hayFases ? Math.round((e.networkMs / phaseTotal) * 100) : 0;
      const phaseWaitPct = hayFases ? Math.round((e.waitingMs / phaseTotal) * 100) : null;
      const phaseRecvPct = hayFases ? Math.max(0, 100 - phaseNetPct - phaseWaitPct) : 0;

      // Latencia por KB: MISMA formula y umbrales que el panel real "Latency Per KB" del
      // dashboard de Grafana de pepper-API-testing (verificado contra generate-metrics.js linea
      // 407: latencyPerKb = avgLatencyMs / (avgSizeBytes/1024) - acá "avg" es e.p50, la lectura
      // mas fiel a "promedio" que tenemos sin una distribucion completa de muestras).
      const latencyPerKB = e.receivedKB ? e.p50 / e.receivedKB : null;
      const latencyPerKBBandInfo = latencyPerKB == null ? { label: "s/d", colorVar: "var(--text-faint)" } : latencyPerKBBand(latencyPerKB);

      // Resource Impact Ranking: MISMA formula que el panel real homonimo (generate-metrics.js
      // linea 456-458: impact_score = baseline_p95 x total_ejecuciones). Acá con datos de una sola
      // corrida: p95 x iteraciones - "cuanto tiempo de servidor consumio este endpoint en total",
      // no solo cuanto tarda una vez. Un endpoint mediano pero muy frecuente puede pesar mas que
      // uno lento pero raro.
      const impactScore = Math.round(e.p95 * e.iterations);

      return {
        name: e.name,
        shortName: methodOf(e.name),
        resource: resourceOf(e.name),
        desc: shortDesc,
        p95Raw: e.p95,
        isPass: status === "pass",
        isWarn: status === "warn",
        isFail: status === "fail",
        tpsLabel: e.tps.toFixed(1) + " TPS",
        throughputLabel: e.throughput.toFixed(2) + " it/s",
        achievedLabel: achieved + "%",
        ringOffset: Math.round(circumference * (1 - achieved / 100) * 100) / 100,
        ringColorVar: colorVar(ringLevel),
        p50Pct,
        p95Pct,
        p99Pct,
        p50Label: msLabel(e.p50),
        p95Label: msLabel(e.p95),
        p99Label: msLabel(e.p99),
        maxLabel: msLabel(e.max),
        spikeColorVar: colorVar(spikeLevel),
        patternLabel,
        tier: e.tier,
        cacheFriaHint,
        errorLabel: e.errorRate.toFixed(2) + "%",
        errClass: e.errorRate > 0 ? "err-bad" : "err-ok",
        errorTypeLabel: e.errorType ? " · " + e.errorType : "",
        droppedLabel: e.dropped + " / " + e.iterations,
        iterations: e.iterations,
        throughputRaw: e.throughput,
        status,
        apdexScore,
        apdexLabel: apdexScore == null ? "s/d" : apdexScore.toFixed(2),
        apdexTitle,
        apdexColorVar: apdexBandInfo.varName,
        networkLabel: e.networkMs == null ? "s/d" : Math.round(e.networkMs) + "ms",
        waitingLabel: e.waitingMs == null ? "s/d" : Math.round(e.waitingMs) + "ms",
        receivingLabel: e.receivingMs == null ? "s/d" : Math.round(e.receivingMs) + "ms",
        phaseNetPct,
        phaseWaitPct,
        phaseRecvPct,
        receivedKB: e.receivedKB,
        sentKB: e.sentKB,
        receivedKBLabel: e.receivedKB == null ? "s/d" : e.receivedKB.toFixed(2) + " KB",
        sentKBLabel: e.sentKB == null ? "s/d" : e.sentKB.toFixed(2) + " KB",
        latencyPerKB,
        latencyPerKBLabel: latencyPerKB == null ? "s/d" : Math.round(latencyPerKB).toLocaleString("es-AR"),
        latencyPerKBBandLabel: latencyPerKBBandInfo.label,
        latencyPerKBColorVar: latencyPerKBBandInfo.colorVar,
        impactScore,
        impactScoreLabel: impactScore.toLocaleString("es-AR"),
        usoLimiteLabel: e.limite ? Math.round((e.p95 / e.limite) * 100) + "% de su límite de " + msLabel(e.limite) : "",
      };
    });

    const pool = decorated.slice().sort((a, b) => b.p95Raw - a.p95Raw);

    // ---- Payload y eficiencia de transferencia (2026-09-18, adaptado de 3 paneles reales del
    // dashboard de Grafana de pepper-API-testing: "Top 5 Heaviest Payloads", "Latency Per KB" y
    // "Resource Impact Ranking" - formulas y umbrales verificados contra generate-metrics.js) ----
    const conPayload = decorated.filter((e) => e.receivedKB != null);
    const maxKBForBar = Math.max.apply(null, conPayload.map((e) => e.receivedKB)) || 1;
    const heaviestPayloads = conPayload
      .slice()
      .sort((a, b) => b.receivedKB - a.receivedKB)
      .slice(0, 10)
      .map((e) => ({ name: e.shortName, resource: e.resource, kbLabel: e.receivedKBLabel, widthPct: (e.receivedKB / maxKBForBar) * 100 }));

    const latencyPerKBTop = conPayload
      .slice()
      .sort((a, b) => b.latencyPerKB - a.latencyPerKB)
      .slice(0, 10)
      .map((e) => ({ name: e.shortName, resource: e.resource, p50Label: e.p50Label, receivedKBLabel: e.receivedKBLabel, ratioLabel: e.latencyPerKBLabel, bandLabel: e.latencyPerKBBandLabel, colorVar: e.latencyPerKBColorVar }));

    // impactTop (Resource Impact Ranking) se calcula MAS ABAJO, con el acumulado HISTORICO de
    // iteraciones (no solo esta corrida) - ver la seccion de comparativa entre corridas/versiones,
    // donde ya esta disponible histConBaseline. Carlos lo pidio historico despues de revisar la
    // v20: "que le costo mas tiempo de servidor en TODO lo que llevamos midiendo" es una pregunta
    // mas valiosa que "que peso mas en esta corrida puntual".

    // ---- Cuello de botella (Resumen Ejecutivo): top endpoints de ESTA corrida, con el motivo
    // generado por motivoCuelloDeBotella(). Orden: fail primero, warn despues, el resto por p95 -
    // mismo criterio de severidad que ya usa el veredicto de la tarjeta de cada endpoint.
    const bottlenecks = decorated
      .slice()
      .sort((a, b) => {
        const sevA = a.isFail ? 3 : a.isWarn ? 2 : 1;
        const sevB = b.isFail ? 3 : b.isWarn ? 2 : 1;
        if (sevA !== sevB) return sevB - sevA;
        return b.p95Raw - a.p95Raw;
      })
      .slice(0, 8)
      .map((ep) => ({
        name: ep.shortName,
        resource: ep.resource,
        p95Label: ep.p95Label,
        status: ep.status,
        statusColorVar: colorVar(ep.status === "fail" ? "fail" : ep.status === "warn" ? "warn" : "ok"),
        motivo: motivoCuelloDeBotella(ep),
      }));

    const hasNameSelection = selectedNames.length > 0;
    const hasResourceSelection = selectedResources.length > 0;

    let visibleBase;
    let modeNote;
    if (hasNameSelection) {
      visibleBase = pool.filter((e) => selectedNames.indexOf(e.name) !== -1);
      modeNote = "Mostrando " + visibleBase.length + " endpoint(s) seleccionados de " + pool.length + ".";
    } else if (hasResourceSelection) {
      visibleBase = pool.filter((e) => selectedResources.indexOf(e.resource) !== -1);
      modeNote = "Mostrando " + visibleBase.length + " endpoint(s) de la(s) API(s): " + selectedResources.join(", ") + ".";
    } else if (viewMode === "all") {
      visibleBase = pool;
      modeNote = "Mostrando los " + pool.length + " endpoints, ordenados por p95 (peor primero).";
    } else if (viewMode === "warn") {
      visibleBase = pool.filter((e) => e.status === "warn");
      modeNote = "Mostrando " + visibleBase.length + " endpoint(s) en WARN (dropped iterations, sin llegar a error rate), de " + pool.length + " totales.";
    } else if (viewMode === "fail") {
      visibleBase = pool.filter((e) => e.status === "fail");
      modeNote = "Mostrando " + visibleBase.length + " endpoint(s) en FAIL (con error rate > 0), de " + pool.length + " totales.";
    } else {
      visibleBase = pool.slice(0, 10);
      modeNote = "Mostrando los 10 con peor p95, de " + pool.length + " endpoints totales.";
    }
    const showRank = !hasNameSelection && !hasResourceSelection;

    // Endpoint inspeccionado en el panel de tendencia: el que se clickeo, o si todavia no se
    // clickeo nada, el primero de la lista visible - asi el panel nunca queda vacio.
    const inspectedName = (state.inspectedEndpoint && raw.some((e) => e.name === state.inspectedEndpoint))
      ? state.inspectedEndpoint
      : (visibleBase[0] ? visibleBase[0].name : raw[0].name);

    const visibleEndpoints = visibleBase.map((e, idx) => ({
      ...e,
      rank: idx + 1,
      showRank,
      isInspecting: e.name === inspectedName,
      inspectingClass: e.name === inspectedName ? "inspecting" : "",
      pick: inspect(e.name),
    }));

    // Chips de endpoint: solo los de la(s) API(s) elegida(s) - nunca los 45 juntos, para que
    // elegir una API (ej. "bonds") de verdad achique la lista en vez de solo agregar una
    // pestaña mas arriba de la misma lista larga.
    const chipsSource = hasResourceSelection
      ? decorated.filter((e) => selectedResources.indexOf(e.resource) !== -1)
      : [];
    const chips = chipsSource.map((e) => {
      const selected = selectedNames.indexOf(e.name) !== -1;
      return {
        name: e.shortName,
        extraClass: selected ? "selected" : "",
        toggle: () => {
          const set = new Set(this.state.selectedNames || []);
          if (set.has(e.name)) set.delete(e.name);
          else set.add(e.name);
          this.setState({ selectedNames: Array.from(set) });
        },
      };
    });

    const resourceChips = RESOURCES.map((res) => {
      const count = raw.filter((e) => e.name.indexOf(res + "/") === 0).length;
      const selected = selectedResources.indexOf(res) !== -1;
      return {
        label: res + " (" + count + ")",
        extraClass: selected ? "selected" : "",
        toggle: toggleResource(res),
      };
    });

    const totalIterations = decorated.reduce((a, e) => a + e.iterations, 0);
    const totalThroughput = decorated.reduce((a, e) => a + e.throughputRaw, 0);
    const passCount = decorated.filter((e) => e.status === "pass").length;
    const warnCount = decorated.filter((e) => e.status === "warn").length;
    const failCount = decorated.filter((e) => e.status === "fail").length;

    // Apdex agregado: promedio simple de los Apdex por endpoint (no ponderado por throughput -
    // un promedio ponderado le daría más peso a los catálogos de alto TPS y taparía justo los
    // endpoints de cálculo, que son los que más conviene que se vean en un resumen ejecutivo).
    const conApdex = decorated.filter((e) => e.apdexScore != null);
    const apdexAgg = conApdex.length ? conApdex.reduce((a, e) => a + e.apdexScore, 0) / conApdex.length : null;
    const apdexAggBand = apdexAgg == null ? { label: "sin muestras (falta samples.csv.gz)", varName: "var(--text-faint)" } : apdexBand(apdexAgg);

    const insightsAll = construirInsights(decorated, raw, buildOverviewSeries());

    const DEFAULT_VISIBLE = 2;
    const hallazgoExpand = !!state.expandHallazgo;
    const riesgoExpand = !!state.expandRiesgo;
    const confoundExpand = !!state.expandConfound;

    const hasSelection = hasNameSelection || hasResourceSelection;
    const selectedCountLabel = hasNameSelection
      ? String(selectedNames.length)
      : hasResourceSelection
        ? selectedResources.length + " API" + (selectedResources.length === 1 ? "" : "s")
        : "0";

    // ============================================================================
    // Panel general: series de la corrida completa, con hover -> crosshair + legend
    // ============================================================================
    const ov = buildOverviewSeries();
    const N_OV = OVERVIEW_POINTS;

    // -- VUs (con techo del profile, para ver saturación del lado cliente) --
    const gVus = chartGeomWithCeiling(ov.vus, OVERVIEW_VUS_CEILING, 300, 84, 8, 8);
    const hoverVus = hover.chart === "vus";
    const idxVus = hoverVus ? hover.index : N_OV - 1;
    const avgVus = Math.round(ov.vus.reduce((a, b) => a + b, 0) / N_OV);
    const peakVus = Math.max.apply(null, ov.vus);
    const ceilingPct = Math.round((peakVus / OVERVIEW_VUS_CEILING) * 100);
    const overviewVus = {
      points: gVus.points,
      areaPoints: gVus.areaPoints,
      ceilingY: gVus.yFor(OVERVIEW_VUS_CEILING),
      ceilingLabel: OVERVIEW_VUS_CEILING + " VUs (pico usado: " + ceilingPct + "%)",
      headline: avgVus + " VUs (prom.)",
      bands: buildBands(N_OV, 300, 84, "vus", enterHover),
      hoverActive: hoverVus,
      hoverX: hoverVus ? xAt(idxVus, N_OV, 300).toFixed(1) : null,
      hoverY: hoverVus ? gVus.pts[idxVus][1].toFixed(1) : null,
      legendTimeLabel: hoverVus ? timeLabel(idxVus, N_OV, OVERVIEW_SECONDS) + " de la corrida" : "corrida completa",
      legendValue: vusLabel(ov.vus[idxVus]),
      footnote: GS32.endpoints.length + " scenarios " + GS32.meta.executor + " — pico " + vusLabel(peakVus) + " en uso, " + (OVERVIEW_VUS_CEILING - peakVus) + " VUs de margen contra los " + OVERVIEW_VUS_CEILING + " asignados (vus_max).",
    };

    // -- Latencia agregada (p50/p95/p99) --
    const gLat = chartGeomShared([ov.p95, ov.p50, ov.p99], 300, 84, 8, 8);
    const hoverLat = hover.chart === "latency";
    const idxLat = hoverLat ? hover.index : N_OV - 1;
    const overviewLatency = {
      p95Points: gLat[0].points,
      p50Points: gLat[1].points,
      p99Points: gLat[2].points,
      headline: msLabel(ov.p95[N_OV - 1]) + " p95",
      bands: buildBands(N_OV, 300, 84, "latency", enterHover),
      hoverActive: hoverLat,
      hoverX: hoverLat ? xAt(idxLat, N_OV, 300).toFixed(1) : null,
      hoverY95: hoverLat ? gLat[0].pts[idxLat][1].toFixed(1) : null,
      hoverY50: hoverLat ? gLat[1].pts[idxLat][1].toFixed(1) : null,
      hoverY99: hoverLat ? gLat[2].pts[idxLat][1].toFixed(1) : null,
      legendTimeLabel: hoverLat ? timeLabel(idxLat, N_OV, OVERVIEW_SECONDS) + " de la corrida" : "corrida completa",
      p95Value: msLabel(ov.p95[idxLat]),
      p50Value: msLabel(ov.p50[idxLat]),
      p99Value: msLabel(ov.p99[idxLat]),
      nota: notaLatencia(ov),
    };

    // -- Transfer rate (recibidos/enviados) --
    const gTr = chartGeomShared([ov.recv, ov.sent], 300, 84, 8, 8);
    const hoverTr = hover.chart === "transfer";
    const idxTr = hoverTr ? hover.index : N_OV - 1;
    const overviewTransfer = {
      recvPoints: gTr[0].points,
      sentPoints: gTr[1].points,
      headline: kbLabel(ov.recv[N_OV - 1]),
      bands: buildBands(N_OV, 300, 84, "transfer", enterHover),
      hoverActive: hoverTr,
      hoverX: hoverTr ? xAt(idxTr, N_OV, 300).toFixed(1) : null,
      hoverYRecv: hoverTr ? gTr[0].pts[idxTr][1].toFixed(1) : null,
      hoverYSent: hoverTr ? gTr[1].pts[idxTr][1].toFixed(1) : null,
      legendTimeLabel: hoverTr ? timeLabel(idxTr, N_OV, OVERVIEW_SECONDS) + " de la corrida" : "corrida completa",
      recvValue: kbLabel(ov.recv[idxTr]),
      sentValue: kbLabel(ov.sent[idxTr]),
      nota: notaTransfer(decorated),
    };

    // -- Overview HTTP (throughput + error rate) --
    const gReq = chartGeom(ov.reqRate, 300, 56, 6, 6);
    const hoverHttp = hover.chart === "http";
    const idxHttp = hoverHttp ? hover.index : N_OV - 1;
    const errLevelAt = (v) => (v >= 2 ? "fail" : v >= 0.5 ? "warn" : "ok");
    const reqSum = ov.reqRate.reduce((a, v) => a + v, 0);
    const reqTotalRate = ov.reqRate.length ? reqSum / ov.reqRate.length : 0;
    const errTotalPct = reqSum ? ov.errRate.reduce((a, v, i) => a + v * ov.reqRate[i], 0) / reqSum : 0;
    const overviewHttp = {
      reqPoints: gReq.points,
      reqAreaPoints: gReq.areaPoints,
      headline: reqTotalRate.toFixed(1) + " req/s",
      bands: buildBands(N_OV, 300, 56, "http", enterHover),
      hoverActive: hoverHttp,
      hoverX: hoverHttp ? xAt(idxHttp, N_OV, 300).toFixed(1) : null,
      hoverY: hoverHttp ? gReq.pts[idxHttp][1].toFixed(1) : null,
      errStrip: ov.errRate.map((v, i) => ({
        levelVar: colorVar(errLevelAt(v)),
        activeClass: hoverHttp && i === idxHttp ? "active" : "",
      })),
      legendTimeLabel: hoverHttp ? timeLabel(idxHttp, N_OV, OVERVIEW_SECONDS) + " de la corrida" : "corrida completa",
      // Sin hover, "corrida completa" = el total de la corrida, no el último tramo.
      reqValue: (hoverHttp ? ov.reqRate[idxHttp] : reqTotalRate).toFixed(1) + " req/s",
      errValue: pctLabel(hoverHttp ? ov.errRate[idxHttp] : errTotalPct),
      errDotColor: colorVar(errLevelAt(hoverHttp ? ov.errRate[idxHttp] : errTotalPct)),
    };

    const overview = { vus: overviewVus, latency: overviewLatency, transfer: overviewTransfer, http: overviewHttp };

    // ============================================================================
    // Panel "Por endpoint": TPS + p95 + % error del endpoint inspeccionado,
    // superpuestos como areas en UN solo grafico (mismo lenguaje visual que el
    // "HTTP Performance overview" nativo de k6: cada metrica con su propia
    // escala, para que convivan pese a tener unidades distintas). Sin p50 a
    // pedido explicito - solo lo que el overview de k6 muestra.
    // ============================================================================
    const inspectedIdx = raw.findIndex((e) => e.name === inspectedName);
    const inspectedEntry = raw[inspectedIdx];
    const epTsReal = buildEndpointTimeline(inspectedEntry);
    const epTs = epTsReal || { tps: [0, 0], p95: [0, 0], err: [0, 0] };
    const N_EP = epTs.tps.length;
    const gTps = chartGeom(epTs.tps, 480, 200, 10, 20);
    const gP95 = chartGeom(epTs.p95, 480, 200, 10, 20);
    const gErr = chartGeom(epTs.err, 480, 200, 10, 20);
    const hoverTrend = hover.chart === "trend";
    const idxTrend = hoverTrend ? hover.index : N_EP - 1;
    // Color de "duration" propio (no accent/accent2, ya usados por TPS y por otras cosas del
    // reporte): mismo formato oklch L/C fijo + hue variable que el resto de la paleta.
    const durationColor = dark ? "oklch(78% 0.12 235)" : "oklch(50% 0.13 235)";

    const trend = {
      disponible: !!epTsReal,
      noDisponible: !epTsReal,
      noDisponibleTexto: "La tendencia por endpoint en el tiempo sale de samples.csv.gz, y esta corrida no lo tiene (es anterior a la salida CSV de k6). Las tarjetas de abajo sí son de esta corrida.",
      name: methodOf(inspectedName),
      durationColor,
      tpsAreaPoints: gTps.areaPoints,
      tpsPoints: gTps.points,
      p95AreaPoints: gP95.areaPoints,
      p95Points: gP95.points,
      errPoints: gErr.points,
      bands: buildBands(N_EP, 480, 200, "trend", enterHover),
      hoverActive: hoverTrend,
      hoverX: hoverTrend ? xAt(idxTrend, N_EP, 480).toFixed(1) : null,
      hoverYTps: hoverTrend ? gTps.pts[idxTrend][1].toFixed(1) : null,
      hoverYP95: hoverTrend ? gP95.pts[idxTrend][1].toFixed(1) : null,
      hoverYErr: hoverTrend ? gErr.pts[idxTrend][1].toFixed(1) : null,
      legendTimeLabel: (hoverTrend ? timeLabel(idxTrend, N_EP, ENDPOINT_SECONDS) : "último tramo, " + timeLabel(N_EP - 1, N_EP, ENDPOINT_SECONDS)) + " de la corrida",
      tpsValue: itsLabel(epTs.tps[idxTrend]),
      p95Value: msLabel(epTs.p95[idxTrend]),
      errValue: pctLabel(epTs.err[idxTrend]),
    };

    // ============================================================================
    // Comparativa entre corridas y versiones: dataset/baseline UNA sola vez, compartido entre
    // los 5 paneles agregados (buildHistoricoViewModel) y el panel-inspector de abajo.
    // ============================================================================
    const { conBaseline: histConBaseline, runs: histRuns } = buildHistoricoRawAndBaseline();
    const patronMode = state.patronMode || "top10";
    const histNormales = histRuns.filter((r) => !r.escenario).length;
    const histDisponible = histNormales >= HIST_MIN_CORRIDAS;
    const historicoBase = buildHistoricoViewModel(histConBaseline, histRuns, patronMode);

    // ============================================================================
    // Escenarios: catalogo + detalle + comparar-contra-otro (2026-09-18, réplica más completa de
    // pepper-API-testing a pedido de Carlos - ver comentario junto a buildEscenariosCatalogo).
    // ============================================================================
    const escenariosCatalogoRaw = buildEscenariosCatalogo(histConBaseline);
    const hayEscenarios = escenariosCatalogoRaw.length > 0;
    // Sin corridas de escenario se arma un contexto vacío para no romper el armado de abajo; la
    // sección muestra su estado vacío (historico.escenarios.vacio).
    if (!hayEscenarios) escenariosCatalogoRaw.push({ nombre: "", corridas: [], corridasCount: 0, primeraFecha: null, ultimaFecha: null, ultimaVersion: null, endpointsLast: new Map(), vacio: true });
    const escenarioSelNombre = (state.escenarioSeleccionado && escenariosCatalogoRaw.some((c) => c.nombre === state.escenarioSeleccionado))
      ? state.escenarioSeleccionado
      : escenariosCatalogoRaw[0].nombre;
    const ctxSel = escenariosCatalogoRaw.find((c) => c.nombre === escenarioSelNombre);
    const findingsSel = escenarioFindings(ctxSel);
    const narrativaSel = escenarioNarrativa(ctxSel, findingsSel);

    const escenarioCatalogoRows = escenariosCatalogoRaw.map((ctx) => {
      const f = escenarioFindings(ctx);
      return {
        nombre: ctx.nombre,
        corridasLabel: ctx.corridasCount + (ctx.corridasCount === 1 ? ' corrida' : ' corridas'),
        rangoFechas: ctx.primeraFecha === ctx.ultimaFecha ? ctx.ultimaFecha : (ctx.primeraFecha + ' → ' + ctx.ultimaFecha),
        ultimaVersion: ctx.ultimaVersion,
        resumenChip: f.degraded.length ? (f.degraded.length + ' degradado' + (f.degraded.length === 1 ? '' : 's')) : (f.improved.length ? (f.improved.length + ' mejorado' + (f.improved.length === 1 ? '' : 's')) : 'sin cambios notables'),
        resumenColorVar: f.degraded.length ? colorVar('fail') : (f.improved.length ? colorVar('ok') : 'var(--text-faint)'),
        extraClass: ctx.nombre === escenarioSelNombre ? 'selected' : '',
        select: () => this.setState({ escenarioSeleccionado: ctx.nombre, escenarioComparar: null, escenarioTablaMode: 'top10', escenarioDegExpand: false, escenarioMejExpand: false }),
      };
    });

    const ESCN_LIST_TOP_N = 4;
    const degExpand = !!state.escenarioDegExpand;
    const mejExpand = !!state.escenarioMejExpand;
    const toScnListItem = (e) => ({ name: shortNameHist(e.endpoint), deltaLabel: deltaLabel(e.f.deltaGlobalPct) });
    const degradosVisible = (degExpand ? findingsSel.degraded : findingsSel.degraded.slice(0, ESCN_LIST_TOP_N)).map(toScnListItem);
    const mejoradosVisible = (mejExpand ? findingsSel.improved : findingsSel.improved.slice(0, ESCN_LIST_TOP_N)).map(toScnListItem);

    // Tercer tile: peor caso si hay degradados, si no el mejor caso (misma logica que pepper - la
    // noticia relevante de la corrida, no "peor caso" vacio solo porque no hubo nada negativo).
    const scnThird = findingsSel.degraded[0]
      ? { label: 'Peor caso', item: findingsSel.degraded[0], colorVar: colorVar('fail') }
      : (findingsSel.improved[0] ? { label: 'Mejor caso', item: findingsSel.improved[0], colorVar: colorVar('ok') } : null);

    const escenarioTablaMode = state.escenarioTablaMode || 'top10';
    const tablaCompletaAll = [];
    ctxSel.endpointsLast.forEach((f, endpoint) => tablaCompletaAll.push({ endpoint, f }));
    tablaCompletaAll.sort((a, b) => Math.abs(b.f.deltaGlobalPct || 0) - Math.abs(a.f.deltaGlobalPct || 0));
    const ESCN_TABLA_TOP_N = 10;
    const tablaCompletaRows = (escenarioTablaMode === 'all' ? tablaCompletaAll : tablaCompletaAll.slice(0, ESCN_TABLA_TOP_N)).map(({ endpoint, f }) => ({
      name: shortNameHist(endpoint),
      p95EscenarioLabel: msLabel(f.p95),
      p95FrecuenteLabel: f.baselineGlobal ? msLabel(f.baselineGlobal) : '-',
      deltaFrecuenteLabel: deltaLabel(f.deltaGlobalPct),
      deltaFrecuenteColorVar: colorVarFromPctSimple(f.deltaGlobalPct),
      deltaPropioLabel: (ctxSel.corridasCount > 1 && f.baselineOwn != null) ? deltaLabel(f.deltaOwnPct) : '—',
      deltaPropioColorVar: (ctxSel.corridasCount > 1 && f.baselineOwn != null) ? colorVarFromPctSimple(f.deltaOwnPct) : 'var(--text-faint)',
    }));

    const escenarioOtros = escenariosCatalogoRaw.filter((c) => c.nombre !== escenarioSelNombre);
    const escenarioCompararNombre = (state.escenarioComparar && escenarioOtros.some((c) => c.nombre === state.escenarioComparar)) ? state.escenarioComparar : null;
    const escenarioCompararChips = escenarioOtros.map((c) => ({
      nombre: c.nombre,
      extraClass: c.nombre === escenarioCompararNombre ? 'selected' : '',
      toggle: () => this.setState({ escenarioComparar: c.nombre === escenarioCompararNombre ? null : c.nombre }),
    }));
    let escenarioCompararRows = [];
    let ctxCmp = null;
    if (escenarioCompararNombre) {
      ctxCmp = escenarioOtros.find((c) => c.nombre === escenarioCompararNombre);
      escenarioCompararRows = escenarioCompararFilas(ctxSel, ctxCmp).map((r) => ({
        name: shortNameHist(r.endpoint),
        pALabel: msLabel(r.fa.p95),
        pBLabel: msLabel(r.fb.p95),
        deltaLabel: r.delta == null ? '—' : deltaLabel(r.delta),
        deltaColorVar: r.delta == null ? 'var(--text-faint)' : colorVarFromPctSimple(r.delta),
      }));
    }

    const escenarios = {
      disponible: hayEscenarios,
      vacio: !hayEscenarios,
      vacioTexto: "No hay corridas de escenario (cambios sin deploy) en metrics/gs32/ con la clave de esta corrida.",
      catalogo: hayEscenarios ? escenarioCatalogoRows : [],
      seleccionado: {
        nombre: ctxSel.nombre,
        corridasLabel: ctxSel.corridasCount + (ctxSel.corridasCount === 1 ? ' corrida' : ' corridas'),
        rangoFechas: ctxSel.primeraFecha === ctxSel.ultimaFecha ? ctxSel.ultimaFecha : (ctxSel.primeraFecha + ' → ' + ctxSel.ultimaFecha),
        ultimaVersion: ctxSel.ultimaVersion,
        esUnaSolaCorrida: ctxSel.corridasCount <= 1,
        degradedCount: findingsSel.degraded.length,
        improvedCount: findingsSel.improved.length,
        measuredCount: findingsSel.measured,
        hasThird: !!scnThird,
        thirdLabel: scnThird ? scnThird.label : '',
        thirdValueLabel: scnThird ? deltaLabel(scnThird.item.f.deltaGlobalPct) : '—',
        thirdSubLabel: scnThird ? shortNameHist(scnThird.item.endpoint) : 'sin cambios notables',
        thirdColorVar: scnThird ? scnThird.colorVar : 'var(--text-faint)',
        narrativa: narrativaSel,
        hasHallazgos: findingsSel.degraded.length > 0 || findingsSel.improved.length > 0,
        sinHallazgos: findingsSel.degraded.length === 0 && findingsSel.improved.length === 0,
        degradados: degradosVisible,
        hasDegradados: findingsSel.degraded.length > 0,
        degradadosHasMore: findingsSel.degraded.length > ESCN_LIST_TOP_N,
        degradadosToggleLabel: degExpand ? 'Ver menos' : 'Ver ' + (findingsSel.degraded.length - ESCN_LIST_TOP_N) + ' más',
        mejorados: mejoradosVisible,
        hasMejorados: findingsSel.improved.length > 0,
        mejoradosHasMore: findingsSel.improved.length > ESCN_LIST_TOP_N,
        mejoradosToggleLabel: mejExpand ? 'Ver menos' : 'Ver ' + (findingsSel.improved.length - ESCN_LIST_TOP_N) + ' más',
        tablaRows: tablaCompletaRows,
        tablaTotalCount: tablaCompletaAll.length,
        tablaShownCount: tablaCompletaRows.length,
        tablaMode: escenarioTablaMode,
        tablaViewTopExtra: escenarioTablaMode === 'top10' ? 'active' : '',
        tablaViewAllExtra: escenarioTablaMode === 'all' ? 'active' : '',
        setTablaTop10: () => this.setState({ escenarioTablaMode: 'top10' }),
        setTablaAll: () => this.setState({ escenarioTablaMode: 'all' }),
        toggleDegExpand: () => this.setState({ escenarioDegExpand: !degExpand }),
        toggleMejExpand: () => this.setState({ escenarioMejExpand: !mejExpand }),
      },
      comparar: {
        chips: escenarioCompararChips,
        hasOtros: escenarioOtros.length > 0,
        sinOtros: escenarioOtros.length === 0,
        activo: escenarioCompararNombre,
        hasActivo: !!escenarioCompararNombre,
        sinActivo: !escenarioCompararNombre,
        otroNombre: ctxCmp ? ctxCmp.nombre : '',
        rows: escenarioCompararRows,
        hasRows: escenarioCompararRows.length > 0,
      },
    };

    // ---- Resource Impact Ranking, HISTORICO (a pedido de Carlos, reemplaza la version de una
    // sola corrida): MISMA formula que el panel real de pepper-API-testing
    // (generate-metrics.js: impact_score = baseline_global x total_ejecuciones ACUMULADAS a
    // traves de TODAS las corridas, no solo la ultima). El arbol de escenario NO suma acá, mismo
    // criterio que en todo el resto del historico: no contamina la historia "normal".
    const totalIteracionesPorEndpoint = new Map();
    histConBaseline.forEach((f) => {
      if (f.escenario) return;
      totalIteracionesPorEndpoint.set(f.endpoint, (totalIteracionesPorEndpoint.get(f.endpoint) || 0) + f.iterations);
    });
    const impactTop = RAW_NAMES.map((ep) => {
      const filasEp = histConBaseline.filter((f) => f.endpoint === ep && !f.escenario);
      const ultima = filasEp[filasEp.length - 1];
      const totalIter = totalIteracionesPorEndpoint.get(ep) || 0;
      // baseline_global de la ULTIMA corrida (el mas representativo del comportamiento "normal"
      // reciente del endpoint) - si todavia no tiene baseline (primera corrida), cae a su propio
      // p95 mas reciente, mismo fallback que usa pepper ("baselineGlobal || p95").
      const p95Ref = ultima ? (ultima.baselineGlobal || ultima.p95) : 0;
      const score = Math.round(p95Ref * totalIter);
      return {
        name: shortNameHist(ep),
        resource: resourceOf(ep),
        p95Label: msLabel(p95Ref),
        totalIterLabel: totalIter.toLocaleString("es-AR"),
        scoreLabel: score.toLocaleString("es-AR"),
        scoreRaw: score,
      };
    })
      .sort((a, b) => b.scoreRaw - a.scoreRaw)
      .slice(0, 10);

    // ---- Panel grande: tendencia historica de UN endpoint elegido, a traves de las versiones ----
    // Endpoint inicial del inspector: el de peor p95 de esta corrida (antes, uno fijo del mockup).
    const inspectorDefault = pool[0] ? pool[0].name : RAW_NAMES[0];
    const inspectorEndpointName = (state.inspectorEndpoint && RAW_NAMES.indexOf(state.inspectorEndpoint) !== -1)
      ? state.inspectorEndpoint
      : inspectorDefault;
    const inspectorResource = state.inspectorResource || resourceOf(inspectorEndpointName);

    const inspectorResourceChips = RESOURCES.map((res) => ({
      label: res,
      extraClass: res === inspectorResource ? "selected" : "",
      pick: () => {
        // Cambiar de API resetea el endpoint elegido al primero de esa API - mismo criterio que
        // el filtro de "Por endpoint": una seleccion fina de otra API no tiene sentido despues.
        const primero = RAW_NAMES.find((n) => resourceOf(n) === res);
        this.setState({ inspectorResource: res, inspectorEndpoint: primero });
      },
    }));
    const inspectorEndpointChips = RAW_NAMES.filter((n) => resourceOf(n) === inspectorResource).map((n) => ({
      name: methodOf(n),
      extraClass: n === inspectorEndpointName ? "selected" : "",
      pick: () => this.setState({ inspectorEndpoint: n }),
    }));
    const inspRuns = histRuns;
    const N_INSP = inspRuns.length;
    const inspRows = inspRuns.map((run) => histConBaseline.find((f) => f.endpoint === inspectorEndpointName && f.timestamp === run.runId) || { p95: 0, throughput: 0, errorRatePct: 0, timestamp: run.runId, escenario: run.escenario });
    const inspP95Vals = inspRows.map((r) => r.p95);
    const inspTpsVals = inspRows.map((r) => r.throughput);
    const inspErrVals = inspRows.map((r) => r.errorRatePct);

    const gInspP95 = chartGeom(inspP95Vals, 480, 200, 10, 24);
    const gInspTps = chartGeom(inspTpsVals, 480, 200, 10, 24);
    const gInspErr = chartGeom(inspErrVals, 480, 200, 10, 24);

    const hoverInsp = hover.chart === "histoTrend";
    const idxInsp = hoverInsp ? hover.index : N_INSP - 1;

    // Limites de version: donde la version CAMBIA respecto de la corrida anterior, para dibujar
    // una linea vertical - la corrida de escenario no dispara un limite nuevo porque comparte
    // version con sus vecinas (ver buildHistoricoRuns).
    const versionBoundaries = [];
    let prevVersionInsp = null;
    inspRuns.forEach((run, i) => {
      if (run.version !== prevVersionInsp) {
        versionBoundaries.push({ x: xAt(i, N_INSP, 480).toFixed(1), colorVar: versionColorFor(run.version) });
        prevVersionInsp = run.version;
      }
    });
    const versionLegendParts = HISTORICO_VERSIONS.map((v) => {
      const primerRun = inspRuns.find((r) => r.version === v && !r.escenario);
      return v + " desde " + (primerRun ? primerRun.fecha : "?");
    }).join(" · ");

    // Con varias corridas de escenario (antes 1), este circulo hueco necesita marcar TODAS, no solo la
    // primera - por eso es una lista, no un indice unico como en la v26.
    const escenarioPointsInsp = [];
    inspRuns.forEach((r, i) => {
      if (!r.escenario) return;
      escenarioPointsInsp.push({ x: xAt(i, N_INSP, 480).toFixed(1), y: gInspP95.pts[i][1].toFixed(1) });
    });

    // ---- Deteccion de anomalias para ESTE endpoint (pedido de Carlos: "es posible?") ----------
    // Sobre las filas SIN escenario, en orden cronologico (mismo orden que inspRuns, filtrando el
    // indice que corresponde a la corrida de escenario).
    const inspRowsNormales = inspRows.filter((r) => !r.escenario);
    const { picos: inspPicos, cambios: inspCambios } = detectarAnomaliasHistoricas(inspRowsNormales);
    const anomaliaMarkers = [];
    inspRowsNormales.forEach((row) => {
      const dir = directionDeEstado(row.estado);
      if (!dir) return;
      const iReal = inspRuns.findIndex((r) => r.runId === row.timestamp);
      if (iReal === -1) return;
      anomaliaMarkers.push({
        x: xAt(iReal, N_INSP, 480).toFixed(1),
        y: gInspP95.pts[iReal][1].toFixed(1),
        colorVar: dir === "degradacion" ? colorVar("fail") : colorVar("ok"),
      });
    });
    const anomaliasResumenParts = [];
    inspPicos.forEach((p) => anomaliasResumenParts.push(
      (p.tipo === "degradacion" ? "pico" : "caída") + " aislado en " + p.fecha + " " + p.hora + " (" + p.version + ", " + p.deltaLabel + ")"
    ));
    inspCambios.forEach((c) => anomaliasResumenParts.push(
      (c.tipo === "degradacion" ? "degradación" : "mejora") + " sostenida desde " + c.fecha + " " + c.hora + " (" + c.version + ", " + c.deltaLabel + ", " + c.largo + " corridas seguidas)"
    ));

    const inspector = {
      resourceChips: inspectorResourceChips,
      endpointChips: inspectorEndpointChips,
      hasEndpointChips: inspectorEndpointChips.length > 0,
      anomaliaMarkers,
      hasAnomalias: anomaliasResumenParts.length > 0,
      anomaliasResumen: anomaliasResumenParts.length > 0 ? anomaliasResumenParts.join(" · ") : "sin picos aislados ni cambios sostenidos detectados contra el baseline_global de este endpoint.",
      selectedName: methodOf(inspectorEndpointName),
      selectedFull: inspectorEndpointName,
      p95Points: gInspP95.points,
      tpsPoints: gInspTps.points,
      errPoints: gInspErr.points,
      boundaries: versionBoundaries,
      escenarioPoints: escenarioPointsInsp,
      bands: buildBands(N_INSP, 480, 200, "histoTrend", enterHover),
      hoverActive: hoverInsp,
      hoverX: hoverInsp ? xAt(idxInsp, N_INSP, 480).toFixed(1) : null,
      hoverYP95: hoverInsp ? gInspP95.pts[idxInsp][1].toFixed(1) : null,
      hoverYTps: hoverInsp ? gInspTps.pts[idxInsp][1].toFixed(1) : null,
      hoverYErr: hoverInsp ? gInspErr.pts[idxInsp][1].toFixed(1) : null,
      legendTimeLabel: (inspRuns[idxInsp].escenario ? "escenario · " : "") + inspRuns[idxInsp].fecha + " " + inspRuns[idxInsp].hora + " · " + inspRuns[idxInsp].version,
      p95Value: msLabel(inspP95Vals[idxInsp]),
      tpsValue: itsLabel(inspTpsVals[idxInsp]),
      errValue: pctLabel(inspErrVals[idxInsp]),
      versionLegend: versionLegendParts,
      durationColor,
    };

    // ---- Tendencia (barras): hover interactivo con fecha+hora+version+p95 (pedido de Carlos -
    // antes era un title="" nativo del navegador, que "quedaba un poco roto" con 21+ barras) ----
    const trendRunAverages = historicoBase.trend.runAverages;
    const maxRunAvg = Math.max.apply(null, trendRunAverages.map((r) => r.avg));
    const PLOT_MAX_PCT = 92;
    const hoverTrendBars = hover.chart === "trendBars";
    const idxTrendBars = hoverTrendBars ? hover.index : trendRunAverages.length - 1;
    const trendBars = trendRunAverages.map(({ run, avg }, i) => ({
      heightPct: (avg / maxRunAvg) * PLOT_MAX_PCT,
      colorVar: run.escenario ? "var(--confound)" : versionColorFor(run.version),
      escenarioClass: run.escenario ? "escenario" : "",
      activeClass: hoverTrendBars && i === idxTrendBars ? "active" : "",
      dateLabel: run.escenario ? "ESC" : run.fecha,
      onEnter: enterHover("trendBars", i),
    }));
    const trendBarHoy = trendRunAverages[idxTrendBars];
    const baselineTopPct = 100 - (historicoBase.trend.baselinePromedio / maxRunAvg) * PLOT_MAX_PCT;
    const historicoTrend = {
      bars: trendBars,
      baselineTopPct: baselineTopPct.toFixed(1),
      legendNote: "Barra rayada = corrida de escenario (fuera de la historia normal). Color = versión (más clara = más nueva). Línea = baseline_global promedio de hoy.",
      count: trendRunAverages.length,
      totalRunsCount: historicoBase.trend.totalRunsCount,
      legendFechaHora: trendBarHoy.run.fecha + " " + trendBarHoy.run.hora,
      legendVersion: trendBarHoy.run.version + (trendBarHoy.run.escenario ? " · escenario: " + trendBarHoy.run.escenario : ""),
      legendP95: msLabel(trendBarHoy.avg),
    };

    const historico = { ...historicoBase, disponible: histDisponible, vacio: !histDisponible,
      vacioTexto: "Hay " + histNormales + " corrida" + (histNormales === 1 ? "" : "s") + " con la clave de esta corrida (" + HIST.claveLabel + "). La tendencia y la comparativa aparecen desde " + HIST_MIN_CORRIDAS + " corridas con la misma clave.",
      trend: historicoTrend, inspector, impactTop, escenarios, patronViewTopExtra: patronMode === "top10" ? "active" : "", patronViewAllExtra: patronMode === "all" ? "active" : "" };

    // ============================================================================
    // Resumen ejecutivo en lenguaje llano + Conclusiones/Accionables + Recomendaciones
    // Prioritarias (2026-09-18, pedido de Carlos, inspirado en el informe de mpc-cypress).
    // TODO generado de numeros YA calculados arriba (bottlenecks, historico.scorecard,
    // historico.patron) - ninguna cifra nueva, solo prosa y priorizacion sobre lo que ya existe.
    // ============================================================================
    const peorRegresion = histDisponible ? historico.scorecard.newList[0] || null : null;
    const mejorMejora = histDisponible ? historico.scorecard.resolvedList[0] || null : null;
    const topBottleneck = bottlenecks[0] || null;
    const topPatron = historico.patron.rows[0] || null;
    const topSemaforo = historico.semaforo.rows[0] || null;

    const parrafoPartes = [];
    if (!histDisponible || !HISTORICO_VERSION_ANTERIOR) {
      parrafoPartes.push(
        "Corrida " + GS32.meta.tipo + " de " + decorated.length + " endpoints en " + GS32.meta.ambienteLabel + " (" + GS32.meta.versionLabel + "): " +
        passCount + " PASS, " + warnCount + " WARN y " + failCount + " FAIL. " +
        (histDisponible ? "Toda la historia con esta clave es de una sola versión: no hay comparación entre versiones." : "Es la primera corrida con esta clave: no hay baseline contra el cual comparar.")
      );
    } else parrafoPartes.push(
      "La comparación entre " + historico.scorecard.versionAnterior + " y " + historico.scorecard.versionActual +
      " de GS32 muestra un estado " + historico.scorecard.verdictLabel.toUpperCase() +
      " (variación global de " + historico.scorecard.globalDeltaLabel + " en el p95 promedio)."
    );
    if (peorRegresion) {
      parrafoPartes.push(
        "El problema más urgente es " + peorRegresion.name + ", que empeoró " + peorRegresion.delta +
        " respecto de la versión anterior y hoy es el principal cuello de botella detectado."
      );
    }
    if (mejorMejora) {
      parrafoPartes.push(
        "Por otro lado, " + mejorMejora.name + " mejoró " + mejorMejora.delta + " respecto de la versión anterior."
      );
    }
    // Todos los FAIL, no solo el primero: con 2 endpoints fallando, nombrar uno solo esconde el otro.
    const fallados = bottlenecks.filter((b) => b.status === "fail");
    const listaNombres = (xs) => xs.length === 1 ? xs[0].name : xs.slice(0, -1).map((x) => x.name).join(", ") + " y " + xs[xs.length - 1].name;
    if (fallados.length) {
      parrafoPartes.push(
        "En esta corrida " + (fallados.length === 1 ? "falló " : "fallaron ") + fallados.map((b) => b.name + ": " + b.motivo.toLowerCase()).join("; ") + "."
      );
    } else if (topBottleneck && (!peorRegresion || topBottleneck.name !== peorRegresion.name)) {
      parrafoPartes.push(
        "En la corrida más reciente, " + topBottleneck.name + " también se destaca: " + topBottleneck.motivo.toLowerCase() + "."
      );
    }
    parrafoPartes.push(
      "Se recomienda priorizar la revisión de " + (peorRegresion ? peorRegresion.name : (fallados.length ? listaNombres(fallados) : (topBottleneck ? topBottleneck.name : "los endpoints marcados en alerta"))) +
      " antes de la próxima versión."
    );

    const cardEscalar = peorRegresion
      ? {
          titulo: "Regresión en " + peorRegresion.name,
          texto: peorRegresion.name + " empeoró " + peorRegresion.delta + " entre " + historico.scorecard.versionAnterior + " y " + historico.scorecard.versionActual + " — el cambio de peor impacto detectado en esta comparación.",
        }
      : (HISTORICO_VERSION_ANTERIOR ? { titulo: "Sin regresiones críticas", texto: "Ningún endpoint empeoró más de 50% respecto de la versión anterior estando además en alerta." }
        : { titulo: "Sin versión anterior", texto: "No hay corridas de otra versión con esta clave: no se puede hablar de regresión todavía." });

    const cardInvestigar = (histDisponible && topPatron && topPatron.patronLabel !== "CONSISTENTE")
      ? {
          titulo: "Variabilidad en " + topPatron.name,
          texto: topPatron.name + " muestra un patrón " + topPatron.patronLabel + " (CV " + topPatron.cvLabel + ") a lo largo de la historia — antes de optimizar conviene entender si son picos reales o ruido de caché/ambiente.",
        }
      : { titulo: "Sin variabilidad destacada", texto: "Los endpoints con más variabilidad histórica no superan el umbral que amerite una investigación puntual." };

    const cardOptimizar = fallados.length > 1
      ? { titulo: "Resolver " + listaNombres(fallados), texto: fallados.map((b) => b.name + ": " + b.motivo).join(". ") + "." }
      : topBottleneck
      ? { titulo: "Optimizar " + topBottleneck.name, texto: topBottleneck.name + ": " + topBottleneck.motivo + "." }
      : { titulo: "Sin blancos claros de optimización", texto: "Ningún endpoint de esta corrida muestra una razón estructural clara para optimizar primero." };

    const recomendaciones = [];
    if (peorRegresion) {
      recomendaciones.push({
        prioridad: "P1", prioridadColorVar: "var(--fail)",
        accion: "Investigar y revertir u optimizar la regresión de " + peorRegresion.name + " antes de la próxima release.",
        seccion: peorRegresion.resource,
        evidencia: "Empeoró " + peorRegresion.delta + " de " + historico.scorecard.versionAnterior + " a " + historico.scorecard.versionActual + ".",
      });
    }
    fallados.forEach((b) => {
      recomendaciones.push({
        prioridad: "P1", prioridadColorVar: "var(--fail)",
        accion: "Resolver la causa del error rate en " + b.name + ".",
        seccion: b.resource,
        evidencia: b.motivo + " (corrida más reciente).",
      });
    });
    if (histDisponible && topPatron && topPatron.patronLabel !== "CONSISTENTE") {
      recomendaciones.push({
        prioridad: "P2", prioridadColorVar: "var(--warn)",
        accion: "Investigar la variabilidad histórica de " + topPatron.name + " (¿picos reales o caché/ambiente?).",
        seccion: topPatron.resource,
        evidencia: "Patrón " + topPatron.patronLabel + ", CV " + topPatron.cvLabel + " sobre " + topPatron.corridas + " corridas.",
      });
    }
    if (histDisponible && topSemaforo) {
      recomendaciones.push({
        prioridad: "P2", prioridadColorVar: "var(--warn)",
        accion: "Revisar la degradación sostenida de " + topSemaforo.name + " contra su baseline histórico.",
        seccion: topSemaforo.resource,
        evidencia: "Δ Global " + topSemaforo.deltaGlobalLabel + " vs baseline " + topSemaforo.baselineLabel + ".",
      });
    }
    if (mejorMejora) {
      recomendaciones.push({
        prioridad: "P3", prioridadColorVar: "var(--accent2)",
        accion: "Confirmar en la próxima corrida que la mejora de " + mejorMejora.name + " se sostiene.",
        seccion: mejorMejora.resource,
        evidencia: "Mejoró " + mejorMejora.delta + " en " + historico.scorecard.versionActual + ".",
      });
    }

    const resumenEjecutivo = {
      parrafo: parrafoPartes.join(" "),
      bottlenecks,
      hasBottlenecks: bottlenecks.length > 0,
      cardEscalar,
      cardInvestigar,
      cardOptimizar,
      recomendaciones,
      hasRecomendaciones: recomendaciones.length > 0,
    };

    return {
      theme,
      historico,
      resumenEjecutivo,
      payload: { heaviestPayloads, latencyPerKBTop, disponible: conPayload.length > 0, vacio: conPayload.length === 0,
        vacioTexto: "El payload por endpoint sale de samples.csv.gz (data_received con su tag de scenario), y esta corrida no lo tiene. Lo único que hay es el total: " + GS32.totales.recvMB.toFixed(1).replace(".", ",") + " MB recibidos en " + GS32.totales.reqs.toLocaleString("es-AR") + " requests." },
      meta: GS32.meta,
      kpi: {
        endpointCount: decorated.length,
        ventanaLabel: windowDurationLabel(RUN_WINDOW_SECONDS),
        ventanaRangoLabel: windowRangeLabel(GS32.meta.inicioHH, GS32.meta.inicioMM, RUN_WINDOW_SECONDS),
        totalIterationsLabel: totalIterations.toLocaleString("es-AR"),
        totalThroughputLabel: totalThroughput.toFixed(1),
        passCount,
        warnCount,
        failCount,
        apdexLabel: apdexAgg == null ? "s/d" : apdexAgg.toFixed(2),
        apdexBand: apdexAggBand.label,
        apdexTNote: GS32.apdex ? "T " + GS32.apdex.tMs + " ms · F " + GS32.apdex.fMs + " ms (universal)" : "sin muestras",
        apdexColorVar: apdexAggBand.varName,
      },
      viewTopExtra: viewMode === "top10" && !hasSelection ? "active" : "",
      viewAllExtra: viewMode === "all" && !hasSelection ? "active" : "",
      viewWarnExtra: viewMode === "warn" && !hasSelection ? "active" : "",
      viewFailExtra: viewMode === "fail" && !hasSelection ? "active" : "",
      filterBtnExtra: state.showFilterPanel ? "active" : "",
      showFilterPanel: !!state.showFilterPanel,
      hasSelection,
      hasResourceSelection,
      selectedCountLabel,
      chips,
      resourceChips,
      modeNote,
      visibleEndpoints,
      overview,
      trend,
      insightTotalLabel: String(insightsAll.hallazgo.length + insightsAll.riesgo.length + insightsAll.confound.length),
      hallazgoCount: insightsAll.hallazgo.length,
      riesgoCount: insightsAll.riesgo.length,
      confoundCount: insightsAll.confound.length,
      hallazgoVisible: hallazgoExpand ? insightsAll.hallazgo : insightsAll.hallazgo.slice(0, DEFAULT_VISIBLE),
      riesgoVisible: riesgoExpand ? insightsAll.riesgo : insightsAll.riesgo.slice(0, DEFAULT_VISIBLE),
      confoundVisible: confoundExpand ? insightsAll.confound : insightsAll.confound.slice(0, DEFAULT_VISIBLE),
      hallazgoHasMore: insightsAll.hallazgo.length > DEFAULT_VISIBLE,
      riesgoHasMore: insightsAll.riesgo.length > DEFAULT_VISIBLE,
      confoundHasMore: insightsAll.confound.length > DEFAULT_VISIBLE,
      hallazgoToggleLabel: hallazgoExpand ? "Ver menos" : "Ver " + (insightsAll.hallazgo.length - DEFAULT_VISIBLE) + " más",
      riesgoToggleLabel: riesgoExpand ? "Ver menos" : "Ver " + (insightsAll.riesgo.length - DEFAULT_VISIBLE) + " más",
      confoundToggleLabel: confoundExpand ? "Ver menos" : "Ver " + (insightsAll.confound.length - DEFAULT_VISIBLE) + " más",
      handlers: {
        showTop10: () => this.setState({ viewMode: "top10", selectedNames: [], selectedResources: [] }),
        showAll: () => this.setState({ viewMode: "all", selectedNames: [], selectedResources: [] }),
        showWarn: () => this.setState({ viewMode: "warn", selectedNames: [], selectedResources: [] }),
        showFail: () => this.setState({ viewMode: "fail", selectedNames: [], selectedResources: [] }),
        clearChips: () => this.setState({ selectedNames: [], selectedResources: [] }),
        toggleFilterPanel: () => this.setState({ showFilterPanel: !this.state.showFilterPanel }),
        toggleHallazgo: () => this.setState({ expandHallazgo: !this.state.expandHallazgo }),
        toggleRiesgo: () => this.setState({ expandRiesgo: !this.state.expandRiesgo }),
        toggleConfound: () => this.setState({ expandConfound: !this.state.expandConfound }),
        showPatronTop10: () => this.setState({ patronMode: "top10" }),
        showPatronAll: () => this.setState({ patronMode: "all" }),
        hoverOut: clearHover,
      },
    };
  }
}

window.dcMontar(Component, document.getElementById('dc-tpl'), document.getElementById('dc-root'),
  { darkMode: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches });
</script>
</body>
</html>
