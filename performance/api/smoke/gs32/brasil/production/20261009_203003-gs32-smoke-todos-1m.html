    const contra = capFilas.filter((f) => f.c.contradiccion);
    if (contra.length) lecturas.push({ tag: "CONTRADICCIÓN", color: "var(--warn)", t: contra.slice(0, 3).map((f) => methodOf(f.c.slug) + " llegó sano a " + num2(f.max) + " TPS pero el " + fechaTxt(f.c.contradiccion.fecha) + " se rompió a " + num2(f.c.contradiccion.tps)).join("; ") + (contra.length > 3 ? "; y " + (contra.length - 3) + " más" : "") + ". Repetir la medición antes de confiar en ese máximo." });
    const sinMedir = capFilas.filter((f) => f.cat === "sinDato" || f.cat === "sinSano");
    if (sinMedir.length) lecturas.push({ tag: "CALIBRAR", color: "var(--text-faint)", t: sinMedir.slice(0, 4).map((f) => methodOf(f.c.slug)).join(", ") + (sinMedir.length > 4 ? " y " + (sinMedir.length - 4) + " más" : "") + ": sin un máximo sano medido. Hace falta un estrés o una carga máxima de cada uno." });
    if (capFilas.some((f) => f.c.baseFuente === "profile")) lecturas.push({ tag: "BASE", color: "var(--text-faint)", t: capFilas.filter((f) => f.c.baseFuente === "profile").length + " endpoints toman el BASE del profile (el export de producción no los tiene): es el tráfico real redondeado para arriba, así que su colchón queda un poco por debajo del real." });
    lecturas.push({ tag: "OJO", color: "var(--fail)", t: "Los máximos son AISLADOS (el endpoint solo, en staging). Con todos a la vez el ambiente compartido aguanta menos: eso lo muestra la escalera combinada, no este colchón." });
    const capacidad = {
      techo: CAP.techoAmbiente,
      techoStyle: "left:" + posLog(CAP.techoAmbiente).toFixed(1) + "%",
      kpis: [
        { l: "En riesgo (< 2×)", v: String(cuenta("riesgo")), s: "endpoints", color: cuenta("riesgo") ? "var(--fail)" : "var(--text)" },
        { l: "Ajustados (2–10×)", v: String(cuenta("ajustado")), s: capFilas.filter((f) => f.cat === "ajustado").slice(0, 2).map((f) => methodOf(f.c.slug)).join(", ") || "ninguno", color: cuenta("ajustado") ? "var(--warn)" : "var(--text)" },
        { l: "Holgados (> 10×)", v: String(cuenta("holgado")), s: "de " + capFilas.length, color: "var(--ok)" },
        { l: "Sin máximo medido", v: String(cuenta("sinDato") + cuenta("sinSano")), s: sinMedir.slice(0, 2).map((f) => methodOf(f.c.slug)).join(", ") || "ninguno", color: "var(--text-faint)" },
        { l: "Techo del ambiente", v: CAP.techoAmbiente + " TPS", s: "por endpoint (no es su capacidad)", color: "var(--text)" },
      ],
      ejes: ejesCap,
      filas: filasCap,
      curva,
      lecturas,
    };

    const TABS = [["ahora", "General"], ["errores", "Errores"], ["capacidad", "Capacidad"], ["historia", "Historia y versiones"], ["payload", "Payload"], ["escenarios", "Escenarios"]];
    const tabs = TABS.map(([id, label]) => ({
      label, badge: id === "errores" && totalFallas ? String(totalFallas) : "", extra: tabActual === id ? "active" : "", pressed: tabActual === id ? "true" : "false",
      onClick: () => this.setState({ tab: id }),
    }));

    // Delta contra su historia, por endpoint de ESTA corrida (mismo baseline que el semáforo).
    const filasActual = histConBaseline.filter((f) => f.timestamp === GS32.meta.runId && !f.escenario);
    const deltaPorEp = new Map(filasActual.map((f) => [f.endpoint, f.deltaGlobalPct]));
    const deltasConocidos = decorated.map((e) => deltaPorEp.get(e.name)).filter((d) => d != null);
    const deltaTextoDe = (d) => (d == null ? "sin historia" : Math.abs(Math.round(d)) + "% " + (d <= 0 ? "más rápido" : "más lento"));

    const conLimite = decorated.filter((e) => e.limite);
    const pasados = conLimite.filter((e) => e.p95Raw > e.limite);
    const masCerca = conLimite.slice().sort((a, b) => usoDe(b) - usoDe(a))[0] || null;
    const errTxt = (e) => methodOf(e.name) + " falló en el " + pctLabel(e.errorRateRaw).replace(".", ",") + " de los pedidos";
    const dMin = deltasConocidos.length ? Math.min.apply(null, deltasConocidos) : null;
    const dMax = deltasConocidos.length ? Math.max.apply(null, deltasConocidos) : null;
    const rangoDeltas = dMin == null ? "" : dMin === dMax ? "Va " + deltaTextoDe(dMin) + " que su historia." : "Contra su historia van de " + deltaTextoDe(dMin) + " a " + deltaTextoDe(dMax) + ".";
    const sc = Object.assign({}, historico.scorecard || {});
    if (sc.globalDeltaLabel) sc.globalDeltaLabel = String(sc.globalDeltaLabel).replace(".", ",");
    const hayVersionAnterior = histDisponible && sc.versionAnterior && sc.versionAnterior !== "sin versión anterior";
    const versionMala = hayVersionAnterior && (sc.verdictLabel === "Mixta" || sc.verdictLabel === "Problemática");
    const preguntas = [
      failCount === 0
        ? { pregunta: "¿Funciona?", respuesta: "Sí", colorVar: "var(--ok)", detalle: (nEp === 1 ? "El endpoint respondió" : "Los " + nEp + " endpoints respondieron") + " sin errores." + (warnCount ? " " + plural(warnCount, "descartó", "descartaron") + " iteraciones (no llegó a la tasa pedida)." : "") }
        : { pregunta: "¿Funciona?", respuesta: failCount * 4 <= nEp ? "Casi todo" : "No", colorVar: "var(--fail)", detalle: (nEp - failCount) + " de " + nEp + " sin errores. " + conErrores.slice(0, 3).map(errTxt).join("; ") + (conErrores.length > 3 ? "; y " + (conErrores.length - 3) + " más" : "") + "." },
      !conLimite.length
        ? { pregunta: "¿Es rápida?", respuesta: "Sin límite", colorVar: "var(--text-dim)", detalle: "Ningún endpoint de esta corrida tiene un tiempo límite definido." }
        : pasados.length === 0
          ? { pregunta: "¿Es rápida?", respuesta: "Sí", colorVar: "var(--ok)", detalle: "Todos por debajo de su tiempo límite." + (masCerca ? " El que más cerca quedó, " + methodOf(masCerca.name) + ", usó el " + pctTxt(usoDe(masCerca)) + " del suyo." : "") }
          : { pregunta: "¿Es rápida?", respuesta: "No en todos", colorVar: "var(--warn)", detalle: plural(pasados.length, "endpoint superó", "endpoints superaron") + " su tiempo límite: " + pasados.slice(0, 3).map((e) => methodOf(e.name) + " (" + msLabel(e.p95Raw) + " de " + msLabel(e.limite) + ")").join(", ") + (pasados.length > 3 ? " y " + (pasados.length - 3) + " más" : "") + "." },
      !histDisponible || !deltasConocidos.length
        ? { pregunta: "¿Empeoró?", respuesta: "Sin historia", colorVar: "var(--text-dim)", detalle: "Todavía no hay suficientes corridas comparables para decirlo." }
        : historico.semaforo.hasRows
          ? { pregunta: "¿Empeoró?", respuesta: "Sí, en " + historico.semaforo.rows.length, colorVar: "var(--warn)", detalle: historico.semaforo.rows.slice(0, 3).map((r) => r.name + " (" + String(r.deltaGlobalLabel).replace(".", ",") + ")").join(", ") + " contra su historia." }
          : versionMala
            ? { pregunta: "¿Empeoró?", respuesta: "Contra la versión anterior, sí", colorVar: "var(--warn)", detalle: "Veredicto " + sc.verdictLabel + " (" + sc.globalDeltaLabel + " en promedio contra " + sc.versionAnterior + "), aunque ninguno pasó el umbral de alerta. " + rangoDeltas }
            : dMax > 0
              ? { pregunta: "¿Empeoró?", respuesta: "Sin alertas", colorVar: "var(--ok)", detalle: "Ninguno pasó el umbral de alerta. " + rangoDeltas }
              : { pregunta: "¿Empeoró?", respuesta: "No", colorVar: "var(--ok)", detalle: (deltasConocidos.length === nEp ? "Todos igual o más rápidos. " : deltasConocidos.length === 1 ? "El único de " + nEp + " con historia, igual o más rápido. " : "Los " + deltasConocidos.length + " de " + nEp + " que tienen historia, igual o más rápidos. ") + rangoDeltas },
    ];
    // Cuarta pregunta (2026-10-08), de la pestaña Capacidad.
    preguntas.push(!menor
      ? { pregunta: "¿Aguanta más carga?", respuesta: "Sin medir", colorVar: "var(--text-dim)", detalle: "Ningún endpoint tiene todavía un máximo sano medido (estrés, escalera o carga máxima)." }
      : { pregunta: "¿Aguanta más carga?", respuesta: menor.cat === "riesgo" ? "No en todos" : "Sí", colorVar: menor.cat === "riesgo" ? "var(--fail)" : menor.cat === "ajustado" ? "var(--warn)" : "var(--ok)",
          detalle: "El que menos margen tiene, " + methodOf(menor.c.slug) + ", aguanta " + (menor.q ? "entre " + xTxt(menor.colchon) + " y " + xTxt(menor.q / menor.c.base) : "al menos " + xTxt(menor.colchon)) + " su tráfico actual." + (sinMedir.length ? " " + (sinMedir.length === 1 ? "Un endpoint todavía no tiene" : sinMedir.length + " endpoints todavía no tienen") + " su máximo medido." : "") });
    // ---- Vista ejecutiva: con qué se midió, datos que más tardan, qué falló (2026-10-09) -------------
    // Todo sale de lo que ya calcula la técnica (GS32.volumen, la apertura por dato, Errores), contado
    // en criollo y sin cifras nuevas. Si una sección no tiene nada que decir, no aparece.
    const V = GS32.volumen || {};
    // Rotó si la corrida declaró pool o si la apertura vio varios datos (en una corrida real coinciden).
    const conPoolEps = GS32.endpoints.filter((x) => x.dataset || (x.apertura && x.apertura.disponible));
    const medido = [];
    if (V.disponible) {
      const conDatos = (V.filas || []).filter((f) => f.totalLabel !== "0");
      const conCambio = (V.filas || []).find((f) => /%/.test(f.deltaLabel || ""));
      const lista = conDatos.slice(0, 4).map((f) => f.totalLabel + " " + String(f.etiqueta).toLowerCase());
      medido.push("La base del ambiente tenía " + (lista.length > 1 ? lista.slice(0, -1).join(", ") + " y " + lista[lista.length - 1] : lista.join("")) + "."
        + (conCambio ? " " + String(V.anteriorLabel).charAt(0).toUpperCase() + String(V.anteriorLabel).slice(1) + ", " + String(conCambio.etiqueta).toLowerCase() + " " + conCambio.deltaLabel + "." : /primera/.test(V.anteriorLabel || "") ? "" : " Sin cambios contra la corrida anterior."));
      if (V.hayAvisos) medido.push("Desde que se armaron los datos de prueba la base cambió bastante: conviene rearmarlos antes de comparar.");
    }
    medido.push(conPoolEps.length
      ? (conPoolEps.length === nEp ? "Todos los endpoints" : conPoolEps.length + " de " + nEp + " endpoints") + " se midieron rotando datos reales (curvas, bonos, especies distintos en cada pedido)"
        + (conPoolEps.length === nEp ? "." : "; el resto, siempre con el mismo dato, que es el mejor caso (la respuesta queda en caché).")
      : "Todos los endpoints se midieron siempre con el mismo dato: es el mejor caso, porque la respuesta queda en caché.");
    const vecesNum = (t) => Number(String(t || "").replace("×", "").replace(",", ".")) || 0;
    // Solo los que tardan más de 5x lo normal del endpoint (f.lento): repetirse entre los 20 más lentos
    // sin ser lento no es un problema. La recurrencia ordena (primero los que se repiten) y va en el texto.
    const datosLentos = GS32.endpoints.flatMap((x) => ((x.apertura && x.apertura.filas) || []).filter((f) => f.lento).map((f) => ({ f, ep: x.slug })))
      .sort((a, b) => (b.f.recurrente - a.f.recurrente) || (vecesNum(b.f.vecesLabel) - vecesNum(a.f.vecesLabel)));
    const datosLentosTop = datosLentos.slice(0, 3).map(({ f, ep }) => ({
      text: f.etiqueta + " tarda " + f.vecesLabel.replace("×", " veces") + " lo normal en " + methodOf(ep)
        + (f.recurrente ? ", y ya pasó en " + f.recurrenciaLabel + " corridas anteriores" : /^0 de/.test(f.recurrenciaLabel) ? ", por primera vez" : "")
        + (f.pocas ? " (con pocas muestras: a confirmar)" : "") + ".",
      etiqueta: f.etiqueta,
    }));
    const mensajeDe = (body) => {
      if (!body) return null;
      try { const j = JSON.parse(body); const m = j.message || j.error || j.detail; if (m) return String(m).slice(0, 140); } catch (e) { /* no es JSON */ }
      return String(body).replace(/\s+/g, " ").trim().slice(0, 140) || null;
    };
    const qFallo = (() => {
      const E2 = GS32.errores || {};
      if (!E2.disponible || !(E2.fallas || []).length) return [];
      const porEpF = new Map();
      E2.fallas.forEach((f) => {
        const g = porEpF.get(f.ep) || { n: 0, tipos: new Set(), datos: new Map() };
        g.n++; g.tipos.add(f.tipo); if (f.dato) g.datos.set(f.dato, (g.datos.get(f.dato) || 0) + 1);
        porEpF.set(f.ep, g);
      });
      const respDe = (ep) => Object.values(E2.respuestas || {}).flat().find((r) => r.ep === ep);
      return Array.from(porEpF.entries()).sort((a, b) => b[1].n - a[1].n).map(([ep, g]) => {
        const datos = Array.from(g.datos.entries()).sort((a, b) => b[1] - a[1]).map(([d]) => d);
        const msg = mensajeDe((respDe(ep) || {}).body);
        return {
          text: methodOf(ep) + ": " + plural(g.n, "pedido con error", "pedidos con error") + " (" + Array.from(g.tipos).join(", ") + ")"
            + (datos.length ? (datos.length === 1 ? ", todos en " + datos[0] : ", en " + datos.slice(0, 2).join(" y ") + (datos.length > 2 ? " y " + (datos.length - 2) + " más" : "")) : "")
            + (msg ? '. El servidor respondió: "' + msg + '"' : "") + ".",
          datos,
        };
      });
    })();
    // Próximo paso concreto: los datos lentos recurrentes y los que fallaron, para pasarle a backend.
    const paraBackend = Array.from(new Set(datosLentos.filter(({ f }) => f.recurrente).map(({ f }) => f.etiqueta).concat(qFallo.flatMap((q) => q.datos)))).slice(0, 5);
    const frioLentos = GS32.endpoints.filter((x) => x.frioMuyLento && x.frio && x.frio.p95 && x.p95);
    const salvedadFrio = frioLentos.length
      ? [{ text: "La primera consulta a cada dato fue mucho más lenta que las siguientes (caché fría) en " + frioLentos.slice(0, 3).map((x) => methodOf(x.slug) + " (" + (x.frio.p95 / x.p95).toFixed(1).replace(".", ",") + " veces)").join(", ") + (frioLentos.length > 3 ? " y " + (frioLentos.length - 3) + " más" : "") + ": un usuario que consulta algo por primera vez espera bastante más que el tiempo de esta corrida." }]
      : [];

    const exec = {
      kicker: GS32.meta.tituloTipo + " de API · GS32 · " + GS32.meta.ambienteLabel + " · " + GS32.meta.versionLabel + " · " + GS32.meta.fechaLabel + ", " + windowRangeLabel(GS32.meta.inicioHH, GS32.meta.inicioMM, RUN_WINDOW_SECONDS),
      titular: failCount > 0
        ? "La API respondió bien en " + (nEp - failCount) + " de " + nEp + " endpoints. " + (failCount === 1 ? "Uno devolvió errores." : failCount + " devolvieron errores.")
        : warnCount > 0
          ? "Sin errores, pero " + plural(warnCount, "endpoint no llegó", "endpoints no llegaron") + " a la tasa pedida."
          : (nEp === 1 ? "El endpoint respondió" : "Los " + nEp + " endpoints respondieron") + " sin errores.",
      lede: "Durante " + windowDurationLabel(RUN_WINDOW_SECONDS) + " se le pidió a " + (nEp === 1 ? "este endpoint" : "cada endpoint") + " una carga de " + GS32.meta.tituloTipo.toLowerCase() + ". " + preguntas.map((q) => q.detalle).join(" "),
      preguntas,
      cifras: [
        { valor: String(nEp), label: nEp === 1 ? "endpoint medido" : "endpoints medidos" },
        { valor: (nEp - failCount) + " de " + nEp, label: "sin errores" },
        { valor: windowDurationLabel(RUN_WINDOW_SECONDS), label: "de carga" },
        histDisponible && deltasConocidos.length
          ? { valor: deltasConocidos.filter((d) => d <= 0).length + " de " + deltasConocidos.length, label: deltasConocidos.length === nEp ? "igual o más rápidos que su historia" : "con historia, igual o más rápidos que ella" }
          : { valor: "sin historia", label: "todavía no hay con qué comparar" },
      ],
      cuellos: bottlenecks.filter((b) => b.esReal),
      sinCuellos: !bottlenecks.some((b) => b.esReal),
      endpoints: decorated.slice().sort((a, b) => (usoDe(b) || 0) - (usoDe(a) || 0)).map((e) => {
        const uso = usoDe(e);
        const d = deltaPorEp.get(e.name);
        return {
          resource: resourceOf(e.name), method: methodOf(e.name),
          p95Label: msLabel(e.p95Raw),
          barStyle: "width: " + (uso == null ? 0 : Math.max(Math.min(uso, 1) * 100, 1.2)).toFixed(1) + "%; background: " + (e.status === "fail" ? "var(--fail)" : e.status === "warn" ? "var(--warn)" : "var(--accent2)") + ";",
          deltaTexto: deltaTextoDe(d),
          deltaColorVar: d == null ? "var(--text-faint)" : d <= 0 ? "var(--ok)" : "var(--warn)",
          statusLabel: statusLabelDe(e), statusClass: e.status,
        };
      }),
      empeoro: !histDisponible
        ? historico.vacioTexto
        : (hayVersionAnterior
          ? "Contra la versión anterior (" + sc.versionAnterior + "): " + sc.verdictEmoji + " " + sc.verdictLabel + " (" + sc.globalDeltaLabel + " en promedio). " + plural(sc.resolvedCount, "problema resuelto", "problemas resueltos") + " y " + plural(sc.newCount, "problema nuevo", "problemas nuevos") + ". "
          : "No hay una versión anterior medida con la misma configuración: la comparación es contra las corridas anteriores de esta versión. ") + (hayVersionAnterior ? rangoDeltas : preguntas[2].detalle),
      salvedades: insightsAll.confound.slice(0, 3).concat(salvedadFrio),
      medido: medido.map((t) => ({ text: t })),
      datosLentos: datosLentosTop,
      hayDatosLentos: datosLentosTop.length > 0,
      datosLentosMas: datosLentos.length > 3 ? "Y " + plural(datosLentos.length - 3, "dato más", "datos más") + " con el mismo problema, en la vista técnica (Apertura por dato)." : "",
      qFallo: qFallo.slice(0, 4),
      hayFallo: qFallo.length > 0,
      qFalloMas: qFallo.length > 4 ? "Y " + plural(qFallo.length - 4, "endpoint más", "endpoints más") + " con errores, en la vista técnica (Errores)." : "",
      paraBackend: paraBackend.length ? "Pasarle a backend estos datos para revisar: " + paraBackend.join(", ") + ". En la vista técnica están el comando y el curl para reproducir cada uno." : "",
      hayParaBackend: paraBackend.length > 0,
    };

    return {
      theme,
      temaUi: {
        claroExtra: dark ? "" : "active", oscuroExtra: dark ? "active" : "",
        claroPressed: dark ? "false" : "true", oscuroPressed: dark ? "true" : "false",
        alClaro: dark ? cambiarTema : () => {}, alOscuro: dark ? () => {} : cambiarTema,
      },
      historico,
      resumenEjecutivo,
      vista: {
        esTecnica: vistaActual === "tecnica", esEjecutiva: vistaActual === "ejecutiva",
        tecnicaExtra: vistaActual === "tecnica" ? "active" : "", ejecutivaExtra: vistaActual === "ejecutiva" ? "active" : "",
        tecnicaPressed: vistaActual === "tecnica" ? "true" : "false", ejecutivaPressed: vistaActual === "ejecutiva" ? "true" : "false",
      },
      tab: { ahora: tabActual === "ahora", errores: tabActual === "errores", capacidad: tabActual === "capacidad", historia: tabActual === "historia", payload: tabActual === "payload", escenarios: tabActual === "escenarios" },
      tabs,
      estado,
      mapa,
      tabla,
      ficha,
      apertura,
      errores,
      capacidad,
      // Volumen de la base (scripts/gs32/informe-html.mjs arma la tarjeta entera; acá solo se dibuja).
      volumen: GS32.volumen || { disponible: false, vacio: true, vacioTexto: "Este informe no trae el volumen de la base." },
      buscador: { valor: state.busqueda || "", alBuscar, limpiar: limpiarBusqueda, activo: !!busqueda },
      exec,
      payload: { heaviestPayloads, latencyPerKBTop, disponible: conPayload.length > 0, vacio: conPayload.length === 0,
        vacioTexto: "El payload por endpoint sale de samples.csv.gz (data_received con su tag de scenario), y esta corrida no lo tiene. Lo único que hay es el total: " + GS32.totales.recvMB.toFixed(1).replace(".", ",") + " MB recibidos en " + GS32.totales.reqs.toLocaleString("es-AR") + " requests." },
      meta: GS32.meta,
      kpi: {
        endpointCount: decorated.length,
        ventanaLabel: windowDurationLabel(RUN_WINDOW_SECONDS),
        ventanaRangoLabel: windowRangeLabel(GS32.meta.inicioHH, GS32.meta.inicioMM, RUN_WINDOW_SECONDS),
        totalIterationsLabel: totalIterations.toLocaleString("es-AR"),
        totalThroughputLabel: totalThroughput.toFixed(1),
        passCount,
        warnCount,
        failCount,
        apdexLabel: apdexAgg == null ? "s/d" : apdexAgg.toFixed(2),
        apdexBand: apdexAggBand.label,
        apdexTNote: GS32.apdex ? "T " + GS32.apdex.tMs + " ms · F " + GS32.apdex.fMs + " ms (universal)" : "sin muestras",
        apdexColorVar: apdexAggBand.varName,
      },
      viewTopExtra: viewMode === "top10" && !hasSelection ? "active" : "",
      viewAllExtra: viewMode === "all" && !hasSelection ? "active" : "",
      viewWarnExtra: viewMode === "warn" && !hasSelection ? "active" : "",
      viewFailExtra: viewMode === "fail" && !hasSelection ? "active" : "",
      filterBtnExtra: state.showFilterPanel ? "active" : "",
      showFilterPanel: !!state.showFilterPanel,
      hasSelection,
      hasResourceSelection,
      selectedCountLabel,
      chips,
      resourceChips,
      modeNote,
      visibleEndpoints,
      overview,
      trend,
      insightTotalLabel: String(insightsAll.hallazgo.length + insightsAll.riesgo.length + insightsAll.confound.length),
      hallazgoCount: insightsAll.hallazgo.length,
      riesgoCount: insightsAll.riesgo.length,
      confoundCount: insightsAll.confound.length,
      hallazgoVisible: hallazgoExpand ? insightsAll.hallazgo : insightsAll.hallazgo.slice(0, DEFAULT_VISIBLE),
      riesgoVisible: riesgoExpand ? insightsAll.riesgo : insightsAll.riesgo.slice(0, DEFAULT_VISIBLE),
      confoundVisible: confoundExpand ? insightsAll.confound : insightsAll.confound.slice(0, DEFAULT_VISIBLE),
      hallazgoHasMore: insightsAll.hallazgo.length > DEFAULT_VISIBLE,
      riesgoHasMore: insightsAll.riesgo.length > DEFAULT_VISIBLE,
      confoundHasMore: insightsAll.confound.length > DEFAULT_VISIBLE,
      hallazgoToggleLabel: hallazgoExpand ? "Ver menos" : "Ver " + (insightsAll.hallazgo.length - DEFAULT_VISIBLE) + " más",
      riesgoToggleLabel: riesgoExpand ? "Ver menos" : "Ver " + (insightsAll.riesgo.length - DEFAULT_VISIBLE) + " más",
      confoundToggleLabel: confoundExpand ? "Ver menos" : "Ver " + (insightsAll.confound.length - DEFAULT_VISIBLE) + " más",
      handlers: {
        showTop10: () => this.setState({ viewMode: "top10", selectedNames: [], selectedResources: [] }),
        showAll: () => this.setState({ viewMode: "all", selectedNames: [], selectedResources: [] }),
        showWarn: () => this.setState({ viewMode: "warn", selectedNames: [], selectedResources: [] }),
        showFail: () => this.setState({ viewMode: "fail", selectedNames: [], selectedResources: [] }),
        clearChips: () => this.setState({ selectedNames: [], selectedResources: [] }),
        toggleFilterPanel: () => this.setState({ showFilterPanel: !this.state.showFilterPanel }),
        toggleHallazgo: () => this.setState({ expandHallazgo: !this.state.expandHallazgo }),
        toggleRiesgo: () => this.setState({ expandRiesgo: !this.state.expandRiesgo }),
        toggleConfound: () => this.setState({ expandConfound: !this.state.expandConfound }),
        showPatronTop10: () => this.setState({ patronMode: "top10" }),
        showPatronAll: () => this.setState({ patronMode: "all" }),
        hoverOut: clearHover,
        verTecnica: ponerVista("tecnica"),
        verEjecutiva: ponerVista("ejecutiva"),
        verTecnicaEndpoints: () => {
          ponerVista("tecnica", { tab: "ahora", mapaVista: "tabla" })();
          const el = typeof document !== "undefined" ? document.getElementById("sec-mapa") : null;
          if (el && el.scrollIntoView) el.scrollIntoView();
        },
      },
    };
  }
}

window.dcMontar(Component, document.getElementById('dc-tpl'), document.getElementById('dc-root'),
  { darkMode: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches });
</script>
</body>
</html>
