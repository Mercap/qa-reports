<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS32 Smoke · brasil/production · 9 de oct de 2026</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { color: var(--accent2); text-decoration: underline; }
    button { font-family: inherit; }

    .gs32-report {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      padding: 40px 48px 64px;
    }

    /* Paletas (Carlos, 2026-10-08, elegidas en el canvas "Rediseño informe GS32" de claude.ai):
       oscura GRAFITO y clara PAPEL FRÍO, de la misma familia para que cada color signifique lo mismo
       en los dos modos: PASS azul, WARN ámbar, FAIL naranja (sin rojo/verde, y distinguibles también
       por claridad). El acento de la interfaz (--accent2: links, pestaña activa, líneas principales)
       es un azul acero apagado, a propósito, para que no compita con el azul de PASS (--ok).
       --accent (p99, enviados, versión actual) y --confound (escenarios) son lavanda y magenta;
       --payload-accent, verde azulado: cada uno con un significado que no repite otro color. */
    [data-theme="dark"] {
      --bg: #0D1117;
      --bg-panel: #151B23;
      --bg-elevated: #1C2430;
      --bg-elevated-2: #252F3D;
      --border: #2A3441;
      --text: #E8EDF3;
      --text-dim: #C9D2DD;
      --text-faint: #A3AEBD;
      --accent: #C4A7FF;
      --accent2: #8FB3D9;
      --ok: #4EA1FF;
      --warn: #F2C14E;
      --fail: #FF8A4C;
      --err5: #FF5A5F; /* 5xx en Errores (2026-10-09): rojo, el ámbar de --warn se leía marrón */
      --confound: #E7A0C9;
      --payload-accent: #3FC1B0;
      --shadow: 0 1px 0 rgb(0 0 0 / 0.35), 0 8px 24px rgb(0 0 0 / 0.35);
    }
    [data-theme="light"] {
      --bg: #F4F6F9;
      --bg-panel: #FFFFFF;
      --bg-elevated: #F9FAFC;
      --bg-elevated-2: #EBEFF4;
      --border: #D6DCE4;
      --text: #14202E;
      --text-dim: #3A4757;
      --text-faint: #566373;
      --accent: #6B4FBB;
      --accent2: #4A6585;
      --ok: #1D6FB8;
      --warn: #9A6700;
      --fail: #B4430F;
      --err5: #C0262D;
      --confound: #A63D85;
      --payload-accent: #0E7C70;
      --shadow: 0 1px 0 rgb(20 32 46 / 0.06), 0 8px 24px rgb(20 32 46 / 0.08);
    }

    .heading-font { font-family: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .brand-row { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: color-mix(in oklch, var(--accent) 22%, var(--bg-elevated));
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .title { font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
    .subtitle { color: var(--text-dim); font-size: 14px; margin: 4px 0 0; }
    .meta-tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .tag {
      font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 6px 10px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--text-faint);
      background: var(--bg-elevated); white-space: nowrap;
    }
    .tag.sample {
      color: var(--accent); border-color: color-mix(in oklch, var(--accent) 45%, transparent);
      background: color-mix(in oklch, var(--accent) 14%, var(--bg-elevated));
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .kpi-tile {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }
    .kpi-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-faint); margin: 0 0 8px;
    }
    .kpi-value {
      font-family: "IBM Plex Mono", monospace;
      font-size: 26px; font-weight: 600; margin: 0; line-height: 1.1;
    }
    .kpi-sub { font-size: 12px; color: var(--text-dim); margin: 0; }
    .kpi-status-row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .kpi-status-row .pass { color: var(--ok); }
    .kpi-status-row .warn { color: var(--warn); }
    .kpi-status-row .fail { color: var(--fail); }

    .section-heading {
      display: flex; align-items: baseline; gap: 10px;
      margin: 0 0 16px;
      /* Compensa la altura del nav sticky para que un salto de #ancla no tape el título. */
      scroll-margin-top: 84px;
    }
    .section-heading h2 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
    .section-heading .count {
      font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-faint);
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
      margin-bottom: 40px;
    }
    .overview-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 6px;
    }
    .overview-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .overview-title { font-size: 12.5px; font-weight: 600; color: var(--text-dim); }
    .overview-value { font-family: "IBM Plex Mono", monospace; font-size: 15.5px; font-weight: 600; color: var(--text); }
    .overview-chart { display: block; width: 100%; height: 84px; overflow: visible; cursor: crosshair; }
    .overview-chart-sm { display: block; width: 100%; height: 56px; overflow: visible; cursor: crosshair; }
    .overview-footnote { font-size: 10.5px; color: var(--text-faint); margin: 4px 0 0; }

    .chart-legend { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
    .chart-legend-time {
      font-size: 10px; color: var(--text-faint); margin: 0 0 2px;
      font-family: "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .legend-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
    .legend-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .legend-row .legend-name {
      color: var(--text-dim); font-family: "IBM Plex Mono", monospace; font-size: 11px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; min-width: 0;
    }
    .legend-row .legend-value {
      font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600;
      color: var(--text); flex-shrink: 0;
    }

    .err-strip { display: flex; gap: 2px; margin-top: 6px; }
    .err-strip span { flex-grow: 1; height: 8px; border-radius: 2px; }
    .err-strip span.active { outline: 1.5px solid var(--text); outline-offset: 0; }

    .controls-bar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 12px; margin-bottom: 14px;
    }
    .view-toggle {
      display: inline-flex; background: var(--bg-elevated-2); border-radius: 999px; padding: 3px;
      gap: 2px;
    }
    .view-btn {
      appearance: none; border: none; cursor: pointer; background: transparent;
      color: var(--text-dim); font-size: 12.5px; font-weight: 500;
      padding: 7px 16px; border-radius: 999px;
    }
    .view-btn.active { background: var(--bg-panel); color: var(--text); box-shadow: var(--shadow); }

    .filter-controls { display: flex; align-items: center; gap: 10px; }
    .filter-btn {
      appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
      background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-dim);
      font-size: 12.5px; font-weight: 500; padding: 7px 14px; border-radius: 999px;
    }
    .filter-btn.active { color: var(--accent2); border-color: color-mix(in oklch, var(--accent2) 45%, transparent); background: color-mix(in oklch, var(--accent2) 12%, var(--bg-panel)); }
    .filter-count {
      font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
      background: var(--accent2); color: var(--bg-panel); border-radius: 999px;
      padding: 1px 6px;
    }
    .clear-chips-btn {
      appearance: none; cursor: pointer; background: none; border: none;
      color: var(--accent2); font-size: 12.5px; padding: 0;
    }

    .chip-group-label {
      font-size: 11px; color: var(--text-faint); margin: 0 0 6px;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .chip-panel {
      display: flex; flex-wrap: wrap; gap: 7px;
      margin-bottom: 16px; padding: 14px; border-radius: 12px;
      background: var(--bg-elevated); border: 1px dashed var(--border);
    }
    .chip {
      appearance: none; cursor: pointer; font-family: "IBM Plex Mono", monospace;
      font-size: 11px; padding: 5px 10px; border-radius: 8px;
      background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-dim);
    }
    .chip.selected {
      color: var(--accent2); border-color: color-mix(in oklch, var(--accent2) 55%, transparent);
      background: color-mix(in oklch, var(--accent2) 18%, var(--bg-panel));
    }
    /* Respuesta del servidor en Errores (2026-10-09). */
    .err-respuestas { margin-top: 18px; }
    .err-resp { border-top: 1px solid var(--border); padding: 10px 0; }
    .err-resp:first-of-type { border-top: none; }
    .err-resp-head { margin: 0 0 4px; font-size: 12.5px; }
    .err-resp-url { margin: 0 0 6px; font-size: 11px; color: var(--text-faint); word-break: break-all; }
    .err-resp-body { white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; font-size: 11.5px; padding: 10px 12px; margin: 0; border-radius: 8px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text); }
    .err-resp-pie { margin: 6px 0 0; font-size: 11px; color: var(--text-faint); }
    /* Apertura por dato (2026-10-09). */
    .apertura { margin: 18px 0 24px; }
    .apertura-table tr.warn td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
    .apertura-table tr.fail td:first-child { box-shadow: inset 3px 0 0 var(--fail); }
    .apertura-table tr.pocas td { color: var(--text-dim); }
    .apertura-table .ap-uuid { font-size: 10.5px; color: var(--text-faint); }
    .ap-copiar { white-space: nowrap; }
    .ap-copiar .chip + .chip { margin-left: 6px; }
    .ap-comando { white-space: pre-wrap; word-break: break-all; font-size: 11.5px; padding: 10px 12px; margin: 6px 0 10px; border-radius: 8px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text); }
    /* Chip que no se puede elegir (p95 contra volumen: entidad sin variación entre corridas). */
    .chip.disabled { opacity: 0.45; cursor: default; }

    .trend-panel {
      background: var(--bg-elevated);
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 18px 22px;
      margin-bottom: 18px;
    }
    .trend-panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 4px; flex-wrap: wrap; }
    .trend-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin: 0 0 2px; }
    .trend-hint-inline { font-size: 11.5px; color: var(--text-faint); margin: 2px 0 0; }
    .trend-body { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; margin-top: 14px; }
    .trend-chart-col { flex: 1 1 340px; min-width: 280px; }
    .trend-chart-big { display: block; width: 100%; height: 190px; overflow: visible; cursor: crosshair; }
    .trend-legend-panel {
      flex: 0 0 230px; max-height: 230px; overflow-y: auto;
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
    }

    .footer-note { font-size: 12px; color: var(--text-faint); margin: 0 0 18px; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr));
      gap: 18px;
      margin-bottom: 40px;
    }
    .ep-card {
      position: relative;
      cursor: pointer;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 16px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .ep-card:hover { border-color: color-mix(in oklch, var(--accent2) 35%, var(--border)); }
    .ep-card.inspecting { border-color: var(--accent2); box-shadow: 0 0 0 1px var(--accent2), var(--shadow); }
    .rank-badge {
      position: absolute; top: -10px; left: -10px;
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--bg-elevated-2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--text-faint);
    }
    .inspect-badge {
      position: absolute; top: -10px; right: -10px;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent2); color: var(--bg-panel);
      display: flex; align-items: center; justify-content: center;
    }
    .ep-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .ep-name { font-family: "IBM Plex Mono", monospace; font-size: 14px; font-weight: 600; margin: 0; word-break: break-word; }
    .ep-desc { font-size: 12px; color: var(--text-faint); margin: 4px 0 0; line-height: 1.4; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
      padding: 5px 10px; border-radius: 999px; flex-shrink: 0;
      white-space: nowrap;
    }
    .status-pill.pass { color: var(--ok); background: color-mix(in oklch, var(--ok) 18%, transparent); border: 1px solid color-mix(in oklch, var(--ok) 40%, transparent); }
    .status-pill.warn { color: var(--warn); background: color-mix(in oklch, var(--warn) 20%, transparent); border: 1px solid color-mix(in oklch, var(--warn) 45%, transparent); }
    .status-pill.fail { color: var(--fail); background: color-mix(in oklch, var(--fail) 20%, transparent); border: 1px solid color-mix(in oklch, var(--fail) 45%, transparent); }

    .ep-body { display: flex; gap: 20px; align-items: center; }
    .ring-block { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; width: 96px; }
    .ring-wrap { position: relative; width: 56px; height: 56px; }
    .ring-pct {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600;
    }
    .ring-labels { text-align: center; }
    .ring-labels .l1, .ring-labels .l2 { font-size: 10.5px; color: var(--text-faint); margin: 0; line-height: 1.5; }
    .ring-labels .v1, .ring-labels .v2 { font-family: "IBM Plex Mono", monospace; color: var(--text); }

    .latency-block { flex-grow: 1; min-width: 0; }
    .latency-track {
      position: relative;
      height: 8px; border-radius: 999px;
      background: var(--bg-elevated-2);
      overflow: visible;
      margin-bottom: 10px;
    }
    .latency-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent2); border-radius: 999px; }
    .latency-p50 { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--text); opacity: 0.55; border-radius: 1px; }
    .latency-p99 { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--accent); opacity: 0.85; border-radius: 1px; }
    .latency-max-dot {
      position: absolute; right: -1px; top: -3px; width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid var(--bg-panel);
    }
    .latency-legend { display: flex; justify-content: space-between; font-family: "IBM Plex Mono", monospace; font-size: 11px; }
    .latency-legend .p50 { color: var(--text-faint); }
    .latency-legend .p95 { color: var(--text-dim); }
    .latency-legend .p99 { color: var(--accent); }

    /* Desglose de fases de la latencia (red/conexión vs espera de backend vs descarga):
       barra apilada CSS simple, sin SVG - alcanza con 3 divs a ancho variable. */
    .phase-bar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; margin-top: 10px; background: var(--bg-elevated-2); }
    .phase-seg.phase-net { background: var(--accent); }
    .phase-seg.phase-wait { background: var(--accent2); }
    .phase-seg.phase-recv { background: var(--text-faint); }
    .phase-legend {
      display: flex; justify-content: space-between; margin-top: 4px;
      font-family: "IBM Plex Mono", monospace; font-size: 9.5px; color: var(--text-faint);
    }

    .pattern-tag {
      font-family: "IBM Plex Mono", monospace; font-size: 9.5px; font-weight: 600;
      letter-spacing: 0.03em; text-transform: uppercase;
    }

    .ep-footer {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; row-gap: 6px; column-gap: 12px;
      border-top: 1px solid var(--border); padding-top: 12px;
      font-size: 11.5px; color: var(--text-faint);
    }
    .ep-footer .val { font-family: "IBM Plex Mono", monospace; color: var(--text-dim); }
    .ep-footer .val.err-ok { color: var(--ok); }
    .ep-footer .val.err-bad { color: var(--fail); }

    .insight-columns {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .insight-column { display: flex; flex-direction: column; gap: 8px; }
    .insight-col-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .insight-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .insight-col-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; flex-grow: 1; }
    .insight-col-count {
      font-family: "IBM Plex Mono", monospace; font-size: 11px;
      border-radius: 999px; padding: 2px 8px;
    }
    .insight-item { border-radius: 12px; padding: 12px 14px; }
    .insight-item p { font-size: 12.5px; line-height: 1.55; color: var(--text-dim); margin: 0; }
    .insight-expand-btn {
      appearance: none; cursor: pointer; background: none; border: none; text-align: left;
      font-size: 12px; padding: 2px 0; margin-top: 2px;
    }

    .col-hallazgo .insight-icon { background: color-mix(in oklch, var(--accent2) 24%, var(--bg-elevated)); color: var(--accent2); }
    .col-hallazgo .insight-col-title { color: var(--accent2); }
    .col-hallazgo .insight-col-count { color: var(--accent2); background: color-mix(in oklch, var(--accent2) 16%, transparent); }
    .col-hallazgo .insight-item { background: color-mix(in oklch, var(--accent2) 8%, var(--bg-elevated)); }
    .col-hallazgo .insight-expand-btn { color: var(--accent2); }

    .col-riesgo .insight-icon { background: color-mix(in oklch, var(--warn) 24%, var(--bg-elevated)); color: var(--warn); }
    .col-riesgo .insight-col-title { color: var(--warn); }
    .col-riesgo .insight-col-count { color: var(--warn); background: color-mix(in oklch, var(--warn) 16%, transparent); }
    .col-riesgo .insight-item { background: color-mix(in oklch, var(--warn) 8%, var(--bg-elevated)); }
    .col-riesgo .insight-expand-btn { color: var(--warn); }

    .col-confound .insight-icon { background: color-mix(in oklch, var(--confound) 26%, var(--bg-elevated)); color: var(--confound); }
    .col-confound .insight-col-title { color: var(--confound); }
    .col-confound .insight-col-count { color: var(--confound); background: color-mix(in oklch, var(--confound) 18%, transparent); }
    .col-confound .insight-item { background: color-mix(in oklch, var(--confound) 9%, var(--bg-elevated)); }
    .col-confound .insight-expand-btn { color: var(--confound); }

    /* ===== Comparativa entre corridas y versiones (2026-09-18) ===== */
    .historico-banner {
      font-size: 12.5px; color: var(--text-dim); margin: 0 0 20px; line-height: 1.5;
      background: var(--bg-elevated); border: 1px dashed var(--border); border-radius: 12px;
      padding: 12px 16px;
    }
    .historico-banner strong { color: var(--text); }

    .historico-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr));
      gap: 20px;
      margin-bottom: 22px;
      align-items: stretch;
    }
    .historico-card {
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px 20px; box-shadow: var(--shadow);
    }
    .historico-card-title {
      font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin: 0 0 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }

    /* Scorecard de versión */
    .verdict-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .verdict-pill {
      display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px;
      padding: 8px 16px; border-radius: 999px; font-family: "Space Grotesk", sans-serif;
    }
    .verdict-sub { font-size: 11.5px; color: var(--text-faint); }
    .scorecard-counts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .scorecard-count-tile {
      border-radius: 12px; padding: 12px 14px; text-align: center;
      background: var(--bg-elevated); border: 1px solid var(--border);
    }
    .scorecard-count-value { font-family: "IBM Plex Mono", monospace; font-size: 24px; font-weight: 700; line-height: 1.1; }
    .scorecard-count-label { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.03em; margin-top: 4px; }
    .scorecard-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; max-height: 130px; overflow-y: auto; }
    .scorecard-list-item {
      display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px;
      padding: 6px 10px; border-radius: 8px; background: var(--bg-elevated);
    }
    .scorecard-list-item .name { color: var(--text-dim); font-family: "IBM Plex Mono", monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .scorecard-list-item .delta { font-family: "IBM Plex Mono", monospace; font-weight: 600; flex-shrink: 0; }
    .scorecard-empty { font-size: 11.5px; color: var(--text-faint); font-style: italic; padding: 10px 0; }

    /* Tendencia de ultimas corridas: barras CSS, sin SVG (mismo criterio que .phase-bar). */
    .trend-bars-wrap { position: relative; height: 150px; margin: 10px 0 8px; }
    .trend-baseline-line {
      position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--fail); opacity: 0.6;
    }
    .trend-bars-row { display: flex; align-items: flex-end; gap: 6px; height: 100%; position: relative; z-index: 1; }
    .trend-bar-col { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .trend-bar { width: 100%; max-width: 26px; border-radius: 4px 4px 0 0; position: relative; }
    .trend-bar.escenario { background-image: repeating-linear-gradient(45deg, transparent, transparent 3px, color-mix(in oklch, white 30%, transparent) 3px, color-mix(in oklch, white 30%, transparent) 6px); }
    .trend-bar { cursor: crosshair; }
    .trend-bar.active { outline: 2px solid var(--text); outline-offset: 1px; }
    .trend-bar-labels { display: flex; gap: 6px; margin-top: 6px; }
    .trend-bar-label-col { flex: 1 1 0; text-align: center; font-size: 8.5px; color: var(--text-faint); font-family: "IBM Plex Mono", monospace; }
    .trend-legend-note { font-size: 10.5px; color: var(--text-faint); margin: 8px 0 0; }

    /* Evolucion por version: barras horizontales. */
    .version-rows { display: flex; flex-direction: column; gap: 10px; }
    .version-row { display: grid; grid-template-columns: 90px 1fr 70px; align-items: center; gap: 10px; }
    .version-row.actual .version-label { color: var(--accent2); font-weight: 700; }
    .version-label { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--text-dim); }
    .version-track { height: 16px; border-radius: 6px; background: var(--bg-elevated-2); overflow: hidden; }
    .version-fill { height: 100%; border-radius: 6px; background: var(--accent2); }
    .version-row.actual .version-fill { background: var(--accent); }
    .version-value { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; }

    /* Semaforo de endpoints */
    .semaforo-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .semaforo-table th {
      text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--text-faint); padding: 6px 10px; border-bottom: 1px solid var(--border);
    }
    .semaforo-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .semaforo-table td.num { font-family: "IBM Plex Mono", monospace; text-align: right; }
    /* th.num centrado (no left, que es el default de la tabla): antes el encabezado numerico
       quedaba pegado a la izquierda mientras el dato de abajo va a la derecha, y se veian
       desalineados - encontrado revisando una captura real del informe. */
    th.num { text-align: center; }
    .subsection-divider { border-top: 1px dashed var(--border); margin: 18px 0; }
    .info-tip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 13px; height: 13px; border-radius: 50%; margin-left: 4px;
      background: var(--bg-elevated-2); color: var(--text-faint);
      font-size: 9px; font-weight: 700; cursor: help; vertical-align: middle;
    }
    .semaforo-table tr:last-child td { border-bottom: none; }
    .semaforo-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; flex-shrink: 0; }
    .semaforo-name-cell { display: flex; align-items: center; }
    .semaforo-name { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; }

    /* Distribucion historica / patron */
    .patron-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .patron-table th {
      text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--text-faint); padding: 6px 10px; border-bottom: 1px solid var(--border);
    }
    .patron-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .patron-table td.num { font-family: "IBM Plex Mono", monospace; text-align: right; }
    .patron-table tr:last-child td { border-bottom: none; }
    .patron-badge {
      font-family: "IBM Plex Mono", monospace; font-size: 9.5px; font-weight: 700;
      padding: 3px 8px; border-radius: 999px; letter-spacing: 0.02em;
    }
    .escenario-callout {
      margin-top: 14px; padding: 12px 14px; border-radius: 10px;
      background: color-mix(in oklch, var(--confound) 10%, var(--bg-elevated));
      border: 1px solid color-mix(in oklch, var(--confound) 30%, var(--border));
      font-size: 11.5px; color: var(--text-dim); line-height: 1.5;
    }
    .escenario-callout strong { color: var(--confound); }

    /* ===== Escenarios: catalogo + detalle + comparar (2026-09-18) ===== */
    .escn-catalogo-row { cursor: pointer; }
    .escn-catalogo-row:hover td { background: var(--bg-elevated); }
    .escn-catalogo-row.selected td { background: color-mix(in oklch, var(--confound) 12%, transparent); }
    .escn-catalogo-row td:first-child { font-weight: 600; }
    .scn-single-banner {
      display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px;
      padding: 10px 14px; border-radius: 10px;
      background: color-mix(in oklch, var(--warn) 12%, var(--bg-elevated));
      border: 1px solid color-mix(in oklch, var(--warn) 35%, var(--border));
      border-left: 3px solid var(--warn);
      font-size: 11.5px; color: var(--text-dim); line-height: 1.5;
    }
    .scn-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .scn-narrativa {
      font-size: 12px; color: var(--text-dim); line-height: 1.55; margin: 0 0 18px;
      padding: 10px 14px; border-radius: 10px; background: var(--bg-elevated);
      border-left: 3px solid var(--accent2);
    }
    .scn-hallazgos-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
    .scn-hallazgos-empty { font-size: 11.5px; color: var(--text-faint); grid-column: 1 / -1; }
    .scn-hallazgos-col-title { font-size: 11px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
    .scn-compare-empty { font-size: 11.5px; color: var(--text-faint); padding: 10px 0; }

    /* ===== Resumen ejecutivo en lenguaje llano + Conclusiones/Recomendaciones (2026-09-18) ===== */
    .parrafo-card {
      display: flex; align-items: flex-start; gap: 14px;
      background: color-mix(in oklch, var(--accent2) 10%, var(--bg-panel));
      border: 1px solid color-mix(in oklch, var(--accent2) 30%, var(--border));
      border-radius: 14px; padding: 18px 22px; margin-bottom: 28px;
    }
    .parrafo-card-icon { font-size: 20px; line-height: 1.4; flex-shrink: 0; }
    .parrafo-card p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--text); }

    .subsection-title { font-size: 13px; font-weight: 700; margin: 0 0 12px; color: var(--text); }

    .conclusiones-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .conclusion-card { border-radius: 14px; padding: 16px 18px; border: 1px solid var(--border); }
    .conclusion-card.escalar { background: color-mix(in oklch, var(--fail) 8%, var(--bg-panel)); border-color: color-mix(in oklch, var(--fail) 35%, var(--border)); }
    .conclusion-card.investigar { background: color-mix(in oklch, var(--warn) 8%, var(--bg-panel)); border-color: color-mix(in oklch, var(--warn) 35%, var(--border)); }
    .conclusion-card.optimizar { background: color-mix(in oklch, var(--accent2) 8%, var(--bg-panel)); border-color: color-mix(in oklch, var(--accent2) 35%, var(--border)); }
    .conclusion-eyebrow {
      font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
      display: flex; align-items: center; gap: 6px; margin: 0 0 8px;
    }
    .conclusion-card.escalar .conclusion-eyebrow { color: var(--fail); }
    .conclusion-card.investigar .conclusion-eyebrow { color: var(--warn); }
    .conclusion-card.optimizar .conclusion-eyebrow { color: var(--accent2); }
    .conclusion-title { font-size: 14px; font-weight: 700; margin: 0 0 8px; color: var(--text); }
    .conclusion-text { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; margin: 0; }

    .recom-table, .bottleneck-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 28px; }
    .recom-table th, .bottleneck-table th {
      text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--text-faint); padding: 6px 10px; border-bottom: 1px solid var(--border);
    }
    .recom-table td, .bottleneck-table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .recom-table tr:last-child td, .bottleneck-table tr:last-child td { border-bottom: none; }
    .recom-evidencia { font-size: 11px; color: var(--text-faint); font-style: italic; }
    .prioridad-pill {
      display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 700;
      padding: 2px 8px; border-radius: 999px; color: var(--bg-panel); white-space: nowrap;
    }
    .bottleneck-name-cell { display: flex; align-items: center; gap: 8px; }

    /* ===== Payload y eficiencia de transferencia (2026-09-18) ===== */
    .payload-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr));
      gap: 20px; margin-bottom: 28px; align-items: start;
    }
    .rank-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .rank-table th {
      text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--text-faint); padding: 6px 10px; border-bottom: 1px solid var(--border);
    }
    .rank-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .rank-table td.num { font-family: "IBM Plex Mono", monospace; text-align: right; }
    .rank-table tr:last-child td { border-bottom: none; }
    .band-badge {
      font-family: "IBM Plex Mono", monospace; font-size: 9.5px; font-weight: 700;
      padding: 3px 8px; border-radius: 999px; letter-spacing: 0.02em; white-space: nowrap;
    }
    .outlier-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-family: "IBM Plex Mono", monospace; font-size: 9px; font-weight: 700;
      color: var(--fail); background: color-mix(in oklch, var(--fail) 16%, transparent);
      padding: 2px 7px; border-radius: 999px; margin-left: 6px; white-space: nowrap;
    }
    .cache-fria-badge {
      display: inline-flex; align-items: center; gap: 3px; cursor: help;
      font-family: "IBM Plex Mono", monospace; font-size: 9px; font-weight: 600;
      color: var(--accent2); background: color-mix(in oklch, var(--accent2) 14%, transparent);
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
    }
    .band-legend {
      display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 0; font-size: 10.5px; color: var(--text-faint);
    }
    .band-legend span.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

    footer.report-footer {
      margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border);
      font-size: 11.5px; color: var(--text-faint); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    footer.report-footer .mono { font-family: "IBM Plex Mono", monospace; }


    /* ===== Vista técnica + vista ejecutiva (Carlos, 2026-10-08) =====
       Un solo informe, dos vistas: la técnica tiene TODOS los paneles (en pestañas), la ejecutiva
       cuenta la misma corrida al grano. El selector va en el encabezado fijo; #ejecutiva en la URL
       abre directo la ejecutiva. Mismos tokens de color que el resto del informe. */
    .report-header {
      position: sticky; top: 0; z-index: 30;
      margin: -40px -48px 28px; padding: 16px 48px;
      background: var(--bg); border-bottom: 1px solid var(--border);
    }
    .report-header .top-bar { margin-bottom: 0; align-items: center; }
    .header-side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .header-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
    .vista-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .vista-btn {
      appearance: none; cursor: pointer; border: none; background: transparent;
      color: var(--text-dim); font-size: 13px; font-weight: 600; padding: 9px 16px; min-height: 40px;
    }
    .vista-btn.active { background: var(--text); color: var(--bg); }

    .estado-band {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr));
      gap: 18px; margin-bottom: 22px; scroll-margin-top: 120px;
    }
    .estado-card {
      border-radius: 16px; padding: 22px 24px; border: 1px solid var(--border);
      background: var(--bg-panel); display: flex; flex-direction: column; gap: 12px;
    }
    .estado-card.fail { border-color: var(--fail); background: color-mix(in oklch, var(--fail) 9%, var(--bg-panel)); }
    .estado-card.warn { border-color: var(--warn); background: color-mix(in oklch, var(--warn) 9%, var(--bg-panel)); }
    .estado-card.pass { border-color: color-mix(in oklch, var(--ok) 50%, var(--border)); }
    .estado-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); margin: 0; }
    .estado-titular { font-size: 26px; font-weight: 700; line-height: 1.2; margin: 0; text-wrap: pretty; }
    .estado-parrafo { font-size: 14px; line-height: 1.6; color: var(--text); margin: 0; }
    .estado-acciones { display: flex; flex-direction: column; }
    .conclusiones-grid.conclusiones-stack { grid-template-columns: minmax(0, 1fr); gap: 10px; margin-bottom: 0; }
    .link-btn {
      appearance: none; cursor: pointer; background: none; border: none; padding: 6px 0;
      align-self: flex-start; color: var(--accent2); font-size: 13.5px; font-weight: 600;
    }
    .link-btn:hover { text-decoration: underline; }

    .heat-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px; margin-bottom: 28px;
    }
    .heat-tile {
      appearance: none; cursor: pointer; text-align: left; font-family: inherit; color: var(--text);
      display: flex; flex-direction: column; gap: 4px; min-height: 112px; padding: 12px 14px;
      border-radius: 12px; border: 1px solid var(--border);
    }
    .heat-tile:hover { border-color: var(--accent2); }
    .heat-tile.fail { border: 2px solid var(--fail); }
    .heat-tile.warn { border: 2px solid var(--warn); }
    .heat-api { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); }
    .heat-name { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; line-height: 1.3; word-break: break-word; }
    .heat-p95 { font-size: 18px; font-weight: 600; margin-top: auto; }
    .heat-sub { font-size: 11.5px; color: var(--text-dim); }

    .tabs {
      position: sticky; top: 104px; z-index: 20;
      display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 24px; padding: 6px;
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
    }
    .tab-btn {
      appearance: none; cursor: pointer; border: none; background: transparent;
      color: var(--text-dim); font-size: 13.5px; font-weight: 600; padding: 10px 16px; border-radius: 8px; min-height: 40px;
    }
    .tab-btn.active { background: var(--bg-panel); color: var(--text); box-shadow: 0 0 0 1px var(--accent2); }

    .exec { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
    .exec-kicker { font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); margin: 0; }
    .exec-titular { font-size: 40px; line-height: 1.12; font-weight: 700; margin: -16px 0 0; text-wrap: pretty; }
    .exec-lede { font-size: 17px; line-height: 1.6; color: var(--text); margin: 0; max-width: 820px; }
    .exec-preguntas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 14px; }
    .exec-pregunta { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; }
    .exec-q { font-size: 14px; font-weight: 600; color: var(--text-dim); margin: 0; }
    .exec-a { font-size: 28px; font-weight: 700; margin: 0; }
    .exec-d { font-size: 14.5px; line-height: 1.55; color: var(--text-dim); margin: 0; }
    .exec-cifras {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 20px 16px;
      padding: 20px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    .exec-cifra-v { font-size: 30px; font-weight: 700; margin: 0; font-variant-numeric: tabular-nums; }
    .exec-cifra-l { font-size: 13.5px; color: var(--text-dim); margin: 4px 0 0; }
    .exec-sec { display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1px solid var(--border); }
    .exec-h { font-size: 24px; font-weight: 700; margin: 0; }
    .exec-recom { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; }
    .exec-recom-accion { font-weight: 600; }
    .exec-recom-ev { color: var(--text-dim); }
    .exec-row { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--border); font-size: 15px; line-height: 1.5; }
    .exec-row-main { display: inline-flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .exec-strong { font-weight: 600; }
    .exec-faint { color: var(--text-faint); font-size: 12px; }
    .exec-ep-head, .exec-ep {
      display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(110px, 2fr) 90px 130px 70px; gap: 14px; align-items: center;
    }
    .exec-ep-head { font-size: 12px; color: var(--text-faint); }
    .exec-ep-head .num, .exec-ep .num { text-align: right; }
    .exec-ep { padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
    .exec-ep-name { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
    .exec-bar { position: relative; display: block; height: 10px; border-radius: 5px; background: var(--bg-elevated-2); }
    .exec-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
    .exec-backend { margin-top: 12px; }
    .exec-salvedades { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: var(--text-dim); }
    .exec-cta {
      display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between;
      padding: 18px 22px; border-radius: 14px; background: var(--bg-elevated); border: 1px solid var(--border);
    }
    .cta-btn {
      appearance: none; cursor: pointer; border: none; border-radius: 10px; padding: 12px 18px; min-height: 44px;
      background: var(--text); color: var(--bg); font-size: 14px; font-weight: 600;
    }


    /* Mapa + ficha (maestro-detalle, 2026-10-08). Escala a 50+ endpoints: con más de 16 las
       baldosas pasan a compactas, el mapa tiene alto máximo con scroll propio y la ficha queda
       fija al costado; orden "peor primero" o "por API" (agrupado) y filtro "con problemas". */
    .mapa-ficha {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(560px, 100%), 1fr));
      gap: 18px; margin-bottom: 28px; align-items: start; scroll-margin-top: 120px;
    }
    .mapa-panel, .ficha {
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0;
    }
    .mapa-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
    .mapa-head h2 { font-size: 17px; margin: 0; }
    .mapa-leyenda { font-size: 12px; color: var(--text-faint); }
    .mapa-controles { display: flex; flex-wrap: wrap; gap: 8px; }
    .buscador { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
    .buscador-label { font-size: 12px; font-weight: 600; color: var(--text-dim); }
    .buscador-input {
      flex: 1 1 220px; min-width: 0; min-height: 40px; padding: 8px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text);
      font-family: "IBM Plex Mono", monospace; font-size: 13px;
    }
    .buscador-input:focus { outline: 2px solid var(--accent2); outline-offset: 1px; }
    .buscador-nota { font-size: 12px; color: var(--text-faint); font-family: "IBM Plex Mono", monospace; }
    .mapa-scroll { max-height: 760px; overflow-y: auto; padding-right: 4px; }
    .mapa-grupo { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); margin: 10px 0 6px; }
    .mapa-scroll .heat-grid { margin-bottom: 8px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .heat-grid.compacto { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)) !important; gap: 6px; }
    .heat-grid.compacto .heat-tile { min-height: 64px; padding: 8px 9px; gap: 2px; border-radius: 9px; }
    .heat-grid.compacto .heat-api { display: none; }
    .heat-grid.compacto .heat-name { font-size: 10.5px; }
    .heat-grid.compacto .heat-p95 { font-size: 13px; }
    .heat-grid.compacto .heat-sub { font-size: 10px; }
    .heat-tile.sel { box-shadow: 0 0 0 2px var(--text); }
    .mapa-scroll { overflow-x: auto; }
    .ep-tabla { width: 100%; min-width: 860px; border-collapse: collapse; font-size: 12.5px; }
    .ep-tabla thead th {
      position: sticky; top: 0; z-index: 1; background: var(--bg-panel); text-align: left;
      border-bottom: 1px solid var(--border); padding: 0;
    }
    .ep-tabla th.num { text-align: right; }
    .ep-tabla-th {
      appearance: none; border: none; background: none; cursor: pointer; width: 100%; text-align: inherit;
      padding: 8px 8px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--text-faint); white-space: nowrap;
    }
    .ep-tabla-th:hover { color: var(--text); }
    .ep-tabla-flecha { color: var(--accent2); }
    .ep-tabla td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .ep-tabla td.num { text-align: right; font-family: "IBM Plex Mono", monospace; white-space: nowrap; }
    .ep-tabla-fila { cursor: pointer; }
    .ep-tabla-fila:hover td { background: var(--bg-elevated); }
    .ep-tabla-fila.sel td { background: color-mix(in oklch, var(--accent2) 14%, var(--bg-panel)); }
    .ep-tabla-api { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); }
    .ep-tabla-nombre {
      appearance: none; border: none; background: none; padding: 0; cursor: pointer; text-align: left;
      font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; color: var(--text);
    }
    .ep-tabla-fuerte { font-weight: 600; }
    .mapa-ficha.con-tabla { grid-template-columns: minmax(0, 2.4fr) minmax(320px, 1fr); }
    .ep-tabla-ep { max-width: 190px; }
    .ep-tabla-ep .ep-tabla-api, .ep-tabla-ep .ep-tabla-nombre {
      display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ep-tabla td { padding: 7px 6px; }
    .ep-tabla .status-pill { padding: 3px 8px; font-size: 10.5px; }
    .con-tabla .ficha-cuerpo { grid-template-columns: minmax(0, 1fr); justify-items: start; }
    @media (max-width: 1180px) { .mapa-ficha.con-tabla { grid-template-columns: minmax(0, 1fr); } .con-tabla .ficha { position: static; } }
    .ficha { position: sticky; top: 120px; }
    .ficha.fail { border-color: var(--fail); }
    .ficha.warn { border-color: var(--warn); }
    .ficha-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .ficha-nombre { font-size: 16px; font-weight: 600; margin: 2px 0 0; word-break: break-word; }
    .ficha-cuerpo { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 18px; align-items: center; }
    .ficha-lat { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .ficha-tps { font-size: 13.5px; color: var(--text-dim); margin: 0 0 6px; }
    .ficha-barra { position: relative; height: 14px; border-radius: 4px; background: var(--bg-elevated-2); }
    .ficha-barra span { position: absolute; top: 0; bottom: 0; }
    .ficha-barra-p50 { left: 0; background: var(--ok); border-radius: 4px 0 0 4px; }
    .ficha-barra-p95 { background: color-mix(in oklch, var(--ok) 55%, var(--bg-panel)); }
    .ficha-barra-p99 { top: -3px !important; bottom: -3px !important; width: 2px; background: var(--accent); }
    .ficha-barra-max { top: -3px !important; bottom: -3px !important; width: 2px; background: var(--text); }
    .ficha-barra-lim { top: -5px !important; bottom: -5px !important; width: 2px; background: var(--fail); }
    .ficha-lat-leyenda { font-size: 12px; color: var(--text-dim); margin: 0; }
    .ficha-datos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .ficha-dato { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
    .ficha-dato .estado-eyebrow { font-size: 10.5px; }
    .ficha-dato-v { font-size: 15px; font-weight: 600; margin: 0; }
    .ficha-dato-sub { font-size: 11.5px; color: var(--text-dim); margin: 0; line-height: 1.45; }
    .ficha-chart { display: block; width: 100%; height: 150px; overflow: visible; cursor: crosshair; }


    /* ===== Pestañas Errores y Capacidad (2026-10-08) ===== */
    .tab-badge { margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-family: "IBM Plex Mono", monospace; font-size: 11px; background: color-mix(in oklch, var(--fail) 22%, transparent); color: var(--fail); }
    .tab-sec { display: flex; flex-direction: column; gap: 18px; margin-bottom: 32px; }
    .tab-sec .kpi-row, .tab-sec .historico-grid { margin-bottom: 0; }
    .table-scroll { overflow-x: auto; }
    .err-bloque { display: flex; flex-direction: column; gap: 10px; }
    .patron-card { border-radius: 14px; padding: 18px 22px; border: 1px solid var(--warn); background: color-mix(in oklch, var(--warn) 9%, var(--bg-panel)); display: flex; flex-direction: column; gap: 8px; }
    .patron-titulo { font-size: 20px; font-weight: 700; margin: 0; line-height: 1.25; }
    .err-timeline { display: flex; align-items: flex-end; gap: 2px; height: 110px; border-bottom: 1px solid var(--border); }
    .err-col { flex: 1 1 0; display: flex; flex-direction: column-reverse; min-height: 4px; background: var(--bg-elevated-2); border-radius: 2px 2px 0 0; }
    .err-seg { display: block; width: 100%; }
    .err-eje { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-faint); }
    .err-leyenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-dim); }
    .err-leyenda > span { display: inline-flex; align-items: center; gap: 6px; }
    .err-sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .err-fila { cursor: pointer; }
    .err-fila:hover td { background: var(--bg-elevated); }
    .err-fila.sel td { background: color-mix(in oklch, var(--accent2) 14%, var(--bg-panel)); }
    .err-matriz td.num { border-radius: 6px; }
    .cap-intro { line-height: 1.6; font-size: 13.5px; }
    .cap-grid { display: grid; grid-template-columns: minmax(200px, 280px) minmax(360px, 1fr) 120px; gap: 0 16px; align-items: center; min-width: 760px; }
    .cap-eje { position: relative; height: 18px; font-size: 10.5px; color: var(--text-faint); }
    .cap-eje span { position: absolute; transform: translateX(-50%); }
    .cap-col-colchon { text-align: right; margin: 0; }
    .cap-nombre { display: flex; flex-direction: column; padding: 8px 0; border-top: 1px solid var(--border); min-width: 0; }
    .cap-nombre .mono { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cap-nota { font-size: 11px; line-height: 1.35; }
    .cap-pista { position: relative; height: 44px; border-top: 1px solid var(--border); align-self: stretch; }
    .cap-techo { position: absolute; top: 6px; bottom: 6px; width: 2px; background: var(--fail); opacity: 0.6; }
    .cap-colchon { text-align: right; font-size: 14px; font-weight: 600; border-top: 1px solid var(--border); align-self: stretch; display: flex; align-items: center; justify-content: flex-end; }
    .cap-sw-base { width: 11px; height: 11px; border-radius: 50%; background: var(--text); display: inline-block; }
    .cap-sw-run { width: 9px; height: 9px; transform: rotate(45deg); background: var(--accent); display: inline-block; }
    .cap-sw-bar { width: 22px; height: 8px; border-radius: 4px; background: var(--ok); display: inline-block; }
    .cap-sw-quiebre { width: 3px; height: 14px; background: var(--warn); display: inline-block; }
    .cap-sw-techo { width: 2px; height: 14px; background: var(--fail); display: inline-block; }
    .cap-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .cap-curva { display: block; width: 100%; height: 280px; overflow: visible; }
    .cap-lectura { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 13px; line-height: 1.55; color: var(--text-dim); }
    .cap-lectura .mono { font-size: 11px; font-weight: 700; }


    /* ===== Pop-ups (2026-10-08): etiqueta compacta al pasar, tarjeta con contexto al hacer clic ===== */
    .tip-capa { position: absolute; z-index: 1000; font-family: "IBM Plex Sans", system-ui, sans-serif; pointer-events: auto; }
    .tip-capa[hidden] { display: none; }
    .tip-compacta {
      max-width: 260px; display: flex; flex-direction: column; gap: 5px; padding: 9px 11px; border-radius: 8px;
      background: var(--text); color: var(--bg); box-shadow: 0 8px 24px rgb(0 0 0 / 0.28); font-size: 12px; pointer-events: none;
    }
    .tip-compacta::after {
      content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; margin-left: -5px;
      transform: rotate(45deg); background: var(--text);
    }
    .tip-compacta.abajo::after { bottom: auto; top: -5px; }
    .tip-tarjeta {
      width: 290px; display: flex; flex-direction: column; gap: 9px; padding: 14px 16px; border-radius: 12px;
      background: var(--bg-panel); color: var(--text); border: 1px solid var(--border); box-shadow: 0 14px 36px rgb(0 0 0 / 0.22); font-size: 12.5px;
    }
    .tip-eyebrow { display: block; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.75; }
    .tip-titulo { display: block; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; word-break: break-word; }
    .tip-txt { display: block; line-height: 1.5; }
    .tip-fila { display: flex; align-items: center; gap: 8px; }
    .tip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .tip-et { opacity: 0.85; }
    .tip-val { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-weight: 600; text-align: right; }
    .tip-chip { align-self: flex-start; margin-top: 2px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; color: var(--bg); }
    .tip-cab { display: flex; align-items: flex-start; gap: 8px; }
    .tip-cab-txt { display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0; }
    .tip-tarjeta .tip-eyebrow { color: var(--text-faint); opacity: 1; }
    .tip-pill { padding: 3px 8px; border-radius: 999px; border: 1px solid; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
    .tip-cerrar {
      appearance: none; border: none; background: none; cursor: pointer; color: var(--text-faint);
      font-size: 18px; line-height: 1; width: 28px; height: 28px; margin: -6px -8px 0 0; border-radius: 6px;
    }
    .tip-cerrar:hover { background: var(--bg-elevated-2); color: var(--text); }
    .tip-grande { display: flex; align-items: baseline; gap: 8px; }
    .tip-grande-v { font-family: "IBM Plex Mono", monospace; font-size: 22px; font-weight: 700; }
    .tip-grande-l { font-size: 12px; color: var(--text-dim); }
    .tip-barra { position: relative; display: block; height: 8px; border-radius: 4px; background: var(--bg-elevated-2); }
    .tip-barra-v { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
    .tip-barra-lim { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--fail); }
    .tip-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .tip-dato { display: flex; flex-direction: column; gap: 1px; padding: 6px 8px; border-radius: 8px; background: var(--bg-elevated); }
    .tip-dato .tip-et { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); opacity: 1; }
    .tip-dato .tip-val { margin-left: 0; text-align: left; }
    .tip-porque { display: block; line-height: 1.45; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 8px; }
    .tip-pie { display: block; font-size: 10.5px; color: var(--text-faint); }
    [data-tip], [data-tip-texto] { cursor: help; }
    .heat-tile[data-tip], .ep-tabla-ep[data-tip] { cursor: pointer; }

    @media (max-width: 760px) {
      .gs32-report { padding: 24px 16px 48px; }
      .historico-card { overflow-x: auto; }
      .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .overview-grid { grid-template-columns: minmax(0, 1fr); }
      .trend-body { flex-direction: column; }
      .trend-legend-panel { flex-basis: auto; width: 100%; }
      .insight-columns { grid-template-columns: minmax(0, 1fr); }
      .top-bar { flex-direction: column; }
      .meta-tags { justify-content: flex-start; }
      .controls-bar { flex-direction: column; align-items: stretch; }
      .report-header { margin: -24px -16px 20px; padding: 12px 16px; position: static; }
      .header-side { align-items: flex-start; }
      .tabs { position: static; }
      .ficha { position: static; }
      .ficha-cuerpo { grid-template-columns: minmax(0, 1fr); justify-items: start; }
      .exec-titular { font-size: 30px; }
      .exec-ep-head { display: none; }
      .exec-ep { grid-template-columns: minmax(0, 1fr) 90px; }
    }
  </style>

</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div class="gs32-report" data-theme="{{theme}}">

  <header class="report-header">
    <div class="top-bar">
    <div class="brand-row">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-7 4 14 2-7h6"></path></svg>
      </div>
      <div>
        <h1 class="title heading-font">GS32 — {{meta.tituloTipo}}</h1>
        <p class="subtitle">{{kpi.endpointCount}} endpoints en paralelo, cada uno a su tasa · {{meta.ambienteLabel}}</p>
      </div>
    </div>
      <div class="header-side">
    <div class="meta-tags">
      <span class="tag">{{meta.versionLabel}}</span>
      <span class="tag">Ventana {{kpi.ventanaLabel}}</span>
      <span class="tag">{{meta.fechaLabel}} · {{kpi.ventanaRangoLabel}}</span>
    </div>
        <div class="header-controls">
          <div class="vista-switch" role="group" aria-label="Modo de color">
            <button type="button" class="vista-btn {{temaUi.claroExtra}}" aria-pressed="{{temaUi.claroPressed}}" onClick="{{temaUi.alClaro}}">Claro</button>
            <button type="button" class="vista-btn {{temaUi.oscuroExtra}}" aria-pressed="{{temaUi.oscuroPressed}}" onClick="{{temaUi.alOscuro}}">Oscuro</button>
          </div>
          <div class="vista-switch" role="group" aria-label="Vista del informe">
            <button type="button" class="vista-btn {{vista.tecnicaExtra}}" aria-pressed="{{vista.tecnicaPressed}}" onClick="{{handlers.verTecnica}}">Técnica</button>
            <button type="button" class="vista-btn {{vista.ejecutivaExtra}}" aria-pressed="{{vista.ejecutivaPressed}}" onClick="{{handlers.verEjecutiva}}">Ejecutiva</button>
          </div>
          <span class="status-pill fail">{{kpi.failCount}} FAIL</span>
          <span class="status-pill warn">{{kpi.warnCount}} WARN</span>
          <span class="status-pill pass">{{kpi.passCount}} PASS</span>
        </div>
      </div>
    </div>
  </header>

  <template data-if="vista.esTecnica">

  <section class="estado-band" id="sec-resumen">
    <div class="estado-card {{estado.clase}}">
      <p class="estado-eyebrow">Resumen ejecutivo · {{insightTotalLabel}} puntos clave</p>
      <p class="estado-titular heading-font">{{estado.titular}}</p>
      <p class="estado-parrafo">{{resumenEjecutivo.parrafo}}</p>
      <button type="button" class="link-btn" onClick="{{handlers.verEjecutiva}}">Ver la vista ejecutiva</button>
    </div>
    <div class="estado-acciones">
    <p class="subsection-title">💡 Conclusiones y accionables</p>
  <div class="conclusiones-grid conclusiones-stack">
    <div class="conclusion-card escalar">
      <p class="conclusion-eyebrow">🚨 Escalar de forma prioritaria</p>
      <p class="conclusion-title">{{resumenEjecutivo.cardEscalar.titulo}}</p>
      <p class="conclusion-text">{{resumenEjecutivo.cardEscalar.texto}}</p>
    </div>
    <div class="conclusion-card investigar">
      <p class="conclusion-eyebrow">🔍 Investigar</p>
      <p class="conclusion-title">{{resumenEjecutivo.cardInvestigar.titulo}}</p>
      <p class="conclusion-text">{{resumenEjecutivo.cardInvestigar.texto}}</p>
    </div>
    <div class="conclusion-card optimizar">
      <p class="conclusion-eyebrow">⚡ Optimizar</p>
      <p class="conclusion-title">{{resumenEjecutivo.cardOptimizar.titulo}}</p>
      <p class="conclusion-text">{{resumenEjecutivo.cardOptimizar.texto}}</p>
    </div>
  </div>
    </div>
  </section>

  <div class="kpi-row">
    <div class="kpi-tile">
      <p class="kpi-label">Endpoints medidos</p>
      <p class="kpi-value">{{kpi.endpointCount}}</p>
    </div>
    <div class="kpi-tile">
      <p class="kpi-label">Duración de la corrida</p>
      <p class="kpi-value">{{kpi.ventanaLabel}}</p>
    </div>
    <div class="kpi-tile">
      <p class="kpi-label">Iteraciones totales</p>
      <p class="kpi-value">{{kpi.totalIterationsLabel}}</p>
    </div>
    <div class="kpi-tile">
      <p class="kpi-label">Throughput general</p>
      <p class="kpi-value">{{kpi.totalThroughputLabel}}<span style="font-size:14px;color:var(--text-faint);"> it/s</span></p>
    </div>
    <div class="kpi-tile">
      <p class="kpi-label">Estado general</p>
      <div class="kpi-status-row">
        <p class="kpi-value pass">{{kpi.passCount}}</p>
        <p class="kpi-sub">PASS</p>
        <p class="kpi-value warn">{{kpi.warnCount}}</p>
        <p class="kpi-sub">WARN</p>
        <p class="kpi-value fail">{{kpi.failCount}}</p>
        <p class="kpi-sub">FAIL</p>
      </div>
    </div>
    <div class="kpi-tile">
      <p class="kpi-label">Apdex <span class="info-tip" tabindex="0" role="button" aria-label="Ayuda" data-tip-texto="Índice de satisfacción de 0 a 1 sobre las iteraciones medidas: satisfecha si tarda ≤ 500 ms, tolerable si tarda ≤ 1500 ms, frustrada si tarda más o falló. T y F son los mismos para todo endpoint, ambiente y tipo de test: es una lectura rápida, no un criterio, y en un estrés lo esperable es que dé mal. Escala: ≥ 0,94 excelente, ≥ 0,85 bueno, ≥ 0,70 regular, ≥ 0,50 pobre, menos inaceptable. Promedio simple entre endpoints.">?</span></p>
      <p class="kpi-value" style="color: {{kpi.apdexColorVar}};">{{kpi.apdexLabel}}</p>
      <p class="kpi-sub">{{kpi.apdexBand}} · {{kpi.apdexTNote}}</p>
    </div>
  </div>

  <section class="mapa-ficha {{mapa.layoutClase}}" id="sec-mapa">
    <div class="mapa-panel">
      <div class="mapa-head">
        <h2 class="heading-font">Los {{kpi.endpointCount}} endpoints</h2>
        <span class="mapa-leyenda">color = cuánto de su límite de p95 usa · borde = FAIL o WARN</span>
      </div>
      <div class="buscador">
        <label class="buscador-label" for="buscador-mapa">Buscar endpoint o API</label>
        <input id="buscador-mapa" class="buscador-input" type="search" placeholder="ej. bonds, coupons, by-uuid" value="{{buscador.valor}}" autocomplete="off" onInput="{{buscador.alBuscar}}">
        <template data-if="buscador.activo">
          <span class="buscador-nota">{{mapa.busquedaNota}}</span>
          <button type="button" class="clear-chips-btn" onClick="{{buscador.limpiar}}">Limpiar</button>
        </template>
      </div>
      <div class="mapa-controles">
        <div class="view-toggle" role="group" aria-label="Mapa o tabla">
          <button type="button" class="view-btn {{mapa.vistaMapaExtra}}" onClick="{{mapa.verMapa}}">Mapa</button>

  <section class="historico-card apertura" id="sec-apertura" aria-label="Apertura por dato del endpoint elegido">
    <p class="historico-card-title"><span>Apertura por dato · <span class="mono">{{apertura.endpoint}}</span></span><span class="count">qué curva, bono o especie es la lenta, para reproducirla</span></p>

    </template>
    <template data-if="apertura.disponible">

      <template data-if="apertura.disperso">
        <div class="escenario-callout" style="margin-bottom: 10px;">{{apertura.dispersoTexto}}</div>
      </template>
      <div class="table-scroll">
        <table class="semaforo-table apertura-table">
          <thead>
            <tr>
              <th>Dato</th>
              <th class="num">Muestras</th>
              <th class="num">p50</th>
              <th class="num">p95</th>
              <th class="num">Máx</th>
              <th class="num">Primera <span class="info-tip" tabindex="0" role="button" aria-label="Ayuda" data-tip-texto="La primera pegada a ESTE dato en la corrida. Mucho más lenta que su p50 = caché fría.">?</span></th>
              <th class="num">vs mediana <span class="info-tip" tabindex="0" role="button" aria-label="Ayuda" data-tip-texto="El p95 de este dato dividido la mediana de TODOS los pedidos del endpoint. Más de 5× = el problema es del dato.">?</span></th>
              <th>Errores</th>
              <th>Se repite <span class="info-tip" tabindex="0" role="button" aria-label="Ayuda" data-tip-texto="En cuántas de las corridas anteriores con la misma clave de baseline este dato también estuvo entre los 20 más lentos. Recurrente = el que importa para backend.">?</span></th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <template data-for="apertura.filasVisibles" data-as="f">
              <tr class="{{f.filaClase}}">
                <td><span>{{f.etiqueta}}</span><br><span class="mono ap-uuid" tabindex="0" data-tip-texto="{{f.uuid}}">{{f.uuidCorto}}</span></td>
                <td class="num">{{f.nLabel}}</td>
                <td class="num">{{f.p50Label}}</td>
                <td class="num">{{f.p95Label}}</td>
                <td class="num">{{f.maxLabel}}</td>
                <td class="num">{{f.primeraLabel}}</td>
                <td class="num">{{f.vecesLabel}}</td>
                <td>{{f.erroresLabel}}</td>
                <td>{{f.recurrenciaLabel}}</td>
                <td class="ap-copiar"><button type="button" class="chip" onClick="{{f.copiar}}">{{f.copiadoLabel}}</button><template data-if="f.curl"><button type="button" class="chip" onClick="{{f.copiarCurl}}">{{f.copiadoCurlLabel}}</button></template></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <template data-if="apertura.hayMas">
        <button type="button" class="insight-expand-btn" onClick="{{apertura.verMas}}">{{apertura.verMasLabel}}</button>
      </template>
      <p class="estado-eyebrow" style="margin-top: 12px;">{{apertura.copiaTitulo}}</p>
      <pre class="mono ap-comando">{{apertura.copia}}</pre>
      <template data-if="apertura.mostrarNotaCurl">
        <p class="trend-legend-note">El curl repite el pedido tal como salió en la corrida (método, URL, headers y body, incluida la fecha de esa corrida). La credencial NO va: usa las variables {{apertura.credVars}}, que hay que exportar antes (o reemplazar). Al final muestra el status y el tiempo.</p>
      </template>
      <template data-if="apertura.sinCurl">
        <p class="trend-legend-note">{{apertura.sinCurlTexto}}</p>
      </template>
      <p class="trend-legend-note">"Se repite" mira {{apertura.previasLabel}}. Filas en ámbar: más de 5× la mediana; en rojo: con errores; "pocas": menos de 3 muestras, candidato a revisar y no un dato firme (con 100 datos rotando, cada uno recibe pocas pegadas en una corrida corta: la recurrencia es la que lo vuelve confiable). Los más lentos y, además, los que fallaron aunque sean rápidos.</p>
    </template>
  </section>

      </template>
    </div>
    <template data-if="errores.sinErrores">

        <p class="estado-parrafo">{{errores.patron.texto}}</p>
      </div>
    </template>
    <div class="historico-card err-bloque">

          </span>

      <div class="err-leyenda">
        <template data-for="errores.categorias" data-as="c"><span><span class="err-sw" style="background: {{c.color}};"></span>{{c.label}}</span></template>
      </div>
    </div>
    <div class="historico-grid">
      <div class="historico-card">
        <p class="historico-card-title"><span>Por tipo de error</span><span class="count">clic en una fila filtra las otras tablas</span></p>
        <div class="table-scroll">

            <tbody>
              <template data-for="errores.porTipo" data-as="r">
                <tr class="err-fila {{r.selClass}}" onClick="{{r.onClick}}">
                  <td><span class="semaforo-dot" style="background: {{r.color}};"></span><span class="mono">{{r.tipo}}</span></td>
                  <td>{{r.significa}}</td>
                  <td class="num">{{r.n}}</td>
                  <td class="num">{{r.endpoints}}</td>
                  <td class="mono">{{r.primeraUltima}}</td>

                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <template data-if="errores.filtroActivo"><button type="button" class="clear-chips-btn" onClick="{{errores.limpiarFiltro}}">Ver todos los tipos</button></template>
      </div>
      <div class="historico-card">
        <p class="historico-card-title"><span>Por endpoint</span><span class="count">solo los que tuvieron errores</span></p>
        <div class="table-scroll">
          <table class="semaforo-table">
            <thead><tr><th>Endpoint</th><th class="num">Error rate</th><th class="num">Errores</th><th>En qué pedido</th><th>Qué dato</th><th>Corridas anteriores</th></tr></thead>

                  <td>{{e.historia}}</td>

        </div>

    <div class="historico-card err-respuestas" id="sec-err-respuestas">

              <button type="button" class="chip {{chip.extraClass}}" onClick="{{chip.pick}}">{{chip.label}}</button>
            </template>
          </div>

        <template data-for="errores.respuestasVisibles" data-as="rb">
          <div class="err-resp">

          </div>

    <div class="historico-card err-bloque">

  </template>

  <template data-if="tab.capacidad">
  <section class="tab-sec" aria-label="Capacidad por endpoint">
    <div class="historico-banner cap-intro">
      <strong>¿Cuánto más tráfico aguanta cada endpoint antes de degradarse?</strong> Colchón = el mayor TPS que aguantó SANO ÷ su tráfico real (BASE). 25× = soporta 25 veces su tráfico de hoy. El máximo no sale de esta corrida: sale de las escaleras, estrés y cargas máximas ya corridas con el endpoint SOLO (sano = sin errores, sin descartes y p95 bajo su límite). “≥” = nunca se rompió: su máximo real es mayor y no se conoce; “entre X y Y” = se rompió en Y.
    </div>
    <div class="kpi-row">
      <template data-for="capacidad.kpis" data-as="k">
        <div class="kpi-tile"><p class="kpi-label">{{k.l}}</p><p class="kpi-value" style="color: {{k.color}};">{{k.v}}</p><p class="kpi-sub">{{k.s}}</p></div>
      </template>
    </div>
    <div class="historico-card err-bloque">
      <p class="historico-card-title"><span>Mapa de capacidad</span><span class="count">menos colchón primero · TPS en escala logarítmica</span></p>
      <div class="err-leyenda">
        <span><span class="cap-sw-base"></span>BASE (tráfico real)</span>
        <span><span class="cap-sw-run"></span>esta corrida</span>
        <span><span class="cap-sw-bar"></span>hasta el máximo sano</span>
        <span><span class="cap-sw-quiebre"></span>quiebre</span>
        <span><span class="cap-sw-techo"></span>techo del ambiente ({{capacidad.techo}} TPS)</span>
      </div>
      <div class="table-scroll">
        <div class="cap-grid">
          <span></span>
          <div class="cap-eje mono"><template data-for="capacidad.ejes" data-as="x"><span style="{{x.style}}">{{x.l}}</span></template></div>
          <span class="kpi-label cap-col-colchon">Colchón</span>
          <template data-for="capacidad.filas" data-as="f">
            <span class="cap-nombre" data-tip="{{f.tip}}" tabindex="0"><span class="ep-tabla-api">{{f.resource}}</span><span class="mono">{{f.method}}</span><span class="cap-nota" style="color: {{f.notaColor}};">{{f.nota}}</span></span>
            <div class="cap-pista" data-tip="{{f.tip}}">
              <span class="cap-techo" style="{{capacidad.techoStyle}}"></span>
              <span style="{{f.barra}}"></span>
              <span style="{{f.flecha}}"></span>
              <span style="{{f.quiebre}}"></span>
              <span style="{{f.base}}"></span>
              <span style="{{f.run}}"></span>
            </div>
            <span class="mono cap-colchon" style="color: {{f.color}};">{{f.colchon}}</span>
          </template>
        </div>
      </div>
    </div>
    <div class="historico-grid">
      <div class="historico-card">
        <p class="historico-card-title"><span>Curva de degradación</span><span class="count">p95 a cada nivel de TPS</span></p>
        <template data-if="capacidad.curva.hay">
          <div class="cap-chips">
            <template data-for="capacidad.curva.chips" data-as="c"><button type="button" class="chip {{c.selClass}}" onClick="{{c.onClick}}">{{c.label}}</button></template>
          </div>
          <svg viewBox="0 0 640 280" class="cap-curva" role="img" aria-label="{{capacidad.curva.aria}}">
            <line x1="50" y1="250" x2="630" y2="250" stroke="var(--border)"></line>
            <line x1="50" y1="10" x2="50" y2="250" stroke="var(--border)"></line>
            <template data-if="capacidad.curva.limiteY">
              <line x1="50" y1="{{capacidad.curva.limiteY}}" x2="630" y2="{{capacidad.curva.limiteY}}" stroke="var(--fail)" stroke-dasharray="5 4"></line>
              <text x="626" y="{{capacidad.curva.limiteTextoY}}" text-anchor="end" fill="var(--fail)" font-size="11" font-family="IBM Plex Mono, monospace">límite p95 {{capacidad.curva.limiteLabel}}</text>
            </template>
            <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="{{capacidad.curva.points}}"></polyline>
            <template data-for="capacidad.curva.puntos" data-as="pt">
              <circle cx="{{pt.x}}" cy="{{pt.y}}" r="6" fill="{{pt.color}}" stroke="var(--bg-panel)" stroke-width="2" tabindex="0" data-tip="{{pt.tip}}"></circle>
            </template>
            <template data-for="capacidad.curva.ticksX" data-as="t">
              <text x="{{t.x}}" y="268" text-anchor="middle" fill="var(--text-faint)" font-size="10.5" font-family="IBM Plex Mono, monospace">{{t.l}}</text>
            </template>
            <template data-for="capacidad.curva.ticksY" data-as="t">
              <text x="44" y="{{t.y}}" text-anchor="end" fill="var(--text-faint)" font-size="10.5" font-family="IBM Plex Mono, monospace">{{t.l}}</text>
            </template>
            <text x="630" y="268" text-anchor="end" fill="var(--text-faint)" font-size="10.5" font-family="IBM Plex Mono, monospace">TPS</text>
          </svg>
          <p class="footer-note">{{capacidad.curva.nota}}</p>
        </template>
        <template data-if="capacidad.curva.noHay">
          <p class="scorecard-empty">Ningún endpoint de esta corrida tiene una escalera con 3 niveles o más: corré una (npm run api:ladder) para ver dónde se quiebra cada uno.</p>
        </template>
      </div>
      <div class="historico-card">
        <p class="historico-card-title"><span>Lectura</span></p>
        <template data-for="capacidad.lecturas" data-as="x">
          <div class="cap-lectura"><span class="mono" style="color: {{x.color}};">{{x.tag}}</span><span>{{x.t}}</span></div>
        </template>
      </div>
    </div>
  </section>
  </template>
